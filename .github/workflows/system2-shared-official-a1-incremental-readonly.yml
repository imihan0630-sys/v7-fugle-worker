name: System2 Shared Official TWSE TPEx A1 Incremental (READ ONLY)

on:
  push:
    branches: [main]
    paths:
      # A source-loader/seed integrity change must get a real bounded SOURCE-only
      # readback on main, not just offline CI. Existing cron clocks unchanged.
      - ".github/workflows/system2-shared-official-a1-incremental-readonly.yml"
      - "system2/scripts/discover_shared_official_a1_seed_v0_1.mjs"
      - "system2/scripts/run_shared_official_a1_incremental_v0_1.mjs"
  schedule:
    # 20:15 Taipei Mon-Fri: additional PRELIMINARY SOURCE-ONLY time hedge.
    # On 2026-10-14 both official T raw markets were genuinely captured
    # by 20:04 Taipei, but GH 23:45 and 00:15 jobs actually started
    # 03:42 and 04:10 Taipei T+1, past the 01:59 PIT window.
    # This is NOT a new final-freeze clock or a guarantee of provider
    # availability on any other trading date.
    - cron: "15 12 * * 1-5"
    # 23:45 Taipei Mon-Fri: owner-approved EARLY SOURCE-ONLY observation.
    # This does NOT run the final frozen capacity clock. Exact official
    # provider marketDate and raw SHA must independently prove readiness.
    # A late/delayed run cannot backdate a decision or source observation.
    - cron: "45 15 * * 1-5"
    # 00:15 Taipei Tue-Sat: conditional read-only source recovery for the
    # SAME official trading date T, not a new or previously frozen pick.
    # Date still resolved against official calendar + source confirmation.
    - cron: "15 16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: shared-official-a1-readonly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  current_source:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Record exact GitHub schedule event attribution (source-only, NOT actual-slot proof)
        run: |
          set -euo pipefail
          node --check system2/scripts/record_shared_a1_github_schedule_origin_v0_1.mjs
          node system2/scripts/record_shared_a1_github_schedule_origin_v0_1.mjs
      - name: Test original SHA, strict source cache and S1/S2 read-only boundary
        run: |
          set -euo pipefail
          node --check system2/scripts/run_shared_official_a1_incremental_v0_1.mjs
          node --check system2/scripts/discover_shared_official_a1_seed_v0_1.mjs
          node --test system2/tests/shared_official_a1_incremental_v0_1.test.mjs
          git diff --exit-code -- Worker.js wrangler.toml
      - name: Find previous read-only exact original data artifact
        id: seed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node system2/scripts/discover_shared_official_a1_seed_v0_1.mjs
      - name: Reuse previously validated official TWSE TPEx data
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.seed.outputs.seed_run_id }}
          name: ${{ steps.seed.outputs.seed_artifact_name }}
          path: /tmp/s2-shared-a1-seed
          github-token: ${{ github.token }}
      # 19:00 Taipei is PRELIMINARY_SOURCE_REVIEW_ONLY under owner policy.
      # 20:15 is an additional source-observation opportunity only;
      # no rank, PIT qualification, capacity or Frozen may be inferred.
      # 23:45 here is ONLY earlier original-source capture, never an
      # independently eligible FINAL_FROZEN capacity/selection.
      # 00:15 can reuse exact original hashes for the same date T; provider
      # freshness and physical arrival time never inherit scheduled time.
      # A 200 response without exact report date and full 122 originals fails closed.
      - name: Collect only missing market/date pairs and verify raw SHA/source date
        env:
          S2_SHARED_A1_SEED_ORIGINAL_DIR: /tmp/s2-shared-a1-seed/original-json
        run: |
          set -euo pipefail
          SEED="$(find /tmp/s2-shared-a1-seed -maxdepth 1 -name 'official-61-*.json' -type f -print -quit)"
          test -n "$SEED"
          export S2_SHARED_A1_SEED_EVIDENCE_FILE="$SEED"
          node system2/scripts/run_shared_official_a1_incremental_v0_1.mjs
      - name: Summarize exact official source count without granting selection authority
        if: always()
        run: |
          set -euo pipefail
          FILE='/tmp/s2-shared-a1-official-incremental/shared-official-a1-run.json'
          if [ ! -s "$FILE" ]; then
            echo 'Shared A1 source receipt absent: NO_SOURCE_PROMOTION' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          MARKET_DATE="$(jq -r '.marketDate // "UNKNOWN"' "$FILE")"
          PAIRS="$(jq -r '.validatedPairs // 0' "$FILE")"
          EXPECTED="$(jq -r '.plannedPairs // 122' "$FILE")"
          SOURCE_STATE="$(jq -r '.state // "UNKNOWN"' "$FILE")"
          test "$EXPECTED" = '122'
          if [ "$SOURCE_STATE" = 'SOURCE_OBSERVED_UNAUDITED' ]; then
            test "$PAIRS" = '122'
            echo "Original TWSE/TPEx market-date evidence $MARKET_DATE: 122/122 source observed, independent PIT and Stage1 still required." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Original TWSE/TPEx market-date evidence $MARKET_DATE: $PAIRS/122, source incomplete; not an accepted Shadow/zero-pick/Frozen day." >> "$GITHUB_STEP_SUMMARY"
            SAFE_MISSING_PAIRS="$(jq -c '.missingAfterFetch // []' "$FILE")"
            echo "Still missing exact market/date pairs AFTER fetch (sanitized codes only): $SAFE_MISSING_PAIRS" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'Source collection is read-only and cannot authorize ranking, frozen selections or V8 Formal.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain SHA manifest and original data as short-term cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s2-shared-official-a1-${{ github.run_id }}
          path: /tmp/s2-shared-a1-official-incremental/
          if-no-files-found: warn
          retention-days: 7
      - name: No-privilege-promotion declaration
        if: always()
        run: |
          echo 'Public original data with SHA256; System1/System2 read-only research only.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No D1, V8, Cloudflare Writer, Worker/Cron, push, Frozen or orders.' >> "$GITHUB_STEP_SUMMARY"
          echo '7-day GitHub Actions Artifact is CACHE, not an immutable long-term archive.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Durable archival publication and individual D1 imports require separate verified writer approval.' >> "$GITHUB_STEP_SUMMARY"
