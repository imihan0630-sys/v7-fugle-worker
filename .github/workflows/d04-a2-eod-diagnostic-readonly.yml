name: D04 A2 TAIEX EOD Diagnostic Read-only

on:
  schedule:
    - cron: "30 8 * * 1-5"
  workflow_dispatch:
    inputs:
      market_date:
        description: "Same-day Taiwan market date only (YYYY-MM-DD); blank = today Asia/Taipei"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: d04-a2-taiex-eod-diagnostic
  cancel-in-progress: false

jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      market_date: ${{ steps.date.outputs.market_date }}
      expected_trading_day: ${{ steps.calendar.outputs.expected_trading_day }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve same-Taipei-date only
        id: date
        env:
          INPUT_MARKET_DATE: ${{ inputs.market_date }}
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(TZ=Asia/Taipei date +%F)"
          MARKET_DATE="${INPUT_MARKET_DATE:-$TODAY}"
          test "$MARKET_DATE" = "$TODAY"
          echo "market_date=$MARKET_DATE" >> "$GITHUB_OUTPUT"

      - name: Official TWSE trading-day gate
        id: calendar
        env:
          MARKET_DATE: ${{ steps.date.outputs.market_date }}
        run: |
          node system2/scripts/check_twse_trading_day_readonly.mjs             --market-date "$MARKET_DATE"

  diagnostic:
    needs: calendar
    if: ${{ needs.calendar.outputs.expected_trading_day == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Collect D04 A2 end-of-day diagnostic
        env:
          MARKET_DATE: ${{ needs.calendar.outputs.market_date }}
        run: |
          set -euo pipefail
          node research/runtime/d04_a2_eod_diagnostic_v0_1.mjs             --market-date "$MARKET_DATE"             --output-dir "research/artifacts/d04-a2-eod-$MARKET_DATE"

      - name: Upload immutable diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: d04-a2-eod-${{ needs.calendar.outputs.market_date }}-${{ github.run_id }}
          path: research/artifacts/d04-a2-eod-*
          if-no-files-found: error
          retention-days: 90

      - name: Reassert research-only boundary
        run: |
          set -euo pipefail
          test ! -f research/artifacts/.mutation
          ! grep -Eiq 'wrangler[[:space:]]+(deploy|delete)|d1[[:space:]]+(create|execute)|SYSTEM2_CAPTURE_ENABLED[[:space:]]*=[[:space:]]*true|secrets\.'             .github/workflows/d04-a2-eod-diagnostic-readonly.yml
          echo "PASS: separate D04 EOD epoch; no existing Decision Clock collector mutation"
