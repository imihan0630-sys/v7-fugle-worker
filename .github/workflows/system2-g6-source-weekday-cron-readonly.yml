name: System2 SOURCE G6 Weekday Cron GET-Only Proof
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: s2-source-g6-weekday-cron-original-getonly
  cancel-in-progress: false
jobs:
  source_scoped_get:
    if: >-
      github.repository == 'imihan0630-sys/v7-fugle-worker' &&
      github.event.issue.number == 1130 &&
      github.event.comment.user.login == 'imihan0630-sys' &&
      github.event.comment.body == '/s2 g6 source-readonly'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: system2-research
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Strict safe source-only tests and V8 Formal file invariant
        run: |
          set -euo pipefail
          node --test system2/tests/source_system2_weekday_cron_getonly_v0_1.test.mjs
          node --test system2/tests/source_system2_cron_pause_owner_approved_v0_1.test.mjs
          git diff --exit-code -- Worker.js wrangler.toml
      - name: Authenticated existing source token GET-only weekday schedule snapshot
        id: source_get
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node system2/migration/source_system2_weekday_cron_getonly_v0_1.mjs
      - name: Classify original source worker identity after native GET failure (no mutation)
        if: failure() && steps.source_get.outcome == 'failure'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node system2/migration/source_g6_worker_identity_readonly_diag_v0_1.mjs
      - name: Retain sanitized worker identity differential evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s2-source-g6-worker-identity-${{ github.run_id }}
          path: /tmp/system2-source-g6-worker-identity-diagnosis/receipt.json
          retention-days: 30
          if-no-files-found: warn
      - name: Retain sanitized native original receipt for independent audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s2-source-g6-weekday-cron-getonly-${{ github.run_id }}
          path: /tmp/system2-source-g6-weekday-getonly/receipt.json
          retention-days: 30
          if-no-files-found: warn
      - name: Never promote absent event or HTTP proof
        if: always()
        run: |
          echo 'Existing SOURCE Cloudflare INSPECT: GET-only; 0 D1 SQL, 0 schedule mutations, 0 Worker deploy, 0 destination calls.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Configuration snapshot must NOT be called no-scheduled-event telemetry or V8 business parity.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Any Cloudflare, audit or G6/G7 formal acceptance needs separately scoped original evidence.' >> "$GITHUB_STEP_SUMMARY"
