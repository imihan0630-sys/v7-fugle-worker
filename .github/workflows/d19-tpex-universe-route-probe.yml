name: D19 TPEx Universe Route Probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/d19-tpex-universe-route-probe.yml"
      - "system2/scripts/d19_tpex_universe_route_probe_v0_1.mjs"
      - "system2/scripts/d19_tpex_historical_universe_smoke_v0_1.mjs"
      - "system2/runtime/d19_tpex_historical_universe_source_v0_1.mjs"
      - "system2/tests/d19_tpex_historical_universe_source_v0_1.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe TPEx current and delisted universe routes
        run: node system2/scripts/d19_tpex_universe_route_probe_v0_1.mjs
      - name: Build full TPEx historical universe and frozen snapshot
        run: node system2/scripts/d19_tpex_historical_universe_smoke_v0_1.mjs

      - name: Confirm production isolation
        run: |
          set -euo pipefail
          test "$(sed -n '1p' wrangler.toml)" = 'name = "fugle-test"'
          git diff --exit-code -- wrangler.toml Worker.js
          echo "Production isolation PASS"
