name: System2 Expanded Missing Revision Control Discovery Readonly

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "system2/scripts/probe_expanded_missing_revision_controls_readonly_v0_2.mjs"
      - "system2/SYSTEM2_EXPANDED_MISSING_REVISION_CONTROL_DISCOVERY_V0_2.md"
      - ".github/workflows/system2-expanded-missing-revision-control-discovery-readonly.yml"
  push:
    branches: [main]
    paths:
      - "system2/scripts/probe_expanded_missing_revision_controls_readonly_v0_2.mjs"
      - "system2/SYSTEM2_EXPANDED_MISSING_REVISION_CONTROL_DISCOVERY_V0_2.md"
      - ".github/workflows/system2-expanded-missing-revision-control-discovery-readonly.yml"

permissions:
  contents: read

concurrency:
  group: system2-expanded-missing-revision-control-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run expanded representative-control discovery
        run: node system2/scripts/probe_expanded_missing_revision_controls_readonly_v0_2.mjs

      - name: Confirm read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -qE 'CLOUDFLARE|SYSTEM2_DB|wrangler|secret|deploy|INSERT|UPDATE|DELETE' system2/scripts/probe_expanded_missing_revision_controls_readonly_v0_2.mjs
          echo "Expanded missing revision control discovery read-only boundary PASS"
