name: D02 PVE270 H001 Dual Prerequisite Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/d02_pve270_h001_dual_prerequisite_gate_v0_1.mjs"
      - "tests/test_d02_pve270_h001_dual_prerequisite_gate_v0_1.mjs"
      - ".github/workflows/d02-pve270-h001-dual-prerequisite-gate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/test_d02_pve270_h001_dual_prerequisite_gate_v0_1.mjs
