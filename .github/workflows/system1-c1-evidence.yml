name: System 1 C1 Prospective Evidence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/system1-c1-evidence.yml'
  workflow_dispatch:
    inputs:
      scan_date:
        description: Optional Taiwan scan date (YYYY-MM-DD); blank reads the previous Taiwan session
        required: false
        type: string
  schedule:
    - cron: "10 16 * * 1-5" # 00:10 Asia/Taipei, after the 23:35 production scan

permissions:
  contents: read

concurrency:
  group: system1-c1-prospective-evidence
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate V8.19 generation inventory semantics
        run: node tests/test_system1_c1_generation_inventory_validation_v0_1.mjs
      - name: Validate V8.20 Formal-C1 binding readback semantics
        run: node tests/test_system1_formal_c1_binding_validation_v0_1.mjs
      - name: Read and verify the immutable C1 population receipt
        env:
          V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
          C1_SCAN_DATE: ${{ inputs.scan_date }}
          C1_EVIDENCE_OUTPUT: artifacts/system1-c1-evidence.json
          C2_EVIDENCE_OUTPUT: artifacts/system1-c2-paired.json
          C1_READINESS_OUTPUT: artifacts/system1-c1-readiness.json
          C1_INVENTORY_OUTPUT: artifacts/system1-c1-generation-inventory.json
          FORMAL_C1_BINDING_OUTPUT: artifacts/system1-formal-c1-binding.json
          C3_REGISTRATION_OUTPUT: artifacts/system1-c3-registration.json
          C3_REGISTER: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
        run: node tests/collect_system1_c1_c2_evidence.mjs
      - name: Build offline H1-H5 opportunity-loss readiness
        env:
          C1_EVIDENCE_OUTPUT: artifacts/system1-c1-evidence.json
          C2_EVIDENCE_OUTPUT: artifacts/system1-c2-paired.json
          C3_REGISTRATION_OUTPUT: artifacts/system1-c3-registration.json
          H1_H5_READINESS_OUTPUT: artifacts/system1-h1-h5-readiness.json
          C5_SHORT_OUTPUT: artifacts/system1-c5-short.json
          C5_DAILY_REPORT_OUTPUT: artifacts/system1-c5-daily-report.json
          OPPORTUNITY_LOSS_OUTPUT: artifacts/system1-opportunity-loss-v0.3.json
        run: node tests/build_system1_h1_h5_prospective_postprocess.mjs
      - name: Build genuine prospective operational acceptance receipt
        if: github.event_name == 'schedule'
        env:
          C1_EVIDENCE_OUTPUT: artifacts/system1-c1-evidence.json
          C2_EVIDENCE_OUTPUT: artifacts/system1-c2-paired.json
          C1_INVENTORY_OUTPUT: artifacts/system1-c1-generation-inventory.json
          FORMAL_C1_BINDING_OUTPUT: artifacts/system1-formal-c1-binding.json
          H1_H5_READINESS_OUTPUT: artifacts/system1-h1-h5-readiness.json
          OPERATIONAL_ACCEPTANCE_OUTPUT: artifacts/system1-operational-acceptance.json
          ACCEPTANCE_EVENT_NAME: ${{ github.event_name }}
          ACCEPTANCE_SCHEDULE: ${{ github.event.schedule }}
        run: node tests/build_system1_operational_acceptance.mjs

      - name: Preserve approved research evidence or explicit readiness blocker
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system1-c1-evidence-${{ github.run_id }}
          path: |
            artifacts/system1-c1-evidence.json
            artifacts/system1-c2-paired.json
            artifacts/system1-c1-readiness.json
            artifacts/system1-c1-generation-inventory.json
            artifacts/system1-formal-c1-binding.json
            artifacts/system1-c3-registration.json
            artifacts/system1-h1-h5-readiness.json
            artifacts/system1-c5-short.json
            artifacts/system1-c5-daily-report.json
            artifacts/system1-opportunity-loss-v0.3.json
            artifacts/system1-operational-acceptance.json
          if-no-files-found: error
          retention-days: 90
