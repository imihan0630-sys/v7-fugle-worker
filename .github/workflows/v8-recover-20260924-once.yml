name: V8 One-Time Recovery 2026-09-24
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v8-recover-20260924-once.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Persist accepted 3+3+3 resend into latest result
        env:
          V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
        run: |
          node - <<'NODE'
          const origin='https://fugle-test.imihan0630.workers.dev';
          const response=await fetch(origin+'/api/daily-report/resend',{
            method:'POST',
            headers:{'x-admin-token':process.env.V7_ADMIN_TOKEN,'content-type':'application/json','accept':'application/json'},
            body:'{}',signal:AbortSignal.timeout(60000)
          });
          const text=await response.text();
          console.log(JSON.stringify({status:response.status,bodyPrefix:text.slice(0,3000)}));
          if(!response.ok) throw new Error('daily resend failed '+response.status);
          NODE
      - name: Verify 3Min authorization read-only
        env:
          V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
        run: |
          node - <<'NODE'
          const origin='https://fugle-test.imihan0630.workers.dev';
          const response=await fetch(origin+'/api/three-min/auth-check',{
            headers:{'x-admin-token':process.env.V7_ADMIN_TOKEN,'accept':'application/json'},
            signal:AbortSignal.timeout(30000)
          });
          const text=await response.text();
          console.log(JSON.stringify({status:response.status,body:text}));
          if(!response.ok) throw new Error('3Min auth check failed');
          NODE
      - name: Complete staged 3Min delivery exactly once
        env:
          V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
        run: |
          node - <<'NODE'
          const origin='https://fugle-test.imihan0630.workers.dev';
          const response=await fetch(origin+'/api/three-min/recover-current',{
            method:'POST',
            headers:{'x-admin-token':process.env.V7_ADMIN_TOKEN,'content-type':'application/json','accept':'application/json'},
            body:'{}',signal:AbortSignal.timeout(60000)
          });
          const text=await response.text();
          console.log(JSON.stringify({status:response.status,body:text.slice(0,5000)}));
          if(!response.ok) throw new Error('3Min staged delivery failed '+response.status);
          NODE
      - name: Verify final production state
        env:
          V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
        run: |
          node - <<'NODE'
          const origin='https://fugle-test.imihan0630.workers.dev';
          for(const path of ['/api/scan/status','/api/config']) {
            const response=await fetch(origin+path,{headers:{'x-admin-token':process.env.V7_ADMIN_TOKEN,'accept':'application/json'},signal:AbortSignal.timeout(30000)});
            const text=await response.text();
            console.log(JSON.stringify({path,status:response.status,body:text.slice(0,16000)}));
            if(!response.ok) throw new Error(path+' verify failed');
          }
          NODE
