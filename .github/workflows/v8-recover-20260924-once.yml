name: V8 One-Time Recovery 2026-09-24
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v8-recover-20260924-once.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover official quality for 2026-09-24
        env:
          V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
          QUALITY_MARKET_DATE: "2026-09-24"
        run: node tests/sync_official_quality.mjs
      - name: Recover after-market selection for 2026-09-24
        env:
          V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
          RECOVERY_MARKET_DATE: "2026-09-24"
        run: node tests/recover_after_market.mjs

# retry-after-date-regex-fix
