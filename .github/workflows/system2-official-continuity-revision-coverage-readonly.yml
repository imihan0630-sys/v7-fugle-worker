name: System2 Official Continuity Revision Coverage Readonly

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "system2/runtime/official_continuity_revision_coverage_v0_1.mjs"
      - "system2/tests/official_continuity_revision_coverage_v0_1.test.mjs"
      - "system2/scripts/probe_official_continuity_revision_coverage_readonly_v0_1.mjs"
      - "system2/SYSTEM2_OFFICIAL_CONTINUITY_REVISION_COVERAGE_V0_1.md"
      - ".github/workflows/system2-official-continuity-revision-coverage-readonly.yml"
  push:
    branches: [main]
    paths:
      - "system2/runtime/official_continuity_revision_coverage_v0_1.mjs"
      - "system2/tests/official_continuity_revision_coverage_v0_1.test.mjs"
      - "system2/scripts/probe_official_continuity_revision_coverage_readonly_v0_1.mjs"
      - "system2/SYSTEM2_OFFICIAL_CONTINUITY_REVISION_COVERAGE_V0_1.md"
      - ".github/workflows/system2-official-continuity-revision-coverage-readonly.yml"

permissions:
  contents: read

concurrency:
  group: system2-official-continuity-revision-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run focused tests
        run: node system2/tests/official_continuity_revision_coverage_v0_1.test.mjs

      - name: Verify final-result-only revision gate against official sources
        run: node system2/scripts/probe_official_continuity_revision_coverage_readonly_v0_1.mjs

      - name: Confirm read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -qE 'CLOUDFLARE|SYSTEM2_DB|wrangler|secret|deploy' system2/scripts/probe_official_continuity_revision_coverage_readonly_v0_1.mjs
          echo "Read-only revision coverage boundary PASS"
