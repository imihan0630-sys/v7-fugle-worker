name: System2 Revision Authority Provenance Matrix Readonly

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "system2/runtime/revision_authority_provenance_matrix_v0_1.mjs"
      - "system2/tests/revision_authority_provenance_matrix_v0_1.test.mjs"
      - "system2/scripts/probe_revision_authority_provenance_matrix_readonly_v0_1.mjs"
      - "system2/SYSTEM2_REVISION_AUTHORITY_PROVENANCE_MATRIX_V0_1.md"
      - ".github/workflows/system2-revision-authority-provenance-matrix-readonly.yml"
  push:
    branches: [main]
    paths:
      - "system2/runtime/revision_authority_provenance_matrix_v0_1.mjs"
      - "system2/tests/revision_authority_provenance_matrix_v0_1.test.mjs"
      - "system2/scripts/probe_revision_authority_provenance_matrix_readonly_v0_1.mjs"
      - "system2/SYSTEM2_REVISION_AUTHORITY_PROVENANCE_MATRIX_V0_1.md"
      - ".github/workflows/system2-revision-authority-provenance-matrix-readonly.yml"

permissions:
  contents: read

concurrency:
  group: system2-revision-authority-provenance-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run authority matrix unit tests
        run: node system2/tests/revision_authority_provenance_matrix_v0_1.test.mjs

      - name: Physically verify authority provenance matrix
        run: node system2/scripts/probe_revision_authority_provenance_matrix_readonly_v0_1.mjs

      - name: Confirm read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -qE 'CLOUDFLARE|SYSTEM2_DB|wrangler|secret|deploy|INSERT|UPDATE|DELETE' system2/scripts/probe_revision_authority_provenance_matrix_readonly_v0_1.mjs
          echo "Read-only revision authority provenance matrix boundary PASS"
