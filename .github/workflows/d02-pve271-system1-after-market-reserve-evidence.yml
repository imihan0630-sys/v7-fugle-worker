name: D02 PVE271 System1 After-Market Reserve Evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/d02_pve271_system1_after_market_reserve_evidence_v0_1.mjs"
      - ".github/workflows/d02-pve271-system1-after-market-reserve-evidence.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read historical System1 after-market quota evidence
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
        run: node research/d02_pve271_system1_after_market_reserve_evidence_v0_1.mjs
      - name: Preserve PVE-271 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d02-pve271-system1-after-market-reserve-evidence-${{ github.run_id }}
          path: artifacts/d02-pve271-system1-after-market-reserve-evidence.json
          if-no-files-found: warn
          retention-days: 30
