name: System1 Official Quality Transport Verification

on:
  push:
    branches: [main]
    paths:
      - 'research/SYSTEM1_QUALITY_TRANSPORT_LIVE_VERIFY_TRIGGER_20261007.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system1-quality-transport-live-verification
  cancel-in-progress: false

