name: Institutional Actor Total Research

on:
  push:
    paths:
      - "research/institutional_actor_total_conflict_observer_v0_1.mjs"
      - "research/institutional_actor_total_conflict_observer_v0_1.test.mjs"
      - "research/institutional_actor_total_conflict_spec_v0_1.json"
      - "INSTITUTIONAL_ACTOR_TOTAL_CONFLICT_RESEARCH.md"
      - ".github/workflows/institutional-actor-total-research.yml"
  pull_request:
    paths:
      - "research/institutional_actor_total_conflict_observer_v0_1.mjs"
      - "research/institutional_actor_total_conflict_observer_v0_1.test.mjs"
      - "research/institutional_actor_total_conflict_spec_v0_1.json"
      - "INSTITUTIONAL_ACTOR_TOTAL_CONFLICT_RESEARCH.md"
      - ".github/workflows/institutional-actor-total-research.yml"

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node research/institutional_actor_total_conflict_observer_v0_1.test.mjs
