name: System2 REAL Oct13 Preliminary Human Report ONE SHOT READONLY
on:
  push:
    branches: [main]
    paths: ['.github/workflows/system2-real-oct13-preliminary-user-report-once.yml']
permissions:
  contents: read
  actions: read
jobs:
  render_actual_signed_preliminary:
    if: github.repository == 'imihan0630-sys/v7-fugle-worker' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify no selection promotion or tampered report rows
        run: |
          set -euo pipefail
          node --test system2/tests/preliminary_daily_user_report_v0_1.test.mjs
          git diff --exit-code -- Worker.js wrangler.toml
      - name: Retrieve real previously verified source-only Oct13 preliminary preview
        uses: actions/download-artifact@v4
        with:
          run-id: 38477169340
          name: s2-v02-tdr-filtered-observation-38477169340
          path: /tmp/s2-signed-original-preliminary
          github-token: ${{ github.token }}
      - name: Render actual 30 named observations into human report, no official original prices
        run: |
          set -euo pipefail
          mkdir -p /tmp/s2-daily-human-report
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          import {buildPreliminaryUserReportV0_1} from './system2/runtime/preliminary_daily_user_report_v0_1.mjs';
          const old=JSON.parse(await readFile('/tmp/s2-signed-original-preliminary/preliminary-pv-watch.json','utf8'));
          if(old.marketDate!=='2026-10-13'||old.preliminaryMatchedCount!==580||
             old.displayedCount!==30||
             old.receiptHash!=='1bdc75a148160b4267ad6173ac0d6607c47ac9304df02f28bc376f026e9a4d88')
             throw Error('REAL_OCT13_ARTIFACT_IDENTITY_MISMATCH');
          const {markdown,metadata}=await buildPreliminaryUserReportV0_1({receipt:old});
          if(metadata.displayedCount!==30||!markdown.includes('映興')||
             !markdown.includes('59.61%')||markdown.includes('買進優先順序：'))
             throw Error('REAL_OCT13_HUMAN_REPORT_INCOMPLETE');
          await writeFile('/tmp/s2-daily-human-report/2026-10-13-preliminary-report.md',markdown,{flag:'wx'});
          await writeFile('/tmp/s2-daily-human-report/2026-10-13-report-evidence.json',
             JSON.stringify(metadata,null,2)+'\n',{flag:'wx'});
          console.log(JSON.stringify({result:'REAL_SIGNED_DAILY_PRELIMINARY_HUMAN_REPORT_PASS',
            marketDate:metadata.marketDate,observedAtUtc:metadata.observedAtUtc,
            displayedCount:metadata.displayedCount,sourceReceiptHash:metadata.signedSourceReceiptHash,
            reportHash:metadata.reportHash,officialShadowSelection:false,frozen:false}));
          NODE
      - name: Preserve sanitized derived market observation report only
        uses: actions/upload-artifact@v4
        with:
          name: s2-real-oct13-human-preliminary-report-${{ github.run_id }}
          path: /tmp/s2-daily-human-report/
          retention-days: 7
          if-no-files-found: error
