name: System1 P0 Restore Source-Ready Formal Handoff (OFFLINE CI)
on:
  pull_request:
    paths:
      - ".github/workflows/v7-market-data.yml"
      - ".github/workflows/system1-p0-source-ready-formal-handoff-ci.yml"
      - "tests/recover_after_market.mjs"
      - "tests/system1_p0_source_ready_handoff_gate_v0_1.mjs"
      - "tests/test_system1_p0_source_ready_handoff_v0_1.mjs"
      - "tests/test_system1_cross_midnight_recovery_v0_1.mjs"
permissions:
  contents: read
jobs:
  same_day_precommit_handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Same-day source-ready original business gate without credentials
        run: |
          set -euo pipefail
          node --check tests/system1_p0_source_ready_handoff_gate_v0_1.mjs
          node --check tests/recover_after_market.mjs
          node tests/test_system1_p0_source_ready_handoff_v0_1.mjs
          node tests/test_system1_cross_midnight_recovery_v0_1.mjs
          node tests/test_requirements_repair.mjs
          git diff --exit-code -- Worker.js
