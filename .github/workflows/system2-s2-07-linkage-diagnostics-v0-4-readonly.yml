name: System2 S2-07 Linkage Diagnostics V0.4 Readonly

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "system2/scripts/probe_s2_07_linkage_diagnostics_readonly_v0_4.mjs"
      - "system2/SYSTEM2_S2_07_LINKAGE_DIAGNOSTICS_V0_4.md"
      - ".github/workflows/system2-s2-07-linkage-diagnostics-v0-4-readonly.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: node system2/scripts/probe_s2_07_linkage_diagnostics_readonly_v0_4.mjs
      - shell: bash
        run: |
          set -euo pipefail
          ! grep -qE 'CLOUDFLARE|SYSTEM2_DB|wrangler|secret|deploy|INSERT|UPDATE|DELETE' system2/scripts/probe_s2_07_linkage_diagnostics_readonly_v0_4.mjs
          echo "S2-07 V0.4 read-only diagnostic boundary PASS"
