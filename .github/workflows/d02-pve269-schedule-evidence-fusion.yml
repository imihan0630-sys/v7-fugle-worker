name: D02 PVE269 Schedule Evidence Fusion

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/d02_pve269_schedule_evidence_fusion_v0_1.mjs"
      - "tests/test_d02_pve269_schedule_evidence_fusion_v0_1.mjs"
      - ".github/workflows/d02-pve269-schedule-evidence-fusion.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/test_d02_pve269_schedule_evidence_fusion_v0_1.mjs
