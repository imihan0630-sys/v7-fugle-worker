name: V7 Scheduled Health Verification
on:
  schedule:
    - cron: '20 1 * * 1-5'
    - cron: '10 5 * * 1-5'
    - cron: '55 10 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v7-scheduled-health
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify actual intraday snapshots only (no pushes or trades)
        if: github.event.schedule != '55 10 * * 1-5'
        env:
          V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
        run: node tests/scheduled_health.mjs --intraday
      - name: Verify actual completed full plan and active external mirror (no new import)
        if: github.event.schedule == '55 10 * * 1-5' || github.event_name == 'workflow_dispatch'
        env:
          V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
        run: node tests/scheduled_health.mjs --after-market
