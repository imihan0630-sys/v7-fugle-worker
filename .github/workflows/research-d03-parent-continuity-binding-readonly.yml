name: Research D03 Parent Continuity Binding Readonly
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/d03_parent_continuity_binding_v0_1.mjs"
      - "tests/test_d03_parent_continuity_binding_v0_1.mjs"
      - "research/D03_PARENT_CONTINUITY_BINDING_V0_1.md"
      - ".github/workflows/research-d03-parent-continuity-binding-readonly.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/test_d03_parent_continuity_binding_v0_1.mjs
      - shell: bash
        run: |
          set -euo pipefail
          ! grep -qE 'wrangler|deploy|CLOUDFLARE|V7_ADMIN_TOKEN|livePush|sendLine|THREEMIN' research/d03_parent_continuity_binding_v0_1.mjs
          echo "Research-only parent-continuity binding boundary PASS"
