name: System2 DATA A1 Full T Native Row Replay (READ ONLY)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/system2-data-a1-full-native-row-readonly.yml"
      - "system2/migration/issue1068_full_market_t_a1_native_row_handoff_v0_1.mjs"
      - "system2/tests/issue1068_full_market_t_a1_native_row_handoff_v0_1.test.mjs"
      - "system2/scripts/resolve_data_a1_verified_origin_pair_v0_1.mjs"
      - "system2/tests/resolve_data_a1_verified_origin_pair_v0_1.test.mjs"
  # NEW: source-only downstream of successful independent audit, no new Cron.
  # Origin pair is selected by exact independently signed original SHA, never
  # by the latest run or nominal scheduler time.
  workflow_run:
    workflows: ["System2 Shared Official A1 Independent Source Audit (READ ONLY)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        type: string
        required: false
        default: "38934081985"
      audit_run_id:
        type: string
        required: false
        default: "38934321405"
      market_date:
        type: string
        required: false
        default: "2026-10-16"

permissions:
  contents: read
  actions: read

concurrency:
  group: system2-data-a1-native-row-replay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract_source_only:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'workflow_run'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test original row conversion and fail-closed anti-spoof controls
        run: |
          set -euo pipefail
          node --check system2/migration/issue1068_full_market_t_a1_native_row_handoff_v0_1.mjs
          node --test system2/tests/issue1068_full_market_t_a1_native_row_handoff_v0_1.test.mjs
          node --check system2/scripts/resolve_data_a1_verified_origin_pair_v0_1.mjs
          node --test system2/tests/resolve_data_a1_verified_origin_pair_v0_1.test.mjs
          git diff --exit-code -- Worker.js wrangler.toml
      - name: Auto-match exact signed upstream source to independently completed audit (GitHub archive GET only)
        if: github.event_name == 'workflow_run'
        id: verified_origin
        env:
          GH_TOKEN: ${{ github.token }}
          S2_A1_AUDIT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          node system2/scripts/resolve_data_a1_verified_origin_pair_v0_1.mjs
      - name: Resolve source and audit exact original run IDs
        id: run
        env:
          SOURCE_RUN: ${{ inputs.source_run_id }}
          AUDIT_RUN: ${{ inputs.audit_run_id }}
          TARGET_T: ${{ inputs.market_date }}
          AUTO_SOURCE: ${{ steps.verified_origin.outputs.source_id }}
          AUTO_AUDIT: ${{ steps.verified_origin.outputs.audit_id }}
          AUTO_T: ${{ steps.verified_origin.outputs.market_date }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            S="$AUTO_SOURCE"
            A="$AUTO_AUDIT"
            T="$AUTO_T"
          else
            S="${SOURCE_RUN:-38934081985}"
            A="${AUDIT_RUN:-38934321405}"
            T="${TARGET_T:-2026-10-16}"
          fi
          [[ "$S" =~ ^[0-9]+$ ]]
          [[ "$A" =~ ^[0-9]+$ ]]
          [[ "$T" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]]
          echo "source_id=$S" >> "$GITHUB_OUTPUT"
          echo "audit_id=$A" >> "$GITHUB_OUTPUT"
          echo "market_date=$T" >> "$GITHUB_OUTPUT"
      - name: Reuse archived original TWSE/TPEx source (NO new provider GET)
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.run.outputs.source_id }}
          name: s2-shared-official-a1-${{ steps.run.outputs.source_id }}
          path: /tmp/s2-data-a1-source
          github-token: ${{ github.token }}
      - name: Reuse independent original audit
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.run.outputs.audit_id }}
          name: system2-shared-official-a1-independent-audit-${{ steps.run.outputs.audit_id }}
          path: /tmp/s2-data-a1-audit
          github-token: ${{ github.token }}
      - name: Verify native T and previous session rows and sign full four-digit source handoff
        env:
          SOURCE_T: ${{ steps.run.outputs.market_date }}
        run: |
          set -euo pipefail
          echo 'Archived provider/auditor filenames (no raw contents):'
          # Never use find | head under pipefail: >15 original 61-session files
          # cause SIGPIPE and falsely fail before the signed original readback.
          ls -l /tmp/s2-data-a1-source/official-61-*.json /tmp/s2-data-a1-audit/s2-shared-a1-independent-audit/audit-receipt.json
          SRC="/tmp/s2-data-a1-source/official-61-$SOURCE_T.json"
          AUD="/tmp/s2-data-a1-audit/s2-shared-a1-independent-audit/audit-receipt.json"
          if [ ! -s "$SRC" ]; then
            echo "::error::EXACT_MARKET_DATE_SOURCE_RECEIPT_ABSENT: $SRC"
            exit 2
          fi
          if [ ! -s "$AUD" ]; then
            echo "::error::EXACT_SOURCE_AUDITOR_RECEIPT_ABSENT: $AUD"
            exit 2
          fi
          test "$(jq -r .marketDate "$SRC")" = "$SOURCE_T"
          test "$(jq -r .marketDate "$AUD")" = "$SOURCE_T"
          # Official source and independent audit hashes remain mandatory
          # in the extractor; a delayed workflow cannot backdate source PIT.
          node system2/migration/issue1068_full_market_t_a1_native_row_handoff_v0_1.mjs \
            "$SRC" "$AUD" /tmp/s2-data-a1-source/original-json \
            /tmp/s2-data-a1-full-universe
      - name: Enforce source-only scope and real original denominator
        env:
          SOURCE_T: ${{ steps.run.outputs.market_date }}
        run: |
          set -euo pipefail
          R=/tmp/s2-data-a1-full-universe/full-universe-a1-source-handoff.json
          test -s "$R"
          test "$(jq -r .marketDate "$R")" = "$SOURCE_T"
          test "$(jq -r '.marketSummaries | length' "$R")" = '2'
          test "$(jq -r .fourDigitInstrumentCount "$R")" -ge 1000
          test "$(jq -r '.rows | length' "$R")" = "$(jq -r .fourDigitInstrumentCount "$R")"
          test "$(jq -r .ordinaryShareClassCertified "$R")" = 'false'
          test "$(jq -r .providerPublicationPITCertified "$R")" = 'false'
          test "$(jq -r .selectionAuthorized "$R")" = 'false'
          test "$(jq -r .selectedCount "$R")" = 'null'
          test "$(jq -r .zeroPickDay "$R")" = 'null'
          test "$(jq -r .frozenD1Written "$R")" = 'false'
          echo "DATA SOURCE-ONLY T=$SOURCE_T, A1 four-digit original rows=$(jq -r .fourDigitInstrumentCount "$R"), SHA=$(jq -r .receiptHash "$R")" >> "$GITHUB_STEP_SUMMARY"
          echo 'TWD turnover is daily traded value, NOT net buy/sell money flow; class/PIT/Frozen remain unverified.' >> "$GITHUB_STEP_SUMMARY"
      - name: Ephemeral source-only Artifact; NOT permanent Frozen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s2-data-full-a1-native-handoff-${{ github.run_id }}
          path: /tmp/s2-data-a1-full-universe/full-universe-a1-source-handoff.json
          if-no-files-found: warn
          retention-days: 30
