name: V8 Regression Tests

on:
  workflow_dispatch:
  push:
    branches: [main, repair/v7-30-rules-20260916]
    paths: [Worker.js, scripts/**, tests/**, .github/workflows/**]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build production Worker from guarded patches
        run: |
          set -euo pipefail
          python3 scripts/apply_v7_5_27.py
          python3 scripts/apply_v7_5_30.py
          python3 scripts/apply_v7_5_31.py
          python3 scripts/apply_v7_5_33.py
          python3 scripts/apply_v8_0_1.py
          python3 scripts/apply_v8_0_2.py
          python3 scripts/apply_v8_0_3.py
          python3 scripts/apply_v8_0_4.py
          python3 scripts/apply_v8_1_0.py
          python3 scripts/apply_v8_1_1.py
          python3 scripts/apply_v8_1_2.py
          python3 scripts/apply_v8_1_3.py
          python3 scripts/apply_v8_2_0.py
          python3 scripts/apply_v8_2_1.py
          python3 scripts/apply_v8_3_0.py
          python3 scripts/apply_v8_3_1.py
          python3 scripts/apply_v8_4_0.py
          python3 scripts/apply_v8_4_1.py
          python3 scripts/apply_v8_5_0.py
          python3 scripts/apply_v8_5_2.py
          python3 scripts/apply_v8_6_0.py
          python3 scripts/apply_v8_6_1.py
          python3 scripts/apply_v8_6_2.py
          python3 scripts/apply_v8_6_3.py
          python3 scripts/apply_v8_7_0.py
          python3 scripts/apply_v8_7_1.py
          python3 scripts/apply_v8_7_2.py
          python3 scripts/apply_v8_7_3.py
          python3 scripts/apply_v8_7_4.py
          python3 scripts/apply_v8_7_5.py
          python3 scripts/apply_v8_7_6.py
          python3 scripts/apply_v8_7_7.py
          python3 scripts/apply_v8_7_8.py
          python3 scripts/apply_v8_7_9.py
          python3 scripts/apply_v8_7_10.py
          python3 scripts/apply_v8_7_11.py
          python3 scripts/apply_v8_7_12.py
          python3 scripts/apply_v8_7_13.py
          python3 scripts/apply_v8_8_0.py
          python3 scripts/apply_v8_8_1.py
          python3 scripts/apply_v8_8_2.py
          python3 scripts/apply_v8_9_0.py
          python3 scripts/apply_v8_9_1.py
          python3 scripts/apply_v8_9_2.py
          python3 scripts/apply_v8_9_3.py
          python3 scripts/apply_v8_9_4.py
          # V8.9.3 Hybrid WATCH regression contract
      - name: Syntax and offline behavior regression
        env:
          V7_TEST_WORKER_PATH: ${{ github.workspace }}/Worker.js
        run: |
          set -euo pipefail
          cp Worker.js /tmp/v7-worker.mjs
          node --check /tmp/v7-worker.mjs
          grep -F 'const VERSION = "8.9.4-hybrid-watch-consensus";' Worker.js
          grep -F 'CREATE TABLE IF NOT EXISTS trade_research_execution_snapshots' Worker.js
          grep -F 'RESEARCH_EXECUTION_RECORDER_FAIL_OPEN' Worker.js
          grep -F '35 15 * * MON-FRI' Worker.js
          grep -F '23:35 盤後掃描' Worker.js
          grep -F 'SAME_SCAN_DATE_PAIRED_COHORT_DELTA' Worker.js
          grep -F 'trackedExperimentDefinitions' Worker.js
          grep -F 'RESEARCH_DATA_GAP' Worker.js
          grep -F 'PAIRWISE_PEARSON_FULL_FORMAL_SCAN' Worker.js
          grep -F 'eligibleForFormalReview' Worker.js
          grep -F 'WITHIN_SCAN_DATE_DEMEANED_PARTIAL_CORRELATION' Worker.js
          grep -F 'trackedIncrementalDefinitions' Worker.js
          grep -F 'LEAVE_ONE_SCAN_DATE_OUT_PARTIAL_CORRELATION' Worker.js
          grep -F 'FRAGILE_DATE_DEPENDENCE' Worker.js
          grep -F 'CREATE TABLE IF NOT EXISTS trade_research_external_evidence' Worker.js
          grep -F 'R07_MEDIAN_SPLIT_TWO_ENGINE_COMPARISON' Worker.js
          grep -F 'MARGIN_SHORT_ONLY_NOT_SBL' Worker.js
          grep -F 'RESEARCH_MICROSTRUCTURE_CUTOFF' Worker.js
          grep -F 'Research Evidence Readiness' Worker.js
          grep -F 'DATA_QUALITY_BLOCKED' Worker.js
          grep -F 'researchEvidenceReadinessMatrix' Worker.js
          grep -F 'research-external-evidence-v2' Worker.js
          grep -F 'mopsfin_t187ap05_O' Worker.js
          grep -F 'ACTUAL_SBL_SHORT_SALE' Worker.js
          grep -F 'RAW_DAILY_ONLY_NO_CONTIGUOUS_HISTORY' Worker.js
          grep -F 'FAILED_CLOSE_WITHIN_3D' Worker.js
          grep -F 'PURGED_FORWARD_HOLDOUT' Worker.js
          grep -F 'CREATE TABLE IF NOT EXISTS trade_research_shadow_candidates' Worker.js
          grep -F 'url.pathname === "/api/research/reconstruct-history"' Worker.js
          grep -F 'CREATE TABLE IF NOT EXISTS trade_research_snapshots' Worker.js
          grep -F 'url.pathname === "/api/research/dashboard"' Worker.js
          grep -F 'const WATCHLIST_MAX = 12;' Worker.js
          grep -F 'async function finishDataIncompleteScan(' Worker.js
          grep -F 'function buildReviewedWatchlist(' Worker.js
          grep -F 'MOPSFIN_OFFICIAL_Q4_CUMULATIVE_MINUS_Q3' Worker.js
          grep -F 'requirement26Complete' Worker.js
          grep -F 'url.pathname === "/api/three-min/auth-check"' Worker.js
          grep -F 'url.pathname === "/api/three-min/recover-current"' Worker.js
          grep -F 'CREATE TABLE IF NOT EXISTS v7_push_outbox' Worker.js
          grep -F 'url.pathname==="/api/system-overview"' Worker.js
          grep -F 'url.pathname==="/api/push-outbox"' Worker.js
          grep -F 'url.pathname==="/api/external-validation/stats"' Worker.js
          node tests/test_requirements_repair.mjs
          node tests/test_three_min_auth_check.mjs
          node tests/test_v8_7_13_daily_mobile_alert.mjs
          node tests/test_three_min_current_recovery.mjs
          node tests/test_v8_1_ops_hardening.mjs
          node tests/test_v8_1_1_acceptance_state.mjs
          node tests/test_v8_1_2_position_reconciliation.mjs
          node tests/test_v8_1_3_ops_console.mjs
          node tests/test_v8_2_0_push_receipt.mjs
          node tests/test_v8_2_1_evidence_acceptance.mjs
          node tests/test_v8_3_0_storage_bridge.mjs
          node tests/test_v8_3_1_storage_health.mjs
          node tests/test_v8_4_0_github_mirror.mjs
          node tests/test_v8_4_1_provider_neutral.mjs
          node tests/test_v8_5_0_trade_journal.mjs
          node tests/test_v8_5_2_history_backfill.mjs
          node tests/test_v8_6_0_performance_center.mjs
          node tests/test_v8_6_1_shared_navigation.mjs
          node tests/test_v8_6_2_v7_formal_performance.mjs
          node tests/test_v8_6_3_v7_current_close.mjs
          node tests/test_v8_7_0_research_foundation.mjs
          node tests/test_v8_7_1_history_research.mjs
          node tests/test_v8_7_2_shadow_candidate_archive.mjs
          node tests/test_v8_7_3_validation_firewall.mjs
          node tests/test_v8_7_4_counterfactual_research.mjs
          node tests/test_v8_7_5_research_governance.mjs
          node tests/test_v8_7_6_anti_overfit.mjs
          node tests/test_v8_7_7_incremental_factor_diagnostics.mjs
          node tests/test_v8_7_8_date_cluster_robustness.mjs
          node tests/test_v8_7_9_research_evidence_enrichment.mjs
          node tests/test_v8_7_10_research_readiness_matrix.mjs
          node tests/test_v8_7_11_cross_market_evidence.mjs
          node tests/test_v8_7_12_after_market_2335.mjs
          node tests/test_v8_8_0_execution_recorder.mjs
          node tests/test_v8_8_1_execution_coverage.mjs
          node tests/test_v8_8_2_zero_selection_push.mjs
          node tests/test_v8_9_0_three_pool_hybrid_shadow.mjs
          node tests/test_v8_9_1_three_pool_dashboard.mjs
          node tests/github_plan_mirror.mjs self-test
          # V8.9.2 three-pool push contract
          grep -F 'function enrichThreePoolDailyPayload' Worker.js
          grep -F 'url.pathname === "/api/daily-report/resend"' Worker.js
          grep -F '千元 Hybrid' Worker.js
          grep -F 'dailyAllPoolsZero' Worker.js
          grep -F 'const HYBRID_WATCH_MAX = 5;' Worker.js
          grep -F 'function scoreHybridWatchCandidate' Worker.js
          grep -F 'function evaluateHybridWatchUpgrade' Worker.js
          grep -F 'function monitorHybridWatchCandidates' Worker.js
          grep -F 'EARLY_ENTRY_ELIGIBLE' Worker.js
          grep -F 'TRIGGERED_WAITLIST' Worker.js
          grep -F 'url.pathname === "/api/hybrid-watch-performance"' Worker.js
          grep -F 'WATCH不占3席、不占20萬' Worker.js
          grep -F 'Smart Money共識形成中' Worker.js
          grep -F 'hybridSmartMoneyForming' Worker.js
          grep -F 'hybridWatchAudit' Worker.js
      - name: V8.9.3 Hybrid WATCH dry-run diagnostic
        if: contains(github.event.head_commit.message, '[hybrid-watch-diagnostic]')
        env:
          V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
        run: |
          node - <<'NODE'
          const origin="https://fugle-test.imihan0630.workers.dev";
          const response=await fetch(origin+"/api/scan-preview",{
            method:"POST",
            headers:{"x-admin-token":process.env.V7_ADMIN_TOKEN,"content-type":"application/json","accept":"application/json"},
            body:JSON.stringify({marketDate:"2026-09-23"}),
            signal:AbortSignal.timeout(120000)
          });
          const data=await response.json();
          console.log(JSON.stringify({
            ok:data.ok??response.ok,version:data.version,scanDate:data.scanDate,
            hybridSelectedCount:data.hybridSelectedCount,hybridWatchCount:data.hybridWatchCount,
            hybridStocks:(data.hybridStocks||[]).map(x=>({symbol:x.symbol,name:x.name,reason:x.selectedReason})),
            hybridWatchStocks:(data.hybridWatchStocks||[]).map(x=>({symbol:x.symbol,name:x.name,watchReason:x.watchReason,missingCondition:x.missingCondition})),
            hybridStockPool:data.hybridStockPool,
            hybridWatchDiagnostics:data.diagnostics?.hybridWatch,
            hybridExclusions:data.hybridStockPool?.exclusions,
            finalPoolMerge:data.diagnostics?.finalPoolMerge
          },null,2));
          if(!response.ok) throw new Error("scan-preview failed");
          NODE

      - name: Read-only production authorization preflight
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
        run: node tests/production_preflight.mjs

      - name: Latest after-market read-only diagnostic
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
        run: |
          node - <<'NODE'
          const origin="https://fugle-test.imihan0630.workers.dev";
          const headers={"x-admin-token":process.env.V7_ADMIN_TOKEN,"accept":"application/json"};
          const get=async path=>{
            const r=await fetch(origin+path,{headers,signal:AbortSignal.timeout(30000)});
            const j=await r.json().catch(()=>({}));
            if(!r.ok) throw new Error(path+" HTTP "+r.status);
            return j;
          };
          const [scan,outbox,receipts,cron]=await Promise.all([
            get("/api/scan/status"),get("/api/push-outbox?limit=50"),
            get("/api/push-receipts?limit=50"),get("/api/cron/status")
          ]);
          const signalId=scan?.dailyReport?.signalId||null;
          const out=(outbox?.recent||[]).find(x=>String(x.signal_id||"")===String(signalId||""));
          console.log(JSON.stringify({
            scanDate:scan?.scanDate,dryRun:scan?.dryRun,selectedCount:scan?.selectedCount,
            hybridSelectedCount:scan?.hybridSelectedCount,
            config:scan?.config,
            planBridge:{provider:scan?.planBridge?.provider,sent:scan?.planBridge?.sent,verified:scan?.planBridge?.verified,simulated:scan?.planBridge?.simulated},
            dailyReport:scan?.dailyReport,
            dailyOutbox:out?{signal_id:out.signal_id,delivery_state:out.delivery_state,http_status:out.http_status,created_at:out.created_at,updated_at:out.updated_at}:null,
            outbox:{configured:outbox?.configured,unresolved:outbox?.unresolved,staleUnresolved:outbox?.staleUnresolved},
            receipts:{total:receipts?.total,dailySelection:receipts?.dailySelection,intraday:receipts?.intraday},
            cronRecent:(cron?.recent||[]).slice(0,8).map(x=>({job_type:x.job_type,status:x.status,scheduled_at:x.scheduled_at,finished_at:x.finished_at,error:x.error}))
          },null,2));
          NODE
