name: V7 Regression Tests

on:
  workflow_dispatch:
  push:
    branches: [main, repair/v7-30-rules-20260916]
    paths: [Worker.js, tests/**, .github/workflows/**]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and offline behavior regression
        env:
          V7_TEST_WORKER_PATH: ${{ github.workspace }}/Worker.js
        run: |
          set -euo pipefail
          cp Worker.js /tmp/v7-worker.mjs
          node --check /tmp/v7-worker.mjs
          node tests/test_requirements_repair.mjs
