name: Research TPEx Halt Source Discovery Readonly

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/research-tpex-halt-source-discovery-readonly.yml"

permissions:
  contents: read

concurrency:
  group: research-tpex-halt-source-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch official TPEx historical halt page and inspect executable source paths
        shell: bash
        run: |
          set -euo pipefail
          PAGE="https://www.tpex.org.tw/zh-tw/announce/market/halt/historical.html"
          ORIGIN="https://www.tpex.org.tw"

          curl --fail --silent --show-error --location --max-time 30             --dump-header /tmp/page.headers             --output /tmp/page.html             "${PAGE}"

          echo "page_sha256=$(sha256sum /tmp/page.html | awk '{print $1}')"
          echo "page_bytes=$(wc -c </tmp/page.html)"
          echo "----- response headers -----"
          sed -n '1,80p' /tmp/page.headers

          echo "----- page action/API clues -----"
          grep -oE 'bulletin/sprcHis|API_PATTERN|apiPattern|sprcHis|CSV|csv|historical|pageSize|paging|action[^<]{0,120}' /tmp/page.html             | head -n 160 || true

          echo "----- script src list -----"
          python - <<'PY'
          import re, html
          s=open('/tmp/page.html',encoding='utf-8',errors='replace').read()
          srcs=[]
          for x in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',s,re.I):
              x=html.unescape(x)
              if x not in srcs: srcs.append(x)
          for x in srcs:
              print(x)
          PY

          python - <<'PY' >/tmp/script_urls.txt
          import re, html, urllib.parse
          s=open('/tmp/page.html',encoding='utf-8',errors='replace').read()
          base='https://www.tpex.org.tw'
          seen=set()
          for x in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',s,re.I):
              u=urllib.parse.urljoin(base+'/',html.unescape(x))
              if u not in seen:
                  seen.add(u); print(u)
          PY

          n=0
          while IFS= read -r u; do
            n=$((n+1))
            [ "$n" -le 40 ] || break
            out="/tmp/js_$n.txt"
            code=$(curl --silent --show-error --location --max-time 30               --output "$out" --write-out "%{http_code}" "$u" || true)
            echo "SCRIPT[$n] status=$code url=$u bytes=$(wc -c <"$out" 2>/dev/null || echo 0)"
            if [ "$code" = "200" ]; then
              grep -nE 'API_PATTERN|bulletin/sprcHis|sprcHis|downloadCSV|csv|pageSize|paging|apiUrl|API_URL|/www/|/openapi/|/api/' "$out"                 | head -n 100 || true
            fi
          done </tmp/script_urls.txt

          echo "research_only=true"
          echo "history_mutation=false"
          echo "system1_runtime_used=false"
          echo "selection_authority=false"

      - name: Print TPEx table loader request construction
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30             --output /tmp/main.js "https://www.tpex.org.tw/rsrc/js/main.js"
          curl --fail --silent --show-error --location --max-time 30             --output /tmp/tables.js "https://www.tpex.org.tw/rsrc/js/tables.js"

          echo "----- API pattern context -----"
          grep -n -C 3 'API_PATTERN="/www/{LANG}/{ACTION}"' /tmp/main.js || true

          echo "----- action/url construction context -----"
          grep -n -C 8 -E 'API_PATTERN|replace\(/\\\{ACTION\\\}/|this\.action|op\.action|let act|const act|url:' /tmp/tables.js             | head -n 260 || true

          echo "----- AJAX/request context -----"
          grep -n -C 12 -E '\$\.ajax|ajax\(|method:|type:|dataType:|paging-offset|paging-size|paging-table' /tmp/tables.js             | head -n 420 || true

          echo "----- download/export context -----"
          grep -n -C 10 -E 'download|CSV|csv|response' /tmp/tables.js             | head -n 260 || true
