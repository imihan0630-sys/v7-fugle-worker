name: System1 P0 Real Clock Intraday Cron Stale Gate OFFLINE
on:
  pull_request:
    paths:
      - "scripts/apply_system1_p0_stale_cron_gate_reviewonly.py"
      - "tests/test_system1_p0_stale_intraday_cron_gate_reviewonly_v0_1.mjs"
      - ".github/workflows/system1-p0-stale-intraday-cron-reviewonly.yml"
permissions:
  contents: read
jobs:
  validate_candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Synthetic wall-clock latency, original 90s/10m/15m contracts, original Worker unchanged
        run: |
          set -euo pipefail
          node --check tests/test_system1_p0_stale_intraday_cron_gate_reviewonly_v0_1.mjs
          node tests/test_system1_p0_stale_intraday_cron_gate_reviewonly_v0_1.mjs
          node --check artifacts/system1-p0-stale-cron-worker-reviewonly.mjs
          git diff --exit-code -- Worker.js
