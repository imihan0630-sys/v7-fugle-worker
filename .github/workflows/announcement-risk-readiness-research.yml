name: Announcement Risk Readiness Research

on:
  push:
    paths:
      - "research/announcement_risk_readiness_observer_v0_1.mjs"
      - "research/announcement_risk_readiness_falsification_v0_1.json"
      - "tests/test_announcement_risk_readiness_observer_v0_1.mjs"
      - "ANNOUNCEMENT_RISK_READINESS_RESEARCH.md"
      - "ANNOUNCEMENT_RISK_CAPTURE_CLASS_B_PROPOSAL.md"
      - ".github/workflows/announcement-risk-readiness-research.yml"
  pull_request:
    paths:
      - "research/announcement_risk_readiness_observer_v0_1.mjs"
      - "research/announcement_risk_readiness_falsification_v0_1.json"
      - "tests/test_announcement_risk_readiness_observer_v0_1.mjs"
      - "ANNOUNCEMENT_RISK_READINESS_RESEARCH.md"
      - "ANNOUNCEMENT_RISK_CAPTURE_CLASS_B_PROPOSAL.md"
      - ".github/workflows/announcement-risk-readiness-research.yml"

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/test_announcement_risk_readiness_observer_v0_1.mjs
