name: V7 Official Market Data Sync
on:
  schedule:
    - cron: '55 9 * * 1-5'
    - cron: '5 10 * * 1-5'
    - cron: '20 10 * * 1-5'
    - cron: '25 15 * * 1-5' # 23:25 Taipei final data refresh
    - cron: '45 15 * * 1-5' # 23:45 Taipei recovery only if 23:35 formal scan is missing
  workflow_dispatch:
    inputs:
      market_date:
        description: 'Optional prior trading date (YYYY-MM-DD) for guarded historical quality + after-market recovery'
        required: false
        type: string
      quality_only:
        description: 'Read/write official quality snapshots only; never invoke after-market scan recovery'
        required: false
        default: false
        type: boolean
      data_only:
        description: 'Recover prior-session market, institution and quality caches ONLY; never scan or push'
        required: false
        default: false
        type: boolean
      data_scope:
        description: 'When data_only=true, run exactly one stage (market/institution/quality), or explicit all'
        required: false
        default: market
        type: choice
        options:
          - market
          - institution
          - quality
          - all
permissions:
  contents: read
concurrency:
  group: v7-official-market-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate manual recovery scope (never alters trading plans)
        if: github.event_name == 'workflow_dispatch'
        env:
          RECOVERY_INPUT_MARKET_DATE: ${{ inputs.market_date }}
          RECOVERY_INPUT_QUALITY_ONLY: ${{ inputs.quality_only }}
          RECOVERY_INPUT_DATA_ONLY: ${{ inputs.data_only }}
          RECOVERY_INPUT_DATA_SCOPE: ${{ inputs.data_scope }}
        run: node tests/verify_official_data_dispatch_inputs.mjs
      - name: Skip official exchange holidays safely
        id: calendar
        env:
          V7_TRIGGER_SCHEDULE: ${{ github.event.schedule }}
          V7_RECOVERY_DATA_ONLY_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.data_only == true && inputs.market_date || '' }}
        run: node tests/trading_day_gate.mjs
      - name: Sync today's official market data (no target changes or orders)
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.data_only == true && inputs.market_date != '' &&
           (inputs.data_scope == 'market' || inputs.data_scope == 'all') && steps.calendar.outputs.proceed == 'true') ||
          (steps.calendar.outputs.proceed == 'true' && steps.calendar.outputs.cross_midnight_fallback != 'true' &&
           (github.event_name != 'workflow_dispatch' || (inputs.market_date == '' && inputs.quality_only != true && inputs.data_only != true)))
        env:
          V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
          OFFICIAL_MARKET_DATE: ${{ steps.calendar.outputs.market_date }}
          V7_DATA_ONLY_RECOVERY: ${{ github.event_name == 'workflow_dispatch' && inputs.data_only == true && 'true' || 'false' }}
        run: node tests/prepare_market_cache.mjs
      - name: Sync official institutions and missing recent trading days (no plan changes)
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.data_only == true && inputs.market_date != '' &&
           (inputs.data_scope == 'institution' || inputs.data_scope == 'all') && steps.calendar.outputs.proceed == 'true') ||
          (steps.calendar.outputs.proceed == 'true' && steps.calendar.outputs.cross_midnight_fallback != 'true' &&
           (github.event_name != 'workflow_dispatch' || (inputs.market_date == '' && inputs.quality_only != true && inputs.data_only != true)))
        env:
          V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
          OFFICIAL_MARKET_DATE: ${{ steps.calendar.outputs.market_date }}
          V7_DATA_ONLY_RECOVERY: ${{ github.event_name == 'workflow_dispatch' && inputs.data_only == true && 'true' || 'false' }}
        run: node tests/sync_institution_data.mjs
      - name: Verify prior-session market + institution prerequisites after midnight
        if: steps.calendar.outputs.proceed == 'true' && steps.calendar.outputs.cross_midnight_fallback == 'true' && github.event_name == 'schedule'
        env:
          V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
          RECOVERY_MARKET_DATE: ${{ steps.calendar.outputs.market_date }}
        run: node tests/verify_cross_midnight_recovery_prereqs.mjs

      - name: Sync official index, quarterly financials, valuation and TDCC (no plan changes)
        if: steps.calendar.outputs.proceed == 'true' && (github.event_name != 'workflow_dispatch' || inputs.market_date == '')
        env:
          V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
          QUALITY_MARKET_DATE: ${{ steps.calendar.outputs.market_date }}
          QUALITY_RECOVERY_ONLY: ${{ github.event_name == 'schedule' && github.event.schedule == '45 15 * * 1-5' && '1' || '0' }}
        run: node tests/sync_official_quality.mjs
      - name: Recover missing same-day analysis after complete data (skip prior success)
        if: >-
          steps.calendar.outputs.proceed == 'true' &&
          ((github.event_name == 'schedule' && github.event.schedule == '45 15 * * 1-5') ||
           (github.event_name == 'workflow_dispatch' && inputs.market_date == '' && inputs.quality_only != true && inputs.data_only != true))
        env:
          V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
          RECOVERY_MARKET_DATE: ${{ github.event_name == 'schedule' && steps.calendar.outputs.market_date || '' }}
          RECOVERY_SCHEDULED_FALLBACK: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
        run: node tests/recover_after_market.mjs

      - name: Historical official quality recovery
        if: >-
          github.event_name == 'workflow_dispatch' && inputs.market_date != '' &&
          (inputs.data_only != true ||
           ((inputs.data_scope == 'quality' || inputs.data_scope == 'all') &&
            steps.calendar.outputs.proceed == 'true'))
        env:
          V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
          QUALITY_MARKET_DATE: ${{ inputs.market_date }}
          QUALITY_RECOVERY_ONLY: '1'
          V7_DATA_ONLY_RECOVERY: ${{ github.event_name == 'workflow_dispatch' && inputs.data_only == true && 'true' || 'false' }}
        run: node tests/sync_official_quality.mjs

      - name: Historical after-market recovery
        if: github.event_name == 'workflow_dispatch' && inputs.market_date != '' && inputs.quality_only != true && inputs.data_only != true
        env:
          V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
          RECOVERY_MARKET_DATE: ${{ inputs.market_date }}
        run: node tests/recover_after_market.mjs
