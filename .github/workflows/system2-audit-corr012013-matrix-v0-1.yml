name: System2 AUDIT CORR-012 013 Edge Matrix
on:
  pull_request:
    paths:
      - "system2/tests/audit_corr012_013_edge_matrix_v0_1.test.mjs"
      - "system2/runtime/outcome_tracker_v0_1.mjs"
      - "system2/runtime/execution_simulator_v0_1.mjs"
      - ".github/workflows/system2-audit-corr012013-matrix-v0-1.yml"
  push:
    branches: [main]
    paths:
      - "system2/tests/audit_corr012_013_edge_matrix_v0_1.test.mjs"
      - "system2/runtime/outcome_tracker_v0_1.mjs"
      - "system2/runtime/execution_simulator_v0_1.mjs"
      - ".github/workflows/system2-audit-corr012013-matrix-v0-1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run 9 isolated CORR-012 and 013 observational probes
        run: node system2/tests/audit_corr012_013_edge_matrix_v0_1.test.mjs
      - name: Syntax check
        run: |
          node --check system2/runtime/outcome_tracker_v0_1.mjs
          node --check system2/runtime/execution_simulator_v0_1.mjs
