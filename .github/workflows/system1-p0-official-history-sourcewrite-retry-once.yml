name: System1 P0 OFFICIAL History Existing D1 Source Write Permission Retry ONCE
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/system1-p0-official-history-sourcewrite-retry-once.yml"
permissions:
  contents: read
concurrency:
  group: system1-history-cache-dataonly-safe-write
  cancel-in-progress: false
jobs:
  safely_retry_existing_token:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
      V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prove no-op source-scope D1 permission gate and official parser tests
        run: |
          set -euo pipefail
          node --check ops/system1_p0_official_fullmarket_history_append_once_v0_1.mjs
          node system2/tests/official_historical_a1_source_v0_1.test.mjs
          grep -F -q 'symbol=\x270000\x27' ops/system1_p0_official_fullmarket_history_append_once_v0_1.mjs || grep -F -q "WHERE symbol='0000'" ops/system1_p0_official_fullmarket_history_append_once_v0_1.mjs
      - name: Probe existing no-cost source token, then guarded original official market data-only append
        run: node ops/system1_p0_official_fullmarket_history_append_once_v0_1.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system1-p0-existing-sourcewrite-attempt-${{ github.run_id }}
          path: artifacts/system1-p0-official-wholemarket-firstbatch.json
          if-no-files-found: warn
          retention-days: 30
