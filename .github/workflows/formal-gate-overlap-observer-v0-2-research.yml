name: Formal Gate Overlap Observer V0.2 Research

on:
  push:
    paths:
      - "research/formal_gate_overlap_observer_v0_2.mjs"
      - "research/formal_gate_overlap_observer_v0_1_falsification.json"
      - "research/formal_gate_overlap_observer_spec_v0_2.json"
      - "tests/test_formal_gate_overlap_observer_v0_2.mjs"
      - ".github/workflows/formal-gate-overlap-observer-v0-2-research.yml"
  pull_request:
    paths:
      - "research/formal_gate_overlap_observer_v0_2.mjs"
      - "research/formal_gate_overlap_observer_v0_1_falsification.json"
      - "research/formal_gate_overlap_observer_spec_v0_2.json"
      - "tests/test_formal_gate_overlap_observer_v0_2.mjs"
      - ".github/workflows/formal-gate-overlap-observer-v0-2-research.yml"

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/test_formal_gate_overlap_observer_v0_2.mjs
