name: Research Room11 Numeric L3 Physical Readonly

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/room11_numeric_l3_batch_v0_1.mjs"
      - "tests/test_room11_numeric_l3_batch_v0_1.mjs"
      - ".github/workflows/research-room11-numeric-l3-physical-readonly.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: system2-research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run pure fail-closed and leakage tests
        run: node tests/test_room11_numeric_l3_batch_v0_1.mjs
      - name: Execute bounded real Taiwan R2/D1 numeric batch read-only
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
          SYSTEM2_R2_ACCESS_KEY_ID: ${{ secrets.SYSTEM2_R2_ACCESS_KEY_ID }}
          SYSTEM2_R2_SECRET_ACCESS_KEY: ${{ secrets.SYSTEM2_R2_SECRET_ACCESS_KEY }}
          SYSTEM2_R2_BUCKET: ${{ vars.SYSTEM2_R2_BUCKET }}
          ROOM11_NUMERIC_L3_OUTPUT: "/tmp/room11-numeric-l3-physical.json"
        run: |
          set -euo pipefail
          node research/room11_numeric_l3_batch_v0_1.mjs > /tmp/room11-numeric-l3-physical.log
          test -s /tmp/room11-numeric-l3-physical.json
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/room11-numeric-l3-physical.json","utf8"));if(!x.rowsWrittenZero||x.d1Metrics.rowsWritten!==0)process.exit(2);if(x.alphaClaimMade||x.priceReturnClaimMade||x.formalCoreChanged||x.system1RuntimeUsed||x.system2StrategyAuthorityChanged)process.exit(3);if(x.panel.issuerCount<8||x.panel.independentDateCount<80)process.exit(4);if(!x.panel.nextSessionBoundaryPurgeApplied||x.panel.populationInferenceAuthorized!==false||!x.panel.numericMethodL3Eligible)process.exit(5);const p=x.promotionsEligible||{};if(!p.D16_16_TIME_SERIES||!p.D16_18_REGULARIZATION||!p.D16_19_ML_CALIBRATION_TOOLING||!p.D16_24_DISTRIBUTIONAL_SIMULATION||p.D16_25_PROBABILISTIC_DECISION)process.exit(6);if(!x.panel.survivorshipAwareMembershipApplied&&p.D16_17_PANEL_CROSS_SECTION)process.exit(7);console.log(JSON.stringify({receiptHash:x.receiptHash,issuerCount:x.panel.issuerCount,independentDateCount:x.panel.independentDateCount,rowCount:x.panel.rowCount,rowsWritten:x.d1Metrics.rowsWritten,timeSeriesN:x.timeSeries.length,selected:x.featureSelection.selected,brier:x.calibration.brier,bootstrapDates:x.monteCarlo.inputIndependentDateN,promotionsEligible:p,membershipApplied:x.panel.survivorshipAwareMembershipApplied,persistedRegistryReceiptPresent:x.panel.persistedRegistryReceiptPresent,purgedTrainBoundaryRowCount:x.panel.purgedTrainBoundaryRowCount,purgedValidationBoundaryRowCount:x.panel.purgedValidationBoundaryRowCount}))'
      - name: Confirm repository isolation
        run: |
          set -euo pipefail
          git diff --exit-code -- Worker.js wrangler.toml
          ! grep -q 'from "../Worker.js"' research/room11_numeric_l3_batch_v0_1.mjs
          echo "Room11 numeric L3 batch research isolation PASS"
      - name: Upload physical receipt
        uses: actions/upload-artifact@v4
        with:
          name: room11-numeric-l3-physical-${{ github.sha }}
          path: /tmp/room11-numeric-l3-physical.json
          if-no-files-found: error
          retention-days: 30
