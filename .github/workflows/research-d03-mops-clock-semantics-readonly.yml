name: Research D03 MOPS Clock Semantics Readonly
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/d03_mops_source_clock_semantics_v0_1.mjs"
      - "tests/test_d03_mops_source_clock_semantics_v0_1.mjs"
      - "research/D03_MOPS_SOURCE_CLOCK_SEMANTIC_AUDIT_V0_1.md"
      - ".github/workflows/research-d03-mops-clock-semantics-readonly.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/test_d03_mops_source_clock_semantics_v0_1.mjs
      - shell: bash
        run: |
          set -euo pipefail
          ! grep -qE 'wrangler|deploy|CLOUDFLARE|V7_ADMIN_TOKEN|livePush|sendLine|THREEMIN' research/d03_mops_source_clock_semantics_v0_1.mjs
          echo "Research-only MOPS clock semantic boundary PASS"
