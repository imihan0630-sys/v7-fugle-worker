name: Room09 D12 official Delta version readonly

on:
  push:
    branches:
      - research-room09-d12-taifex-source-smoke-20261004
    paths:
      - .github/workflows/room09-d12-official-delta-version-readonly.yml

permissions:
  contents: read

jobs:
  delta-version:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch official TXO Delta page and emit version identity only
        shell: bash
        run: |
          set -euo pipefail
          url="https://www.taifex.com.tw/cht/3/optDailyDeltaExcel?scd_kind_id=TXO"
          curl --fail --silent --show-error --location --retry 2 -D /tmp/delta.headers "$url" -o /tmp/delta.html
          python - <<'PY'
          import hashlib, html, json, re
          raw=open("/tmp/delta.html","rb").read()
          text=raw.decode("utf-8",errors="replace")
          plain=html.unescape(re.sub(r"<[^>]+>"," ",text))
          plain=re.sub(r"\s+"," ",plain)
          pub=None
          m=re.search(r"公布日期時間[:：]\s*([^\n]{0,80}?)(?=商品|$)",plain)
          if m: pub=m.group(1).strip()
          if not pub:
              m=re.search(r"公布日期時間[:：]\s*([0-9/ :APMapm]+)",plain)
              if m: pub=m.group(1).strip()
          dates=sorted(set(re.findall(r"2026\d{4}",plain)))
          expiries=sorted(set(re.findall(r"2026\d{2}(?:W\d+|F\d+)?",plain)))
          result={
              "url":url,
              "sha256":hashlib.sha256(raw).hexdigest(),
              "byteCount":len(raw),
              "publicationText":pub,
              "txoOccurrenceCount":plain.count("TXO"),
              "dateTokens":dates[:30],
              "expiryTokens":expiries[:100],
              "containsClockNotes":("6:45" in plain and "14:30" in plain and "16:30" in plain),
              "rawPersisted":False
          }
          print("ROOM09_DELTA_VERSION_JSON="+json.dumps(result,ensure_ascii=False,separators=(",",":")))
          PY
