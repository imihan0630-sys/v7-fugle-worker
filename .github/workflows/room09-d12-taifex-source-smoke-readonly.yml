name: Room09 D12 TAIFEX source smoke readonly

on:
  push:
    branches:
      - research-room09-d12-taifex-source-smoke-20261004
    paths:
      - .github/workflows/room09-d12-taifex-source-smoke-readonly.yml

permissions:
  contents: read

jobs:
  source-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch one official TXO daily parent and emit metadata only
        shell: bash
        run: |
          set -euo pipefail
          url="https://www.taifex.com.tw/cht/3/optDataDown"
          out="/tmp/txo-20261002.csv"
          curl --fail --silent --show-error --location \
            --retry 2 --retry-delay 2 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -H "Accept: text/csv,*/*;q=0.8" \
            --data-urlencode "queryStartDate=2026/10/02" \
            --data-urlencode "queryEndDate=2026/10/02" \
            --data-urlencode "down_type=1" \
            --data-urlencode "commodity_id=TXO" \
            --data-urlencode "commodity_id2=" \
            "$url" -o "$out"

          python - <<'PY'
          import csv, hashlib, io, json
          from collections import Counter, defaultdict

          p="/tmp/txo-20261002.csv"
          raw=open(p,"rb").read()
          if raw.lstrip().lower().startswith((b"<!doctype", b"<html")):
              raise SystemExit("TAIFEX_RETURNED_HTML_NOT_CSV")
          raw_sha=hashlib.sha256(raw).hexdigest()
          try:
              text=raw.decode("cp950")
              decode_state="STRICT_CP950_PASS"
          except UnicodeDecodeError:
              text=raw.decode("cp950", errors="replace")
              decode_state="CP950_REPLACEMENT_REQUIRED"

          parsed=list(csv.reader(io.StringIO(text)))
          if len(parsed)<2:
              raise SystemExit("NO_DATA_ROWS")
          header=parsed[0]
          min_cols=max(len(header)-1,1)
          rows=[r for r in parsed[1:] if len(r)>=min_cols and r and r[0].strip()]
          if not rows:
              raise SystemExit("NO_VALID_DATA_ROWS")

          def field(r,i):
              return r[i].strip() if len(r)>i else ""

          def px(v):
              v=(v or "").replace(",","").strip()
              if not v or v=="-":
                  return None
              try:
                  return float(v)
              except ValueError:
                  return None

          dates=Counter(field(r,0) for r in rows)
          contracts=Counter(field(r,1) for r in rows)
          months=Counter(field(r,2) for r in rows)
          cps=Counter(field(r,4) for r in rows)
          sessions=Counter(field(r,17) for r in rows)

          eligible=0
          zero_bid=0
          missing_side=0
          crossed=0
          pair_map=defaultdict(dict)
          session_quality=defaultdict(lambda: Counter())

          for r in rows:
              bid=px(field(r,12))
              ask=px(field(r,13))
              sess=field(r,17)
              if bid is None or ask is None:
                  missing_side += 1
                  session_quality[sess]["missingSide"] += 1
                  continue
              if bid <= 0:
                  zero_bid += 1
                  session_quality[sess]["zeroBid"] += 1
                  continue
              if ask < bid:
                  crossed += 1
                  session_quality[sess]["crossed"] += 1
                  continue
              eligible += 1
              session_quality[sess]["eligibleMid"] += 1
              key=(field(r,0),field(r,2),field(r,3),sess)
              cp=field(r,4)
              pair_map[key][cp]=(bid+ask)/2

          paired=0
          pair_by_session=Counter()
          pair_by_month=Counter()
          for key, sides in pair_map.items():
              labels=set(sides)
              if ({"買權","賣權"} <= labels) or ({"Call","Put"} <= labels) or ({"C","P"} <= labels):
                  paired += 1
                  pair_by_session[key[3]] += 1
                  pair_by_month[key[1]] += 1

          header_trim=[h.strip() for h in header if h.strip()]
          summary={
              "sourceUrl":"https://www.taifex.com.tw/cht/3/optDataDown",
              "query":{"start":"2026/10/02","end":"2026/10/02","contract":"TXO","downType":"1"},
              "rawSha256":raw_sha,
              "rawByteCount":len(raw),
              "decodeState":decode_state,
              "headerCount":len(header),
              "header":header_trim,
              "rowCount":len(rows),
              "dates":dict(dates),
              "contracts":dict(contracts),
              "sessions":dict(sessions),
              "callPutLabels":dict(cps),
              "expiryCount":len(months),
              "expiryTop20":months.most_common(20),
              "quoteQuality":{
                  "eligibleMid":eligible,
                  "missingSide":missing_side,
                  "zeroBid":zero_bid,
                  "crossed":crossed,
                  "eligibleShare":round(eligible/len(rows),6)
              },
              "sessionQuality":{k:dict(v) for k,v in sorted(session_quality.items())},
              "pairedCallPutCommonSupportCount":paired,
              "pairedBySession":dict(pair_by_session),
              "pairedByExpiryTop20":pair_by_month.most_common(20),
              "rawPersisted":False,
              "formalDecisionImpact":False
          }
          print("ROOM09_SUMMARY_JSON="+json.dumps(summary,ensure_ascii=False,separators=(",",":")))
          PY
