name: System2 Supplemental Revision Provenance Receipt V0.2 Readonly

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "system2/runtime/supplemental_revision_provenance_receipt_v0_2.mjs"
      - "system2/tests/supplemental_revision_provenance_receipt_v0_2.test.mjs"
      - "system2/scripts/probe_supplemental_revision_provenance_receipt_readonly_v0_2.mjs"
      - "system2/SYSTEM2_SUPPLEMENTAL_REVISION_PROVENANCE_RECEIPT_V0_2.md"
      - ".github/workflows/system2-supplemental-revision-provenance-receipt-v0-2-readonly.yml"
  push:
    branches: [main]
    paths:
      - "system2/runtime/supplemental_revision_provenance_receipt_v0_2.mjs"
      - "system2/tests/supplemental_revision_provenance_receipt_v0_2.test.mjs"
      - "system2/scripts/probe_supplemental_revision_provenance_receipt_readonly_v0_2.mjs"
      - "system2/SYSTEM2_SUPPLEMENTAL_REVISION_PROVENANCE_RECEIPT_V0_2.md"
      - ".github/workflows/system2-supplemental-revision-provenance-receipt-v0-2-readonly.yml"

permissions:
  contents: read

concurrency:
  group: system2-supplemental-revision-provenance-v0-2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run receipt V0.2 tests
        run: node system2/tests/supplemental_revision_provenance_receipt_v0_2.test.mjs

      - name: Physically verify updated six-lane receipt
        run: node system2/scripts/probe_supplemental_revision_provenance_receipt_readonly_v0_2.mjs

      - name: Confirm read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -qE 'CLOUDFLARE|SYSTEM2_DB|wrangler|secret|deploy|INSERT|UPDATE|DELETE' system2/scripts/probe_supplemental_revision_provenance_receipt_readonly_v0_2.mjs
          echo "Read-only supplemental revision provenance V0.2 boundary PASS"
