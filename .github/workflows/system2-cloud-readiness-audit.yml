name: System2 Cloud Readiness Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/system2-cloud-readiness-audit.yml"

permissions:
  contents: read

concurrency:
  group: system2-cloud-readiness-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read-only Cloudflare capability and isolation audit
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
          LEGACY_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node <<'NODE'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";

          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const dedicatedToken = process.env.SYSTEM2_CLOUDFLARE_API_TOKEN;
          const legacyToken = process.env.LEGACY_CLOUDFLARE_API_TOKEN;
          const apiToken = dedicatedToken || legacyToken;
          const tokenSource = dedicatedToken ? "SYSTEM2_DEDICATED" : "LEGACY_WORKERS";
          assert.ok(accountId, "CLOUDFLARE_ACCOUNT_ID repository secret is missing");
          assert.ok(apiToken, "No Cloudflare API token repository secret is available");

          const origin = "https://api.cloudflare.com/client/v4";
          const headers = {
            authorization: `Bearer ${apiToken}`,
            accept: "application/json",
          };

          function digest(value) {
            return createHash("sha256").update(String(value)).digest("hex").slice(0, 12);
          }

          async function requestJson(url) {
            const response = await fetch(url, {
              method: "GET",
              headers,
              signal: AbortSignal.timeout(45000),
            });
            const text = await response.text();
            let data = null;
            try { data = JSON.parse(text); } catch {}
            return {
              ok: response.ok && data?.success !== false,
              status: response.status,
              data,
              error: data?.errors?.[0]?.message || (response.ok ? null : text.slice(0, 300)),
            };
          }

          const tokenVerify = await requestJson(
            dedicatedToken
              ? `${origin}/accounts/${accountId}/tokens/verify`
              : `${origin}/user/tokens/verify`,
          );
          const workers = await requestJson(`${origin}/accounts/${accountId}/workers/scripts`);
          const d1 = await requestJson(`${origin}/accounts/${accountId}/d1/database?per_page=100`);

          const scripts = workers.ok && Array.isArray(workers.data?.result)
            ? workers.data.result
            : [];
          const databases = d1.ok && Array.isArray(d1.data?.result)
            ? d1.data.result
            : [];

          const targetDbName = "system2-research";
          const targetWorkerName = "system2-shadow-research";
          const targetDatabases = databases.filter((x) => x?.name === targetDbName);
          const targetWorkers = scripts.filter((x) => x?.id === targetWorkerName);

          const result = {
            readOnly: true,
            token: {
              source: tokenSource,
              verifyOk: tokenVerify.ok,
              status: tokenVerify.status,
              error: tokenVerify.error,
            },
            capability: {
              listWorkerScripts: {
                ok: workers.ok,
                status: workers.status,
                error: workers.error,
              },
              listD1Databases: {
                ok: d1.ok,
                status: d1.status,
                error: d1.error,
              },
            },
            d1: {
              visibleCount: databases.length,
              exactTargetExists: targetDatabases.length === 1,
              exactTargetCount: targetDatabases.length,
              exactTargetIdDigest:
                targetDatabases.length === 1
                  ? digest(targetDatabases[0].uuid || targetDatabases[0].id || targetDbName)
                  : null,
              system2NamedDatabases: databases
                .filter((x) => /system2|system-2/i.test(String(x?.name || "")))
                .map((x) => ({
                  name: x.name,
                  idDigest: x.uuid || x.id ? digest(x.uuid || x.id) : null,
                })),
            },
            worker: {
              visibleCount: scripts.length,
              exactTargetExists: targetWorkers.length === 1,
              exactTargetCount: targetWorkers.length,
              system2NamedWorkers: scripts
                .filter((x) => /system2|system-2/i.test(String(x?.id || "")))
                .map((x) => ({ name: x.id })),
            },
          };

          if (!tokenVerify.ok) result.decision = "TOKEN_AUTHENTICATION_FAILED";
          else if (!d1.ok) result.decision = "D1_PERMISSION_OR_CAPABILITY_MISSING";
          else if (targetDatabases.length > 1 || targetWorkers.length > 1) {
            result.decision = "AMBIGUOUS_DUPLICATE_RESOURCE";
          } else if (targetDatabases.length === 1) {
            result.decision = "DATABASE_EXISTS_AUDIT_BEFORE_MIGRATION";
          } else {
            result.decision = "DATABASE_NOT_FOUND_PROVISIONING_REQUIRED";
          }

          console.log(JSON.stringify(result, null, 2));

          // Read-only audit succeeds even when a capability is absent.
          // The result is evidence for the next provisioning decision.
          assert.ok(tokenVerify.ok, "Cloudflare API token itself is not currently valid");
          NODE

      - name: Confirm no deployment or mutation command exists
        run: |
          set -euo pipefail
          ! grep -Eiq 'wrangler[[:space:]]+deploy|d1[[:space:]]+create|method:[[:space:]]*"(POST|PUT|PATCH|DELETE)"'             .github/workflows/system2-cloud-readiness-audit.yml
          echo "Read-only workflow mutation guard PASS"

