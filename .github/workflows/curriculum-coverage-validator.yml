name: Curriculum Coverage Validator

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'research/curriculum_coverage_return_validator_v0_1.mjs'
      - 'tests/test_curriculum_coverage_return_validator_v0_1.mjs'
      - 'research/CURRICULUM_COVERAGE_RETURN_VALIDATOR_CHECKPOINT_20261003.md'
      - '.github/workflows/curriculum-coverage-validator.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run curriculum coverage governance validator tests
        run: |
          set -euo pipefail
          node --check research/curriculum_coverage_return_validator_v0_1.mjs
          node tests/test_curriculum_coverage_return_validator_v0_1.mjs
