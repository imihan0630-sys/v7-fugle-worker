name: S2 M07 SOURCE R2 Bounded MultiPage Metadata Readonly
# One-shot max four GET ListObjectsV2, 1000 keys each. Never claims original object SHA.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/system2-m07-source-r2-multipage-readonly.yml
permissions:
  contents: read
concurrency:
  group: s2-m07-source-r2-bounded-multipage-one-shot
  cancel-in-progress: false
jobs:
  r2_metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: system2-research
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Adversarial tests and syntax
        run: |
          set -euo pipefail
          node --check system2/migration/issue1236_m07_r2_multipage_metadata_only_v0_1.mjs
          node system2/tests/issue1236_m07_r2_multipage_metadata_only_v0_1.test.mjs
      - name: Source R2 four-GET maximum read-only metadata census
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_R2_ACCESS_KEY_ID: ${{ secrets.SYSTEM2_R2_ACCESS_KEY_ID }}
          SYSTEM2_R2_SECRET_ACCESS_KEY: ${{ secrets.SYSTEM2_R2_SECRET_ACCESS_KEY }}
          SYSTEM2_R2_BUCKET: ${{ vars.SYSTEM2_R2_BUCKET }}
        run: node system2/migration/issue1236_m07_r2_multipage_metadata_only_v0_1.mjs
      - name: Preserve sanitized no-key no-token receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s2-m07-source-r2-multipage-readonly-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/s2-m07-source-r2-multipage/sanitized-result.json
          if-no-files-found: warn
          retention-days: 30
