name: System2 Historical D1 Physical Smoke

on:
  push:
    paths:
      - ".github/workflows/system2-historical-d1-physical-smoke.yml"
  workflow_dispatch:
    inputs:
      quota_reservation_rows:
        description: "Evidence-based conservative D1 rowsWritten reservation"
        required: false
        default: "0"
        type: string

permissions:
  contents: read

concurrency:
  group: system2-isolated-d1-writer
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: system2-research
    env:
      SYSTEM2_HISTORY_SMOKE_DATE: "2026-09-24"
      SYSTEM2_HISTORY_SMOKE_RETRY_GENERATION: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Reserve shared account D1 budget
        id: quota
        uses: ./.github/actions/system2-d1-budget-gate
        with:
          writer_id: HISTORICAL_D1_PHYSICAL_SMOKE
          requested_rows_written: ${{ inputs.quota_reservation_rows || '0' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Migrate isolated System2 D1 through schema 1.1
        if: steps.quota.outputs.physical_allowed == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
          SYSTEM2_CONFIRM: CREATE_SYSTEM2_ISOLATED_D1
        run: node system2/deploy/provision_system2_d1.mjs

      - name: Persist one real historical trading date into isolated D1
        if: steps.quota.outputs.physical_allowed == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
        run: node system2/scripts/persist_official_historical_a1_smoke_d1_v0_1.mjs

      - name: Reconcile shared account D1 budget result
        if: always() && steps.quota.outputs.physical_allowed == 'true'
        uses: ./.github/actions/system2-d1-budget-gate
        with:
          writer_id: HISTORICAL_D1_PHYSICAL_SMOKE
          mode: result
          reservation_receipt_path: ${{ steps.quota.outputs.reservation_receipt_path }}
          execution_outcome: ${{ job.status }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Confirm System1 production files untouched
        run: |
          set -euo pipefail
          test "$(sed -n '1p' wrangler.toml)" = 'name = "fugle-test"'
          git diff --exit-code -- wrangler.toml Worker.js
