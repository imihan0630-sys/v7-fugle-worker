name: V8 Owner Data Only TODAY Quality Repair ONCE 20261012
on:
  push:
    branches:
      - ops/v8-owner-manual-preflight-20261012
    paths:
      - .github/workflows/v8-owner-quality-data-only-once-20261012.yml
permissions:
  contents: read
jobs:
  restore_quality_only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QUALITY_MARKET_DATE: "2026-10-12"
      QUALITY_RECOVERY_ONLY: "1"
      V7_DATA_ONLY_RECOVERY: "true"
      V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify original code syntax and real market/institution prerequisites
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/sync_official_quality.mjs
          test -n "$V7_ADMIN_TOKEN"
      - name: Verify and ingest only missing official quality datasets using existing guarded production script
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node tests/sync_official_quality.mjs 2>&1 | tee artifacts/v8-owner-quality-repair-20261012.log
      - name: Persist original quality data-only validation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-owner-quality-data-only-20261012-${{ github.run_id }}
          path: artifacts/v8-owner-*
          if-no-files-found: warn
          retention-days: 60
