name: System2 S2-07 MOPS Repeated-Capture Stability V1.6.1 Readonly

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "system2/runtime/s2_07_mops_repeated_capture_stability_v1_6_1.mjs"
      - "system2/tests/s2_07_mops_repeated_capture_stability_v1_6_1.test.mjs"
      - "system2/scripts/probe_s2_07_mops_repeated_capture_stability_readonly_v1_6_1.mjs"
      - "system2/SYSTEM2_S2_07_MOPS_REPEATED_CAPTURE_STABILITY_V1_6_1.md"
      - ".github/workflows/system2-s2-07-mops-repeated-capture-stability-v1-6-1-readonly.yml"
  push:
    branches: [main]
    paths:
      - "system2/runtime/s2_07_mops_repeated_capture_stability_v1_6_1.mjs"
      - "system2/tests/s2_07_mops_repeated_capture_stability_v1_6_1.test.mjs"
      - "system2/scripts/probe_s2_07_mops_repeated_capture_stability_readonly_v1_6_1.mjs"
      - "system2/SYSTEM2_S2_07_MOPS_REPEATED_CAPTURE_STABILITY_V1_6_1.md"
      - ".github/workflows/system2-s2-07-mops-repeated-capture-stability-v1-6-1-readonly.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: V1.6.1 repeated-capture contract tests
        run: node system2/tests/s2_07_mops_repeated_capture_stability_v1_6_1.test.mjs

      - name: Physical two-pass MOPS month-shard stability capture
        run: node system2/scripts/probe_s2_07_mops_repeated_capture_stability_readonly_v1_6_1.mjs

      - name: No mutation scheduler or System1 authority
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ! grep -qE '\b(INSERT|UPDATE|DELETE|REPLACE|DROP|ALTER|CREATE)\b' system2/scripts/probe_s2_07_mops_repeated_capture_stability_readonly_v1_6_1.mjs
          ! grep -qE 'wrangler[[:space:]]+(deploy|secret)|secret[[:space:]]+put|workers[[:space:]]+deploy|cron' system2/scripts/probe_s2_07_mops_repeated_capture_stability_readonly_v1_6_1.mjs
          git diff --exit-code -- Worker.js wrangler.toml

      - name: Upload physical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s2-07-mops-repeated-capture-stability-v1-6-1
          path: /tmp/S2_07_MOPS_REPEATED_CAPTURE_STABILITY_V1_6_1_PHYSICAL_20261007.json
          retention-days: 14
