name: System1 P0 60-Day History Data-only FIRST BATCH (MAX 24)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/system1-p0-history60-dataonly-firstbatch.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: system1-history-cache-dataonly-safe-write
  cancel-in-progress: false
jobs:
  bounded_restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
      FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
      V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Preflight syntax and protected data-only edit scope
        run: |
          set -euo pipefail
          node --check ops/system1_p0_history60_bounded_repair_once_v0_1.mjs
          grep -F -q 'LIMIT=24' ops/system1_p0_history60_bounded_repair_once_v0_1.mjs
          grep -F -q 'WHERE symbol=?3 AND updated_at=?4' ops/system1_p0_history60_bounded_repair_once_v0_1.mjs
      - name: Bounded factual historical candles from existing Fugle token to existing v7-live D1
        run: node ops/system1_p0_history60_bounded_repair_once_v0_1.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system1-history60-source-verified-repair-${{ github.run_id }}
          path: artifacts/system1-history60-dataonly-backfill.json
          if-no-files-found: warn
          retention-days: 30
