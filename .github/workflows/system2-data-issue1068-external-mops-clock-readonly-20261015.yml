name: S2 DATA #1068 Historical MOPS External Clock GET Only
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/system2-data-issue1068-external-mops-clock-readonly-20261015.yml
      - system2/migration/issue1068_external_historical_clock_candidate_readonly_v0_1.mjs
      - system2/tests/issue1068_external_historical_clock_candidate_readonly_v0_1.test.mjs
  push:
    branches: [main]
    paths:
      - .github/workflows/system2-data-issue1068-external-mops-clock-readonly-20261015.yml

permissions:
  contents: read

concurrency:
  group: s2-data-issue1068-external-clock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline_pit_firewall:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Positive and adversarial historical PIT source-clock controls
        run: |
          set -euo pipefail
          node --check system2/migration/issue1068_external_historical_clock_candidate_readonly_v0_1.mjs
          node --test system2/tests/issue1068_external_historical_clock_candidate_readonly_v0_1.test.mjs

  one_shot_live_public_get:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: offline_pit_firewall
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Exact two public website GETs; current observation only, no D1 or R2
        run: node system2/migration/issue1068_external_historical_clock_candidate_readonly_v0_1.mjs
      - name: Archive original sanitized current HTTP-body SHA with no article text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s2-data-issue1068-external-clock-readonly-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/s2-issue1068-external-pit-clock/sanitized-external-clock-candidates.json
          retention-days: 90
          if-no-files-found: warn
      - name: Non-PIT historical publication clock caution
        if: always()
        run: |
          echo 'Current retrospective GET cannot prove original May 2026 public availability, native archive WARC, timezone or immutable version.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Historical firstKnownAt/availableAt remain NULL, historical PIT 0/9, no System1 V8 Formal or D1/R2 calls.' >> "$GITHUB_STEP_SUMMARY"
