name: System2 Supplemental Revision Blocker Receipt Readonly

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "system2/runtime/supplemental_revision_blocker_receipt_v0_1.mjs"
      - "system2/tests/supplemental_revision_blocker_receipt_v0_1.test.mjs"
      - "system2/scripts/probe_supplemental_revision_blocker_receipt_readonly_v0_1.mjs"
      - "system2/SYSTEM2_SUPPLEMENTAL_REVISION_BLOCKER_RECEIPT_V0_1.md"
      - ".github/workflows/system2-supplemental-revision-blocker-receipt-readonly.yml"
  push:
    branches: [main]
    paths:
      - "system2/runtime/supplemental_revision_blocker_receipt_v0_1.mjs"
      - "system2/tests/supplemental_revision_blocker_receipt_v0_1.test.mjs"
      - "system2/scripts/probe_supplemental_revision_blocker_receipt_readonly_v0_1.mjs"
      - "system2/SYSTEM2_SUPPLEMENTAL_REVISION_BLOCKER_RECEIPT_V0_1.md"
      - ".github/workflows/system2-supplemental-revision-blocker-receipt-readonly.yml"

permissions:
  contents: read

concurrency:
  group: system2-supplemental-revision-blocker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run blocker receipt unit tests
        run: node system2/tests/supplemental_revision_blocker_receipt_v0_1.test.mjs

      - name: Physically decompose supplemental revision blockers
        run: node system2/scripts/probe_supplemental_revision_blocker_receipt_readonly_v0_1.mjs

      - name: Confirm read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -qE 'CLOUDFLARE|SYSTEM2_DB|wrangler|secret|deploy|INSERT|UPDATE|DELETE' system2/scripts/probe_supplemental_revision_blocker_receipt_readonly_v0_1.mjs
          echo "Read-only supplemental revision blocker receipt boundary PASS"
