name: System2 MOPS U04 List Form Contract Readonly

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "system2/scripts/probe_mops_u04_list_form_contract_readonly_v0_1.mjs"
      - "system2/SYSTEM2_MOPS_U04_LIST_FORM_CONTRACT_V0_1.md"
      - ".github/workflows/system2-mops-u04-list-form-contract-readonly.yml"
  push:
    branches: [main]
    paths:
      - "system2/scripts/probe_mops_u04_list_form_contract_readonly_v0_1.mjs"
      - "system2/SYSTEM2_MOPS_U04_LIST_FORM_CONTRACT_V0_1.md"
      - ".github/workflows/system2-mops-u04-list-form-contract-readonly.yml"

permissions:
  contents: read

concurrency:
  group: system2-mops-u04-list-form-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe official MOPS U04 list form contract
        run: node system2/scripts/probe_mops_u04_list_form_contract_readonly_v0_1.mjs
      - name: Confirm read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -qE 'CLOUDFLARE|SYSTEM2_DB|wrangler|secret|deploy|INSERT|UPDATE|DELETE' system2/scripts/probe_mops_u04_list_form_contract_readonly_v0_1.mjs
          echo "MOPS U04 list form contract read-only boundary PASS"
