name: System2 S2-07 Reference Event Availability V1.2 Readonly

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "system2/runtime/s2_07_reference_event_availability_v1_2.mjs"
      - "system2/tests/s2_07_reference_event_availability_v1_2.test.mjs"
      - "system2/scripts/probe_s2_07_reference_event_availability_readonly_v1_2.mjs"
      - "system2/SYSTEM2_S2_07_REFERENCE_EVENT_AVAILABILITY_V1_2.md"
      - ".github/workflows/system2-s2-07-reference-event-availability-v1-2-readonly.yml"
  push:
    branches: [main]
    paths:
      - "system2/runtime/s2_07_reference_event_availability_v1_2.mjs"
      - "system2/tests/s2_07_reference_event_availability_v1_2.test.mjs"
      - "system2/scripts/probe_s2_07_reference_event_availability_readonly_v1_2.mjs"
      - "system2/SYSTEM2_S2_07_REFERENCE_EVENT_AVAILABILITY_V1_2.md"
      - ".github/workflows/system2-s2-07-reference-event-availability-v1-2-readonly.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Targeted 4806 historical availability tests
        run: node system2/tests/s2_07_reference_event_availability_v1_2.test.mjs
      - name: Read-only physical 4806 historical availability probe
        run: node system2/scripts/probe_s2_07_reference_event_availability_readonly_v1_2.mjs
      - name: Read-only and System1 isolation guard
        shell: bash
        run: |
          set -euo pipefail
          ! grep -qE '\\b(INSERT|UPDATE|DELETE|REPLACE|DROP|ALTER|CREATE)\\b' system2/scripts/probe_s2_07_reference_event_availability_readonly_v1_2.mjs
          ! grep -qE 'wrangler[[:space:]]+(deploy|secret)|secret[[:space:]]+put|workers[[:space:]]+deploy' system2/scripts/probe_s2_07_reference_event_availability_readonly_v1_2.mjs
          git diff --exit-code -- Worker.js wrangler.toml
          echo "S2-07 reference event availability V1.2 read-only/System1 isolation PASS"
