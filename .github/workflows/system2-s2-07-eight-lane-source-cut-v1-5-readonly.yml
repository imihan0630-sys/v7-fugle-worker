name: System2 S2-07 Eight-Lane Source Cut V1.5 Readonly

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "system2/runtime/s2_07_eight_lane_source_cut_v1_5.mjs"
      - "system2/tests/s2_07_eight_lane_source_cut_v1_5.test.mjs"
      - "system2/scripts/probe_s2_07_eight_lane_source_cut_readonly_v1_5.mjs"
      - "system2/SYSTEM2_S2_07_EIGHT_LANE_SOURCE_CUT_V1_5.md"
      - ".github/workflows/system2-s2-07-eight-lane-source-cut-v1-5-readonly.yml"
  push:
    branches: [main]
    paths:
      - "system2/runtime/s2_07_eight_lane_source_cut_v1_5.mjs"
      - "system2/tests/s2_07_eight_lane_source_cut_v1_5.test.mjs"
      - "system2/scripts/probe_s2_07_eight_lane_source_cut_readonly_v1_5.mjs"
      - "system2/SYSTEM2_S2_07_EIGHT_LANE_SOURCE_CUT_V1_5.md"
      - ".github/workflows/system2-s2-07-eight-lane-source-cut-v1-5-readonly.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: V1.5 contract tests
        run: node system2/tests/s2_07_eight_lane_source_cut_v1_5.test.mjs
      - name: Physical eight-lane source-cut probe
        run: node system2/scripts/probe_s2_07_eight_lane_source_cut_readonly_v1_5.mjs
      - name: Read-only and System1 isolation
        shell: bash
        run: |
          set -euo pipefail
          ! grep -qE '\b(INSERT|UPDATE|DELETE|REPLACE|DROP|ALTER|CREATE)\b' system2/scripts/probe_s2_07_eight_lane_source_cut_readonly_v1_5.mjs
          ! grep -qE 'wrangler[[:space:]]+(deploy|secret)|secret[[:space:]]+put|workers[[:space:]]+deploy' system2/scripts/probe_s2_07_eight_lane_source_cut_readonly_v1_5.mjs
          git diff --exit-code -- Worker.js wrangler.toml
          echo "S2-07 V1.5 readonly/System1 isolation PASS"
