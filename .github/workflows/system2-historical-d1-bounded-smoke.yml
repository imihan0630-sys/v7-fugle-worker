name: System2 Historical D1 Bounded Smoke

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type WRITE_SYSTEM2_HISTORICAL_SMOKE to write a bounded official-history sample into isolated system2-research D1"
        required: true
        type: string
      market_date:
        description: "Historical market date (YYYY-MM-DD)"
        required: false
        default: "2026-09-24"
        type: string
      quota_reservation_rows:
        description: "Evidence-based conservative D1 rowsWritten reservation"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: system2-isolated-d1-writer
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: system2-research
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Guard explicit confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          test "$CONFIRM" = "WRITE_SYSTEM2_HISTORICAL_SMOKE"

      - name: Verify production isolation before write
        run: |
          set -euo pipefail
          test "$(sed -n '1p' wrangler.toml)" = 'name = "fugle-test"'
          echo "Production configuration isolation precheck PASS"

      - name: Reserve shared account D1 budget
        id: quota
        uses: ./.github/actions/system2-d1-budget-gate
        with:
          writer_id: HISTORICAL_D1_BOUNDED_SMOKE
          requested_rows_written: ${{ inputs.quota_reservation_rows }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Apply/reverify isolated System2 D1 schema v1.1
        if: steps.quota.outputs.physical_allowed == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
          SYSTEM2_CONFIRM: "CREATE_SYSTEM2_ISOLATED_D1"
        run: node system2/deploy/provision_system2_d1.mjs

      - name: Write bounded official-history sample and verify readback/idempotency
        if: steps.quota.outputs.physical_allowed == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
          SYSTEM2_HISTORICAL_SMOKE_CONFIRM: ${{ inputs.confirm }}
          SYSTEM2_HISTORICAL_SMOKE_DATE: ${{ inputs.market_date }}
        run: node system2/scripts/historical_d1_bounded_smoke.mjs

      - name: Reconcile shared account D1 budget result
        if: steps.quota.outputs.physical_allowed == 'true' && success()
        uses: ./.github/actions/system2-d1-budget-gate
        with:
          writer_id: HISTORICAL_D1_BOUNDED_SMOKE
          mode: result
          reservation_receipt_path: ${{ steps.quota.outputs.reservation_receipt_path }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Preserve quota evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system2-d1-bounded-smoke-quota-${{ github.run_id }}
          path: |
            /tmp/system2-d1-budget-reservation.json
            /tmp/system2-d1-budget-result.json
          if-no-files-found: warn
          retention-days: 30

      - name: Confirm production configuration was not edited
        run: |
          set -euo pipefail
          git diff --exit-code -- wrangler.toml Worker.js
          echo "Production configuration isolation postcheck PASS"
