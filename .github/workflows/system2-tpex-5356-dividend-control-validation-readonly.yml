name: System2 TPEx 5356 Dividend Control Validation Readonly

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "system2/scripts/probe_tpex_5356_dividend_control_validation_readonly_v0_1.mjs"
      - "system2/SYSTEM2_TPEX_5356_DIVIDEND_CONTROL_VALIDATION_V0_1.md"
      - ".github/workflows/system2-tpex-5356-dividend-control-validation-readonly.yml"
  push:
    branches: [main]
    paths:
      - "system2/scripts/probe_tpex_5356_dividend_control_validation_readonly_v0_1.mjs"
      - "system2/SYSTEM2_TPEX_5356_DIVIDEND_CONTROL_VALIDATION_V0_1.md"
      - ".github/workflows/system2-tpex-5356-dividend-control-validation-readonly.yml"

permissions:
  contents: read

concurrency:
  group: system2-tpex-5356-dividend-control-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate 5356 issuer + TPEx operational evidence
        run: node system2/scripts/probe_tpex_5356_dividend_control_validation_readonly_v0_1.mjs
      - name: Confirm read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -qE 'CLOUDFLARE|SYSTEM2_DB|wrangler|secret|deploy|INSERT|UPDATE|DELETE' system2/scripts/probe_tpex_5356_dividend_control_validation_readonly_v0_1.mjs
          echo "Read-only 5356 validation boundary PASS"
