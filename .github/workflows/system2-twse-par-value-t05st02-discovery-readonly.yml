name: System2 TWSE Par Value T05ST02 Daily Discovery Readonly

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "system2/scripts/probe_twse_par_value_t05st02_discovery_readonly_v0_1.mjs"
      - "system2/SYSTEM2_TWSE_PAR_VALUE_T05ST02_DISCOVERY_V0_1.md"
      - ".github/workflows/system2-twse-par-value-t05st02-discovery-readonly.yml"
  push:
    branches: [main]
    paths:
      - "system2/scripts/probe_twse_par_value_t05st02_discovery_readonly_v0_1.mjs"
      - "system2/SYSTEM2_TWSE_PAR_VALUE_T05ST02_DISCOVERY_V0_1.md"
      - ".github/workflows/system2-twse-par-value-t05st02-discovery-readonly.yml"

permissions:
  contents: read

concurrency:
  group: system2-twse-par-value-t05st02-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Scan 2025 TWSE daily major-information index
        run: node system2/scripts/probe_twse_par_value_t05st02_discovery_readonly_v0_1.mjs
      - name: Confirm read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -qE 'CLOUDFLARE|SYSTEM2_DB|wrangler|secret|deploy|INSERT|UPDATE|DELETE' system2/scripts/probe_twse_par_value_t05st02_discovery_readonly_v0_1.mjs
          echo "TWSE par-value T05ST02 discovery read-only boundary PASS"
