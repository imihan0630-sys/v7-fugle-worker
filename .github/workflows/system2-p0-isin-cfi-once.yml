name: System2 P0 Current Native ISIN CFI ONE SHOT READONLY
on:
  push:
    branches: [main]
    paths: ['.github/workflows/system2-p0-isin-cfi-once.yml']
permissions:
  contents: read
  actions: read
jobs:
  native_cfi:
    if: github.repository == 'imihan0630-sys/v7-fugle-worker' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify bounded official source code and issuer-class non-promotion
        run: |
          set -euo pipefail
          node --test system2/tests/official_isin_cfi_readonly_v0_1.test.mjs
          git diff --exit-code -- Worker.js wrangler.toml
      - name: Download exact earlier real source V0.2 observation receipt
        uses: actions/download-artifact@v4
        with:
          run-id: 38477169340
          name: s2-v02-tdr-filtered-observation-38477169340
          path: /tmp/s2-v02-proof
          github-token: ${{ github.token }}
      - name: Resolve exactly one V0.2 receipt
        run: |
          set -euo pipefail
          N="$(find /tmp/s2-v02-proof -type f -name preliminary-pv-watch.json | wc -l)"
          test "$N" -eq 1
          F="$(find /tmp/s2-v02-proof -type f -name preliminary-pv-watch.json -print -quit)"
          test -s "$F"
          echo "S2_V02_WATCH_RECEIPT=$F" >> "$GITHUB_ENV"
      - name: Query official centralized ISIN current security classifications
        run: |
          set -euo pipefail
          node system2/scripts/probe_current_isin_cfi_readonly_v0_1.mjs
      - name: Confirm no historical class or official selection promotion
        run: |
          set -euo pipefail
          F=/tmp/s2-current-cfi/receipt.json
          test -s "$F"
          test "$(jq -r .previewCount "$F")" = '30'
          test "$(jq -r .historicalSecurityClassPITCertified "$F")" = 'false'
          test "$(jq -r .cfiToOrdinaryShareMappingCertified "$F")" = 'false'
          test "$(jq -r .selectedCount "$F")" = 'null'
          test "$(jq -r .frozenWritten "$F")" = 'false'
      - name: Save sanitized current CFI data counts and SHA only, no raw registry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s2-current-isin-cfi-${{ github.run_id }}
          path: /tmp/s2-current-cfi/receipt.json
          retention-days: 7
          if-no-files-found: warn
