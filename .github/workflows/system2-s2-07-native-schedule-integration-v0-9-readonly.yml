name: System2 S2-07 Native Schedule Integration V0.9 Readonly

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "system2/runtime/s2_07_native_schedule_integration_v0_9.mjs"
      - "system2/tests/s2_07_native_schedule_integration_v0_9.test.mjs"
      - "system2/scripts/probe_s2_07_native_schedule_integration_readonly_v0_9.mjs"
      - "system2/SYSTEM2_S2_07_NATIVE_SCHEDULE_INTEGRATION_V0_9.md"
      - "system2/evidence/S2_07_PROMOTION_LINKAGE_V0_7_PHYSICAL_20261006.json"
      - ".github/workflows/system2-s2-07-native-schedule-integration-v0-9-readonly.yml"
  push:
    branches: [main]
    paths:
      - "system2/runtime/s2_07_native_schedule_integration_v0_9.mjs"
      - "system2/tests/s2_07_native_schedule_integration_v0_9.test.mjs"
      - "system2/scripts/probe_s2_07_native_schedule_integration_readonly_v0_9.mjs"
      - "system2/SYSTEM2_S2_07_NATIVE_SCHEDULE_INTEGRATION_V0_9.md"
      - "system2/evidence/S2_07_PROMOTION_LINKAGE_V0_7_PHYSICAL_20261006.json"
      - ".github/workflows/system2-s2-07-native-schedule-integration-v0-9-readonly.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node system2/tests/s2_07_native_schedule_integration_v0_9.test.mjs
      - run: node system2/scripts/probe_s2_07_native_schedule_integration_readonly_v0_9.mjs
      - shell: bash
        run: |
          set -euo pipefail
          ! grep -qE 'CLOUDFLARE|SYSTEM2_DB|wrangler|secret|deploy|INSERT|UPDATE|DELETE' system2/scripts/probe_s2_07_native_schedule_integration_readonly_v0_9.mjs
          echo "S2-07 V0.9 read-only boundary PASS"
