                 data.evidenceReadiness.experiments.length!==8 ||
                 data.evidenceReadiness.experiments.some(x=>x.formalCoreImpact!==false)) {
                throw new Error("Research Evidence Readiness firewall contract failed");
              }
              if(data.antiOverfit?.redundancy?.researchOnly!==true ||
