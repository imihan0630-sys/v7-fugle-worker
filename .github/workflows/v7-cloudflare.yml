                throw new Error("Anti-overfit research firewall contract failed");
              }
              if(data.validationFirewall?.formalCoreImpact!==false) {
                throw new Error("Formal core firewall contract failed");
              }
              console.log("Research readback verified on expected deployment: "+expected);
              process.exit(0);
            }catch(error){
