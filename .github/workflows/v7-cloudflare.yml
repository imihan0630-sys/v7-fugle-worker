name: V8 Cloudflare Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Worker.js"
      - "scripts/apply_v7_5_27.py"
      - "scripts/apply_v7_5_30.py"
      - "scripts/apply_v7_5_31.py"
      - "scripts/apply_v7_5_33.py"
      - "scripts/apply_v8_0_1.py"
      - "scripts/apply_v8_0_2.py"
      - "scripts/apply_v8_0_3.py"
      - "scripts/apply_v8_0_4.py"
      - "scripts/apply_v8_1_0.py"
      - "scripts/apply_v8_1_1.py"
      - "scripts/apply_v8_1_2.py"
      - "scripts/apply_v8_1_3.py"
      - "scripts/apply_v8_2_0.py"
      - "scripts/apply_v8_2_1.py"
      - "scripts/apply_v8_3_0.py"
      - "scripts/apply_v8_3_1.py"
      - "scripts/apply_v8_4_0.py"
      - "scripts/apply_v8_4_1.py"
      - "scripts/apply_v8_5_0.py"
      - "scripts/apply_v8_5_2.py"
      - "scripts/apply_v8_6_0.py"
      - "scripts/apply_v8_6_1.py"
      - "scripts/apply_v8_6_2.py"
      - "scripts/apply_v8_6_3.py"
      - "scripts/apply_v8_7_0.py"
      - "scripts/apply_v8_7_1.py"
      - "scripts/apply_v8_7_2.py"
      - "scripts/apply_v8_7_3.py"
      - "scripts/apply_v8_7_4.py"
      - "RESEARCH_WORKLIST.md"
      - "research/**"
      - "data/v7_formal_scan_backfill.json"
      - "data/recovered_chat_selections.json"
      - "tests/**"
      - "!tests/inspect_official_quality_sources.mjs"
      - ".github/workflows/v7-cloudflare.yml"

permissions:
  contents: read

concurrency:
  group: v7-cloudflare-production
  cancel-in-progress: false

env:
  SCRIPT_NAME: fugle-test

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply guarded V7.5.29 repair
        run: python3 scripts/apply_v7_5_27.py

      - name: Apply V7.5.30 market consensus radar
        run: python3 scripts/apply_v7_5_30.py

      - name: Apply V7.5.31 push receipt clarity
        run: python3 scripts/apply_v7_5_31.py

      - name: Apply V7.5.33 DATA_INCOMPLETE and dynamic watchlist
        run: python3 scripts/apply_v7_5_33.py

      - name: Apply V8.0.1 requirement 11 financial completion
        run: python3 scripts/apply_v8_0_1.py

      - name: Apply V8.0.2 requirement 26 acceptance tracking
        run: python3 scripts/apply_v8_0_2.py

      - name: Apply V8.0.3 read-only 3Min authorization diagnostic
        run: python3 scripts/apply_v8_0_3.py

      - name: Apply V8.0.4 guarded current-plan 3Min recovery
        run: python3 scripts/apply_v8_0_4.py

      - name: Apply V8.1.0 operations hardening
        run: python3 scripts/apply_v8_1_0.py

      - name: Apply V8.1.1 acceptance state and health normalization
        run: python3 scripts/apply_v8_1_1.py

      - name: Apply V8.1.2 safe position reconciliation
        run: python3 scripts/apply_v8_1_2.py

      - name: Apply V8.1.3 operations console and durable acceptance
        run: python3 scripts/apply_v8_1_3.py

      - name: Apply V8.2.0 signed handset receipt confirmation
        run: python3 scripts/apply_v8_2_0.py

      - name: Apply V8.2.1 evidence-driven acceptance
        run: python3 scripts/apply_v8_2_1.py

      - name: Apply V8.3.0 D1 + Firestore migration bridge
        run: python3 scripts/apply_v8_3_0.py

      - name: Apply V8.3.1 provider-aware storage health
        run: python3 scripts/apply_v8_3_1.py

      - name: Apply V8.4.0 encrypted GitHub external mirror
        run: python3 scripts/apply_v8_4_0.py

      - name: Apply V8.4.1 provider-neutral requirement evidence
        run: python3 scripts/apply_v8_4_1.py

      - name: Apply V8.5.0 persistent trade journal
        run: python3 scripts/apply_v8_5_0.py

      - name: Apply V8.5.2 historical journal backfill
        run: python3 scripts/apply_v8_5_2.py

      - name: Apply V8.6.0 performance center
        run: python3 scripts/apply_v8_6_0.py

      - name: Apply V8.6.1 shared portal navigation
        run: python3 scripts/apply_v8_6_1.py

      - name: Apply V8.6.2 V7 formal selection performance
        run: python3 scripts/apply_v8_6_2.py

      - name: Apply V8.6.3 V7 latest-close source
        run: python3 scripts/apply_v8_6_3.py

      - name: Apply V8.7.0 research foundation
        run: python3 scripts/apply_v8_7_0.py

      - name: Apply V8.7.1 historical research reconstruction
        run: python3 scripts/apply_v8_7_1.py

      - name: Apply V8.7.2 shadow candidate firewall
        run: python3 scripts/apply_v8_7_2.py

      - name: Apply V8.7.3 validation firewall
        run: python3 scripts/apply_v8_7_3.py

      - name: Apply V8.7.4 counterfactual research
        run: python3 scripts/apply_v8_7_4.py

      - name: Syntax check Worker.js
        run: |
          set -euo pipefail
          cp Worker.js /tmp/Worker.mjs
          node --check /tmp/Worker.mjs

      - name: Validate V8.7.3 production contract
        run: |
          set -euo pipefail
          grep -F 'const VERSION = "8.7.4-counterfactual-research";' Worker.js
          grep -F 'PURGED_FORWARD_HOLDOUT' Worker.js
          grep -F 'SAME_SCAN_DATE_PAIRED_COHORT_DELTA' Worker.js
          grep -F 'FAILED_CLOSE_WITHIN_3D' Worker.js
          grep -F 'WITHIN_SCAN_DATE_MEDIAN_SPLIT' Worker.js
          grep -F 'trackedFactorDefinitions' Worker.js
          grep -F 'CREATE TABLE IF NOT EXISTS trade_research_shadow_candidates' Worker.js
          grep -F 'QUALIFIED_NOT_SELECTED' Worker.js
          grep -F 'BROAD_CONTROL' Worker.js
          grep -F 'url.pathname === "/api/research/reconstruct-history"' Worker.js
          grep -F 'RECONSTRUCTED_PRICE_ONLY' Worker.js
          grep -F '趨勢持續性研究分數' Worker.js
          grep -F 'CREATE TABLE IF NOT EXISTS trade_research_snapshots' Worker.js
          grep -F 'url.pathname === "/api/research/dashboard"' Worker.js
          grep -F '台股交易決策監控系統｜研究驗證中心' Worker.js
          grep -F 'const WATCHLIST_MAX = 12;' Worker.js
          grep -F 'async function finishDataIncompleteScan(' Worker.js
          grep -F 'function buildReviewedWatchlist(' Worker.js
          grep -F 'url.pathname === "/watchlist"' Worker.js
          grep -F 'MOPSFIN_OFFICIAL_Q4_CUMULATIVE_MINUS_Q3' Worker.js
          grep -F 'requirement26Complete' Worker.js
          grep -F 'url.pathname === "/api/three-min/auth-check"' Worker.js
          grep -F 'url.pathname === "/api/three-min/recover-current"' Worker.js
          grep -F 'CREATE TABLE IF NOT EXISTS v7_push_outbox' Worker.js
          grep -F 'url.pathname==="/api/system-overview"' Worker.js
          grep -F 'url.pathname==="/api/push-outbox"' Worker.js
          grep -F 'url.pathname==="/api/external-validation/stats"' Worker.js
          grep -F 'url.pathname === "/api/positions"' Worker.js
          grep -F 'url.pathname==="/api/storage/export-current"' Worker.js
          grep -F 'url.pathname==="/api/storage/github-accept"' Worker.js
          grep -F 'D1_GITHUB_ENCRYPTED' Worker.js

      - name: Behavioral regression (no real pushes or writes)
        env:
          V7_TEST_WORKER_PATH: ${{ github.workspace }}/Worker.js
        run: |
          node tests/test_requirements_repair.mjs
          node tests/test_three_min_auth_check.mjs
          node tests/test_three_min_current_recovery.mjs
          node tests/test_v8_1_ops_hardening.mjs
          node tests/test_v8_1_1_acceptance_state.mjs
          node tests/test_v8_1_2_position_reconciliation.mjs
          node tests/test_v8_1_3_ops_console.mjs
          node tests/test_v8_2_0_push_receipt.mjs
          node tests/test_v8_2_1_evidence_acceptance.mjs
          node tests/test_v8_3_0_storage_bridge.mjs
          node tests/test_v8_3_1_storage_health.mjs
          node tests/test_v8_4_0_github_mirror.mjs
          node tests/test_v8_4_1_provider_neutral.mjs
          node tests/test_v8_5_0_trade_journal.mjs
          node tests/test_v8_5_2_history_backfill.mjs
          node tests/test_v8_6_0_performance_center.mjs
          node tests/test_v8_6_1_shared_navigation.mjs
          node tests/test_v8_6_2_v7_formal_performance.mjs
          node tests/test_v8_6_3_v7_current_close.mjs
          node tests/test_v8_7_0_research_foundation.mjs
          node tests/test_v8_7_1_history_research.mjs
          node tests/test_v8_7_2_shadow_candidate_archive.mjs
          node tests/test_v8_7_3_validation_firewall.mjs
          node tests/test_v8_7_4_counterfactual_research.mjs
          node tests/github_plan_mirror.mjs self-test

      - name: Snapshot existing public monitoring configuration
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20             "https://fugle-test.imihan0630.workers.dev/?format=json"             --output /tmp/v7-predeploy.json

      - name: Check GitHub secrets
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CF_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CF_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }

      - name: Back up actual deployed Worker content and Cron
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
        run: node tests/capture_worker_backup.mjs

      - name: Preserve verified pre-deploy backup
        uses: actions/upload-artifact@v4
        with:
          name: v7-predeploy-${{ github.run_id }}
          path: /tmp/v7-predeploy-backup/
          retention-days: 30

      - name: Guard against accidental version downgrade
        run: |
          set -euo pipefail
          EXPECTED=$(python3 - <<'PY'
          import re
          text=open("Worker.js",encoding="utf-8").read()
          m=re.search(r'const VERSION = "([^"]+)";',text)
          if not m: raise SystemExit("Expected version missing")
          print(m.group(1))
          PY
          )
          CURRENT=$(node - <<'NODE'
          const response = await fetch("https://fugle-test.imihan0630.workers.dev/api/version?versionGuard=" + process.env.GITHUB_RUN_ID, {
            headers: { "user-agent": "V7-GitHub-Deploy/1.0", "accept": "application/json" },
            signal: AbortSignal.timeout(20000)
          });
          if (!response.ok) throw new Error(`Version guard HTTP ${response.status}`);
          const data = await response.json();
          if (!data?.version) throw new Error("Runtime version missing");
          process.stdout.write(String(data.version));
          NODE
          )
          python3 - "$CURRENT" "$EXPECTED" <<'PY'
          import re,sys
          cur,exp=sys.argv[1:3]
          def n(v):
              m=re.match(r'^(\d+)\.(\d+)\.(\d+)',v)
              if not m: raise SystemExit(f"Cannot compare version: {v}")
              return tuple(map(int,m.groups()))
          if n(cur) > n(exp):
              raise SystemExit(f"Refusing downgrade: runtime {cur} is newer than build {exp}")
          print(f"Version guard OK: runtime={cur}, build={exp}")
          PY

      - id: deploy
        name: Deploy Worker code only
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          RESPONSE_FILE="$(mktemp)"
          HTTP_CODE=$(curl --silent --show-error             --output "$RESPONSE_FILE"             --write-out "%{http_code}"             -X PUT             "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${SCRIPT_NAME}/content"             -H "Authorization: Bearer ${CF_API_TOKEN}"             -F 'metadata={"main_module":"Worker.js"};type=application/json'             -F 'Worker.js=@Worker.js;type=application/javascript+module')

          cat "$RESPONSE_FILE"
          echo

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Cloudflare deploy failed with HTTP ${HTTP_CODE}"
            exit 1
          fi

          python3 - "$RESPONSE_FILE" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          if data.get("success") is not True:
              raise SystemExit(f"Cloudflare API returned success != true: {data}")
          print("Cloudflare Worker content deploy succeeded.")
          PY

      - id: verify
        name: Verify deployed version and preserved configuration
        env:
          V7_TEST_WORKER_PATH: ${{ github.workspace }}/Worker.js
          V7_DEPLOY_BASELINE_PATH: /tmp/v7-predeploy.json
        run: node tests/verify_deployment.mjs

      - id: research_verify
        name: Verify research-only counterfactual readback
        env:
          V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
        run: |
          node - <<'NODE'
          const origin="https://fugle-test.imihan0630.workers.dev";
          const response=await fetch(origin+"/api/research/dashboard?days=90",{
            headers:{"x-admin-token":process.env.V7_ADMIN_TOKEN,"accept":"application/json"},
            signal:AbortSignal.timeout(60000)
          });
          const data=await response.json();
          console.log(JSON.stringify({
            version:data.version||null,
            shadow:data.shadowCandidates||null,
            counterfactual:{
              archivedRows:data.counterfactualResearch?.archivedRows,
              coverage:data.counterfactualResearch?.coverage,
              selectionAlphaMethod:data.counterfactualResearch?.selectionAlpha?.method
            },
            execution:{
              selectedPlans:data.executionAlpha?.selectedPlans,
              buyTriggeredPlans:data.executionAlpha?.buyTriggeredPlans
            },
            regime:{usableDays:data.regimePersistence?.usableDays},
            validation:data.validationFirewall||null
          }));
          if(!response.ok) throw new Error("Research dashboard readback HTTP "+response.status);
          if(data.counterfactualResearch?.researchOnly!==true ||
             data.counterfactualResearch?.decisionImpact!==false ||
             data.counterfactualResearch?.formalScoreImpact!==false) {
            throw new Error("Counterfactual research firewall contract failed");
          }
          if(data.executionAlpha?.researchOnly!==true || data.executionAlpha?.decisionImpact!==false) {
            throw new Error("Execution Alpha research firewall contract failed");
          }
          if(data.regimePersistence?.researchOnly!==true || data.regimePersistence?.decisionImpact!==false) {
            throw new Error("Regime/Persistence research firewall contract failed");
          }
          if(data.validationFirewall?.formalCoreImpact!==false) {
            throw new Error("Formal core firewall contract failed");
          }
          NODE

      - name: Seed D1 plan archive and report Firestore migration readiness
        if: contains(github.event.head_commit.message, '[v8-firestore-migration]')
        env:
          V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
        run: |
          node - <<'NODE'
          const origin="https://fugle-test.imihan0630.workers.dev";
          const response=await fetch(origin+"/api/storage/migrate-current",{
            method:"POST",
            headers:{"x-admin-token":process.env.V7_ADMIN_TOKEN,"content-type":"application/json","accept":"application/json"},
            body:"{}",
            signal:AbortSignal.timeout(60000)
          });
          const data=await response.json();
          console.log(JSON.stringify(data));
          if(![200,428].includes(response.status)) throw new Error("Storage migration readiness HTTP "+response.status);
          if(data?.d1?.verified!==true) throw new Error("D1 primary plan archive was not verified");
          if(data.noPlanChanges!==true || data.noPush!==true || data.noThreeMinWrite!==true || data.noTrade!==true) {
            throw new Error("Storage migration safety contract failed");
          }
          if(response.status===200 && data.migrationReady!==true) throw new Error("Firestore configured but migration did not verify");
          NODE

      - name: Verify 3Min Production token authorization (read-only)
        if: contains(github.event.head_commit.message, '[v8-3min-auth-check]')
        env:
          V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
        run: |
          node - <<'NODE'
          const response = await fetch("https://fugle-test.imihan0630.workers.dev/api/three-min/auth-check", {
            method: "GET",
            headers: {
              "x-admin-token": process.env.V7_ADMIN_TOKEN,
              "accept": "application/json",
              "user-agent": "V8-3Min-Auth-Acceptance/1.0"
            },
            signal: AbortSignal.timeout(20000)
          });
          const data = await response.json();
          console.log(JSON.stringify(data));
          if (!response.ok || data.authorized !== true || data.httpStatus < 200 || data.httpStatus >= 300) {
            throw new Error("3Min Production token authorization failed");
          }
          if (data.noWrite !== true || data.noPlanChanges !== true || data.noPush !== true) {
            throw new Error("3Min auth check safety contract failed");
          }
          NODE

      - name: Recover current 3Min plan after prior authorization failure
        if: contains(github.event.head_commit.message, '[v8-3min-recover]')
        env:
          V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
        run: |
          node - <<'NODE'
          const origin = "https://fugle-test.imihan0630.workers.dev";
          const headers = {
            "x-admin-token": process.env.V7_ADMIN_TOKEN,
            "content-type": "application/json",
            "accept": "application/json",
            "user-agent": "V8-3Min-Recovery/1.0"
          };
          const response = await fetch(origin + "/api/three-min/recover-current", {
            method: "POST", headers, body: "{}", signal: AbortSignal.timeout(60000)
          });
          const data = await response.json();
          console.log(JSON.stringify(data));
          if (!response.ok || data.recovered !== true || data.threeMinAccepted !== true ||
              data.threeMinVerified !== true || data.requirement26Complete !== true) {
            throw new Error("Current 3Min plan recovery was not verified");
          }
          if (data.noSelection !== true || data.noPlanChanges !== true || data.noPush !== true) {
            throw new Error("3Min recovery safety contract failed");
          }
          const scanResponse = await fetch(origin + "/api/scan/status", {
            method: "GET", headers, signal: AbortSignal.timeout(20000)
          });
          const scan = await scanResponse.json();
          if (!scanResponse.ok || scan.threeMin?.verified !== true ||
              scan.diagnostics?.requirements30?.requirement26?.complete !== true ||
              scan.diagnostics?.requirements30?.incompleteRules?.includes(26)) {
            throw new Error("Rule 26 persistence verification failed");
          }
          console.log(JSON.stringify({
            scanDate:scan.scanDate,
            rule26Complete:true,
            threeMinVerified:true,
            noSelection:true,
            noPlanChanges:true,
            noPush:true
          }));
          NODE

      - name: Backfill latest formal plan into V8 trade journal
        if: contains(github.event.head_commit.message, '[v8-journal-backfill]')
        env:
          V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
        run: |
          node - <<'NODE'
          const origin="https://fugle-test.imihan0630.workers.dev";
          const headers={"x-admin-token":process.env.V7_ADMIN_TOKEN,"content-type":"application/json","accept":"application/json"};
          const backfill=await fetch(origin+"/api/journal/backfill-latest",{
            method:"POST",headers,body:"{}",signal:AbortSignal.timeout(30000)
          });
          const data=await backfill.json();
          console.log(JSON.stringify(data));
          if(!backfill.ok || data.ok!==true || data.verified!==true) throw new Error("Trade journal latest-plan backfill failed");
          if(data.noPlanChanges!==true || data.noPush!==true || data.noTrade!==true) throw new Error("Trade journal backfill safety contract failed");
          const healthResponse=await fetch(origin+"/api/journal/health?date="+encodeURIComponent(data.scanDate),{
            headers,signal:AbortSignal.timeout(20000)
          });
          const health=await healthResponse.json();
          console.log(JSON.stringify(health));
          if(!healthResponse.ok || health.ok!==true || health.selectedCount!==health.planCount) throw new Error("Trade journal readback verification failed");
          NODE

      - name: Import recovered project-chat selections into journal
        if: contains(github.event.head_commit.message, '[v8-history-backfill]')
        env:
          V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
        run: |
          node - <<'NODE'
          const fs=await import("node:fs");
          const origin="https://fugle-test.imihan0630.workers.dev";
          const records=JSON.parse(fs.readFileSync("data/recovered_chat_selections.json","utf8"));
          const response=await fetch(origin+"/api/journal/history-import",{
            method:"POST",
            headers:{"x-admin-token":process.env.V7_ADMIN_TOKEN,"content-type":"application/json","accept":"application/json"},
            body:JSON.stringify({records}),
            signal:AbortSignal.timeout(60000)
          });
          const data=await response.json();
          console.log(JSON.stringify(data));
          if(!response.ok || data.ok!==true || data.imported!==records.length) throw new Error("Historical journal import failed");
          const check=await fetch(origin+"/api/journal?days=730",{headers:{"x-admin-token":process.env.V7_ADMIN_TOKEN},signal:AbortSignal.timeout(30000)});
          const journal=await check.json();
          console.log(JSON.stringify({recoveredSelections:journal.recoveredSelections,plans:journal.plans,signals:journal.signals}));
          if(!check.ok || journal.recoveredSelections<records.length) throw new Error("Historical journal readback failed");
          NODE

      - name: Import verified V7 formal scan backfill
        if: contains(github.event.head_commit.message, '[v7-formal-backfill]')
        env:
          V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
        run: |
          node - <<'NODE'
          const fs=await import("node:fs");
          const origin="https://fugle-test.imihan0630.workers.dev";
          const records=JSON.parse(fs.readFileSync("data/v7_formal_scan_backfill.json","utf8"));
          const response=await fetch(origin+"/api/v7-formal-backfill",{
            method:"POST",
            headers:{"x-admin-token":process.env.V7_ADMIN_TOKEN,"content-type":"application/json","accept":"application/json"},
            body:JSON.stringify({records}),
            signal:AbortSignal.timeout(60000)
          });
          const data=await response.json();
          console.log(JSON.stringify(data));
          if(!response.ok || data.ok!==true || data.imported!==records.length) throw new Error("V7 formal scan backfill failed");
          const check=await fetch(origin+"/api/v7-formal-performance?days=730",{
            headers:{"x-admin-token":process.env.V7_ADMIN_TOKEN},
            signal:AbortSignal.timeout(30000)
          });
          const perf=await check.json();
          console.log(JSON.stringify({summary:perf.summary,byScanDate:perf.byScanDate}));
          if(!check.ok || !Array.isArray(perf.rows) || perf.rows.filter(x=>x.scanDate==="2026-09-11").length<5) throw new Error("V7 formal performance readback failed");
          NODE

      - name: Backfill current formal research snapshot
        if: contains(github.event.head_commit.message, '[research-backfill-current]')
        env:
          V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
        run: |
          node - <<'NODE'
          const origin="https://fugle-test.imihan0630.workers.dev";
          const headers={"x-admin-token":process.env.V7_ADMIN_TOKEN,"content-type":"application/json","accept":"application/json"};
          const response=await fetch(origin+"/api/research/backfill-current",{
            method:"POST",headers,body:"{}",signal:AbortSignal.timeout(60000)
          });
          const data=await response.json();
          console.log(JSON.stringify(data));
          if(!response.ok || data.ok!==true || data.imported<1) throw new Error("Research snapshot current backfill failed");
          if(data.noPlanChanges!==true || data.noPush!==true || data.noTrade!==true) throw new Error("Research backfill safety contract failed");
          const check=await fetch(origin+"/api/research/dashboard?days=730",{
            headers:{"x-admin-token":process.env.V7_ADMIN_TOKEN},signal:AbortSignal.timeout(30000)
          });
          const dashboard=await check.json();
          console.log(JSON.stringify({
            snapshotCoverage:dashboard.snapshotCoverage,
            pathSummary:dashboard.pathPerformance?.summary,
            promotionGate:dashboard.promotionGate
          }));
          if(!check.ok || dashboard.systemName!=="台股交易決策監控系統") throw new Error("Research dashboard readback failed");
          if(!Array.isArray(dashboard.worklist) || dashboard.worklist.length!==4) throw new Error("Research worklist readback failed");
          if(dashboard.promotionGate?.promotionEligible===true) throw new Error("Formal core must remain locked with current sample size");
          NODE

      - name: Reconstruct verified historical research snapshots
        if: contains(github.event.head_commit.message, '[research-reconstruct-history]')
        env:
          V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
        run: |
          node - <<'NODE'
          const origin="https://fugle-test.imihan0630.workers.dev";
          const headers={"x-admin-token":process.env.V7_ADMIN_TOKEN,"content-type":"application/json","accept":"application/json"};
          const response=await fetch(origin+"/api/research/reconstruct-history",{
            method:"POST",headers,body:"{}",signal:AbortSignal.timeout(120000)
          });
          const data=await response.json();
          console.log(JSON.stringify(data));
          if(!response.ok || data.ok!==true || data.imported<1) throw new Error("Historical research reconstruction failed");
          if(data.noPlanChanges!==true || data.noPush!==true || data.noTrade!==true || data.noSelection!==true || data.noCurrentDataBackfill!==true) {
            throw new Error("Historical research reconstruction safety contract failed");
          }
          const check=await fetch(origin+"/api/research/dashboard?days=730",{
            headers:{"x-admin-token":process.env.V7_ADMIN_TOKEN},signal:AbortSignal.timeout(30000)
          });
          const dashboard=await check.json();
          console.log(JSON.stringify({
            snapshotCoverage:dashboard.snapshotCoverage,
            completenessAudit:dashboard.completenessAudit,
            pathSummary:dashboard.pathPerformance?.summary,
            factorStudy:{sampleCount:dashboard.factorStudy?.sampleCount,fullMatureCount:dashboard.factorStudy?.fullMatureCount,reconstructedMatureCount:dashboard.factorStudy?.reconstructedMatureCount},
            promotionGate:dashboard.promotionGate
          }));
          if(!check.ok || (dashboard.snapshotCoverage?.reconstructed||0)<1) throw new Error("Historical research snapshot readback failed");
          if((dashboard.completenessAudit?.reconstructionForwardFillViolations||0)!==0) throw new Error("Historical reconstruction look-ahead guard failed");
          if(dashboard.promotionGate?.promotionEligible===true) throw new Error("Formal core must remain locked");
          NODE

      - name: V8.1.0 read-only operations acceptance
        if: contains(github.event.head_commit.message, '[v8-ops-acceptance]')
        env:
          V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
        run: node tests/accept_v8_1_ops.mjs

      - name: Auto rollback if deployment verification fails
        if: ${{ failure() && steps.deploy.outcome == 'success' && (steps.verify.outcome == 'failure' || steps.research_verify.outcome == 'failure') }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npm exec --yes wrangler@4 -- rollback --name "$SCRIPT_NAME" --message "Automatic rollback after failed V8 deployment verification: ${GITHUB_SHA}"
          EXPECTED_ROLLBACK=$(python3 - <<'PY'
          import json
          print(json.load(open("/tmp/v7-predeploy-backup/metadata.json",encoding="utf-8"))["version"])
          PY
          )
          for attempt in $(seq 1 24); do
            CURRENT=$(curl --fail --silent --show-error --max-time 10               "https://fugle-test.imihan0630.workers.dev/api/version?rollbackCheck=${attempt}"               | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])') || true
            if [ "$CURRENT" = "$EXPECTED_ROLLBACK" ]; then
              echo "Rollback verified: $CURRENT"
              exit 0
            fi
            sleep 5
          done
          echo "Rollback command completed but restored runtime version was not verified."
          exit 1

