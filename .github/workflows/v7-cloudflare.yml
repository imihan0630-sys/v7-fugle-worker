                 data.externalEvidence?.formalCoreImpact!==false ||
                 data.externalEvidence?.schemaVersion!=="research-external-evidence-v2") {
                throw new Error("External research evidence firewall contract failed");
              }
              if((data.validationFirewall?.multipleTesting?.trackedExperimentDefinitions||0)!==8 ||
                 (data.validationFirewall?.multipleTesting?.totalTrackedDefinitions||0)<29) {
