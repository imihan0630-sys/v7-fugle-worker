                 data.counterfactualResearch?.twoEngineStudy?.formalCoreImpact!==false ||
                 data.counterfactualResearch?.twoEngineStudy?.method!=="R07_MEDIAN_SPLIT_TWO_ENGINE_COMPARISON") {
                throw new Error("R08 Two-Engine research firewall contract failed");
              }
              if(data.evidenceReadiness?.researchOnly!==true ||
