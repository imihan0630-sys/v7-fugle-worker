name: V7 Cloudflare Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Worker.js"
      - "scripts/apply_v7_5_27.py"
      - "tests/**"
      - "!tests/inspect_official_quality_sources.mjs"
      - ".github/workflows/v7-cloudflare.yml"

permissions:
  contents: read

concurrency:
  group: v7-cloudflare-production
  cancel-in-progress: false

env:
  SCRIPT_NAME: fugle-test

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply guarded V7.5.27 repair
        run: python3 scripts/apply_v7_5_27.py

      - name: Syntax check Worker.js
        run: |
          set -euo pipefail
          cp Worker.js /tmp/Worker.mjs
          node --check /tmp/Worker.mjs

      - name: Behavioral regression (no real pushes or writes)
        env:
          V7_TEST_WORKER_PATH: ${{ github.workspace }}/Worker.js
        run: node tests/test_requirements_repair.mjs

      - name: Snapshot existing public monitoring configuration
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            "https://fugle-test.imihan0630.workers.dev/?format=json" \
            --output /tmp/v7-predeploy.json

      - name: Check GitHub secrets
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CF_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CF_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }

      - name: Back up actual deployed Worker content and Cron
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
        run: node tests/capture_worker_backup.mjs

      - name: Preserve verified pre-deploy backup
        uses: actions/upload-artifact@v4
        with:
          name: v7-predeploy-${{ github.run_id }}
          path: /tmp/v7-predeploy-backup/
          retention-days: 30

      - name: Deploy Worker code only
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          RESPONSE_FILE="$(mktemp)"
          HTTP_CODE=$(curl --silent --show-error             --output "$RESPONSE_FILE"             --write-out "%{http_code}"             -X PUT             "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${SCRIPT_NAME}/content"             -H "Authorization: Bearer ${CF_API_TOKEN}"             -F 'metadata={"main_module":"Worker.js"};type=application/json'             -F 'Worker.js=@Worker.js;type=application/javascript+module')

          cat "$RESPONSE_FILE"
          echo

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Cloudflare deploy failed with HTTP ${HTTP_CODE}"
            exit 1
          fi

          python3 - "$RESPONSE_FILE" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          if data.get("success") is not True:
              raise SystemExit(f"Cloudflare API returned success != true: {data}")
          print("Cloudflare Worker content deploy succeeded.")
          PY

      - name: Verify deployed version and preserved configuration
        env:
          V7_TEST_WORKER_PATH: ${{ github.workspace }}/Worker.js
          V7_DEPLOY_BASELINE_PATH: /tmp/v7-predeploy.json
        run: node tests/verify_deployment.mjs

      - name: Cache verified official market data (this repair only)
        if: contains(github.event.head_commit.message, '[v7-live-acceptance]')
        env:
          V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
        run: node tests/prepare_market_cache.mjs
      - name: Live after-market scan and import acceptance (this repair only)
        if: contains(github.event.head_commit.message, '[v7-live-acceptance]')
        env:
          V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
        run: node tests/accept_after_market.mjs

      - name: Verify existing 3Min records and capital preview (no re-selection)
        if: contains(github.event.head_commit.message, '[v7-readback-acceptance]')
        env:
          V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
        run: node tests/accept_three_min_readback.mjs
      - name: Verify official institution data only (preserve existing plans)
        if: contains(github.event.head_commit.message, '[v7-institution-acceptance]')
        env:
          V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
        run: node tests/sync_institution_data.mjs
      - name: Verify full official quality data and readonly selection preview
        if: contains(github.event.head_commit.message, '[v7-quality-acceptance]')
        env:
          V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
        run: node tests/sync_official_quality.mjs --dry-run
