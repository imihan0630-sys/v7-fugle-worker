name: System2 S2-07 Native Schedule Diagnostic V0.9a Readonly

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "system2/SYSTEM2_S2_07_NATIVE_SCHEDULE_DIAGNOSTIC_V0_9A.md"
      - "system2/scripts/probe_s2_07_native_schedule_detail_readonly_v0_9a.mjs"
      - ".github/workflows/system2-s2-07-native-schedule-diagnostic-v0-9a-readonly.yml"
  pull_request:
    paths:
      - "system2/SYSTEM2_S2_07_NATIVE_SCHEDULE_DIAGNOSTIC_V0_9A.md"
      - "system2/scripts/probe_s2_07_native_schedule_detail_readonly_v0_9a.mjs"
      - ".github/workflows/system2-s2-07-native-schedule-diagnostic-v0-9a-readonly.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node system2/scripts/probe_s2_07_native_schedule_detail_readonly_v0_9a.mjs
      - shell: bash
        run: |
          set -euo pipefail
          ! grep -qE 'CLOUDFLARE|SYSTEM2_DB|wrangler|secret|deploy|INSERT|UPDATE|DELETE' system2/scripts/probe_s2_07_native_schedule_detail_readonly_v0_9a.mjs
          echo "S2-07 V0.9a read-only boundary PASS"
