name: D02 PVE257 Live Baseline Clean Readonly

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/d02_pve257_live_baseline_clean_readonly_v0_1.mjs"
      - "research/d02_pve257_baseline_content_receipt_v0_1.mjs"
      - "research/d02_pve256_same_slot_baseline_clean_guard_v0_1.mjs"
      - ".github/workflows/d02-pve257-live-baseline-clean-readonly.yml"

permissions:
  contents: read

concurrency:
  group: d02-pve257-live-baseline-clean-readonly
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read exact-slot baseline content without outcomes or mutation
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node research/d02_pve257_live_baseline_clean_readonly_v0_1.mjs
      - name: Preserve sanitized PVE-257 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d02-pve257-live-baseline-clean-readonly-${{ github.run_id }}
          path: artifacts/d02-pve257-live-baseline-clean-readonly.json
          if-no-files-found: warn
          retention-days: 30
