name: System2 TWSE Par Value Official Document Bounded Search Readonly

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "system2/scripts/probe_twse_par_value_official_document_bounded_search_readonly_v0_1.mjs"
      - "system2/SYSTEM2_TWSE_PAR_VALUE_OFFICIAL_DOCUMENT_BOUNDED_SEARCH_V0_1.md"
      - ".github/workflows/system2-twse-par-value-official-document-bounded-search-readonly.yml"
  push:
    branches: [main]
    paths:
      - "system2/scripts/probe_twse_par_value_official_document_bounded_search_readonly_v0_1.mjs"
      - "system2/SYSTEM2_TWSE_PAR_VALUE_OFFICIAL_DOCUMENT_BOUNDED_SEARCH_V0_1.md"
      - ".github/workflows/system2-twse-par-value-official-document-bounded-search-readonly.yml"

permissions:
  contents: read

concurrency:
  group: system2-twse-par-value-official-document-bounded-search-${{ github.ref }}
  cancel-in-progress: true

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run bounded official-document search
        run: node system2/scripts/probe_twse_par_value_official_document_bounded_search_readonly_v0_1.mjs
      - name: Confirm read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -qE 'CLOUDFLARE|SYSTEM2_DB|wrangler|secret|deploy|INSERT|UPDATE|DELETE' system2/scripts/probe_twse_par_value_official_document_bounded_search_readonly_v0_1.mjs
          echo "Read-only TWSE official-document bounded search boundary PASS"
