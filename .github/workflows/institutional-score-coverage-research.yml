name: Institutional Score Coverage Research

on:
  push:
    paths:
      - "research/institutional_score_decomposition_observer_v0_2.mjs"
      - "research/institutional_score_prospective_coverage_observer_v0_1.mjs"
      - "research/institutional_score_decomposition_correction_v0_2.json"
      - "research/institutional_score_decomposition_observer_v0_2.test.mjs"
      - "research/institutional_score_prospective_coverage_observer_v0_1.test.mjs"
      - "INSTITUTIONAL_SCORE_PROSPECTIVE_COVERAGE_RESEARCH.md"
      - "INSTITUTIONAL_SCORE_STREAK_PROVENANCE_CLASS_B_PROPOSAL.md"
      - ".github/workflows/institutional-score-coverage-research.yml"
  pull_request:
    paths:
      - "research/institutional_score_decomposition_observer_v0_2.mjs"
      - "research/institutional_score_prospective_coverage_observer_v0_1.mjs"
      - "research/institutional_score_decomposition_correction_v0_2.json"
      - "research/institutional_score_decomposition_observer_v0_2.test.mjs"
      - "research/institutional_score_prospective_coverage_observer_v0_1.test.mjs"
      - "INSTITUTIONAL_SCORE_PROSPECTIVE_COVERAGE_RESEARCH.md"
      - "INSTITUTIONAL_SCORE_STREAK_PROVENANCE_CLASS_B_PROPOSAL.md"
      - ".github/workflows/institutional-score-coverage-research.yml"

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node research/institutional_score_decomposition_observer_v0_2.test.mjs
      - run: node research/institutional_score_prospective_coverage_observer_v0_1.test.mjs
