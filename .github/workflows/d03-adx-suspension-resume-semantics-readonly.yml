name: D03 ADX Suspension Resume Semantics Readonly

on:
  push:
    branches: [main]
    paths:
      - "research/d03_adx_suspension_resume_wilder_state_semantics_20261008_v0_1.json"
      - "research/test_d03_adx_suspension_resume_wilder_state_semantics_v0_1.mjs"
      - ".github/workflows/d03-adx-suspension-resume-semantics-readonly.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run ADX suspension-resume semantics falsifier
        run: node research/test_d03_adx_suspension_resume_wilder_state_semantics_v0_1.mjs
      - name: Confirm read-only isolation
        shell: bash
        run: |
          set -euo pipefail
          ! grep -qE 'wrangler|INSERT|UPDATE|DELETE|sendPush|processSignalState' research/test_d03_adx_suspension_resume_wilder_state_semantics_v0_1.mjs
          echo "D03 ADX suspension-resume semantics isolation PASS"
