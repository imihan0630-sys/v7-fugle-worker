name: Research D16 Stress Harness L3 Readonly

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/d16_stress_harness_l3_v0_1.mjs"
      - "tests/test_d16_stress_harness_l3_v0_1.mjs"
      - ".github/workflows/research-d16-stress-harness-l3-readonly.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run D16-23 Taiwan PIT stress harness L3 suite
        run: node tests/test_d16_stress_harness_l3_v0_1.mjs
      - name: Confirm research-only isolation
        shell: bash
        run: |
          set -euo pipefail
          ! grep -qE 'wrangler|deploy|CLOUDFLARE|ADMIN_TOKEN|V7_ADMIN_TOKEN|livePush|sendLine|THREEMIN|fetch\(|INSERT|UPDATE|DELETE|CREATE TABLE|DROP TABLE' research/d16_stress_harness_l3_v0_1.mjs
          grep -F 'formalCoreChanged:false' research/d16_stress_harness_l3_v0_1.mjs
          grep -F 'currentOrFutureOutcomeAccessed:false' research/d16_stress_harness_l3_v0_1.mjs
          echo "Research-only D16 stress-harness boundary PASS"
