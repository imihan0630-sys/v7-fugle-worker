name: S2 G3 Independently Decrypt Restore and Extend Encrypted Bridge Once 20261012
# Corrected original transfer raw ciphertext SHA256 f6bfdff7... (distinct from GitHub ZIP SHA256 68c0244...).
# One-time main-only G3. Only reads EXISTING AES/RSA encrypted SOURCE archive.
# No extra tokens/permission grants, no Cloudflare API, D1 INSERT, Worker/Cron, paid tier.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/s2-g3-independent-protected-restore-and-archive-once-20261012.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: system2-g3-independent-original-sql-single-use-20261012
  cancel-in-progress: false
jobs:
  g3_independent:
    runs-on: ubuntu-latest
    environment: system2-schema-only
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Independent verifier syntax, negative gates, source and V8 isolation
        run: |
          set -euo pipefail
          node --check system2/migration/g3_independent_protected_decrypt_and_restore_20261012.mjs
          python3 -m py_compile system2/migration/g3_independent_sqlite_restore_and_pit_witness_20261012.py
          node system2/tests/g3_independent_restore_pit_frozen_fail_closed_20261012.test.mjs
          git diff --exit-code -- Worker.js wrangler.toml
      - name: Download EXISTING DEST sealed key+public bundle (do not create key)
        uses: actions/download-artifact@v4
        with:
          name: s2-dest-protected-rsa-public-sealed-private-38151167952
          run-id: 38151167952
          github-token: ${{ github.token }}
          repository: imihan0630-sys/v7-fugle-worker
          path: /tmp/g3-independent-input/key
      - name: Download EXISTING RSA wrapped source SQL encrypted transit (no source API)
        uses: actions/download-artifact@v4
        with:
          name: s2-source-sql-rsa-wrapped-gcm-transfer-38151167952
          run-id: 38151167952
          github-token: ${{ github.token }}
          repository: imihan0630-sys/v7-fugle-worker
          path: /tmp/g3-independent-input/source
      - name: Independently decrypt original 316MB SQL and RESTORE fresh SQLite, PIT/Frozen census
        env:
          S2_SCHEMA_DEST_ACCOUNT_ID: ${{ secrets.S2_SCHEMA_DEST_ACCOUNT_ID }}
          S2_SCHEMA_DEST_D1_WRITE_TOKEN: ${{ secrets.S2_SCHEMA_DEST_D1_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          node system2/migration/g3_independent_protected_decrypt_and_restore_20261012.mjs
      - name: Upload independent SANITIZED G3 original SQL content-root/row/clock witness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s2-g3-independent-restore-sanitized-${{ github.run_id }}
          path: |
            /tmp/g3-independent-audit/sanitized-independent-restore-receipt.json
            /tmp/g3-independent-audit/sanitized-independent-sqlite-content-roots.json
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve exact original existing AES/RSA encrypted bytes under existing credential
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: s2-existing-rsa-source-transfer-encrypted-extended-${{ github.run_id }}
          path: |
            /tmp/g3-independent-input/key/destination-public.pem
            /tmp/g3-independent-input/key/destination-private-key-sealed.json
            /tmp/g3-independent-input/source/source-sql-rewrapped-for-destination.gz.gcm
            /tmp/g3-independent-input/source/rsa-wrapped-transfer-meta.json
          if-no-files-found: error
          retention-days: 90
      - name: Explicit fail closed boundaries
        if: always()
        run: |
          echo 'Original ciphertext only is copied for extended temporary retention, STILL NOT permanent independent escrow.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Independent AES/RSA decrypt and SQLite restore; no PIT external provider clock or remote Frozen accepted.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No D1 target INSERT, source export, Cloudflare API, V8, Worker, Cron, billing, new Secret or permission.' >> "$GITHUB_STEP_SUMMARY"
