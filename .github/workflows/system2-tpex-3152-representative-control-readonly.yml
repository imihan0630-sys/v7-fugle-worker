name: System2 TPEx 3152 Representative Revision Control Readonly

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "system2/runtime/mops_revision_control_matrix_v0_3.mjs"
      - "system2/runtime/revision_authority_provenance_matrix_v0_2.mjs"
      - "system2/tests/mops_revision_control_matrix_v0_3.test.mjs"
      - "system2/tests/revision_authority_provenance_matrix_v0_2.test.mjs"
      - "system2/scripts/probe_tpex_3152_representative_control_readonly_v0_1.mjs"
      - "system2/SYSTEM2_MOPS_REVISION_CONTROL_MATRIX_V0_3.md"
      - "system2/SYSTEM2_REVISION_AUTHORITY_PROVENANCE_MATRIX_V0_2.md"
      - ".github/workflows/system2-tpex-3152-representative-control-readonly.yml"
  push:
    branches: [main]
    paths:
      - "system2/runtime/mops_revision_control_matrix_v0_3.mjs"
      - "system2/runtime/revision_authority_provenance_matrix_v0_2.mjs"
      - "system2/tests/mops_revision_control_matrix_v0_3.test.mjs"
      - "system2/tests/revision_authority_provenance_matrix_v0_2.test.mjs"
      - "system2/scripts/probe_tpex_3152_representative_control_readonly_v0_1.mjs"
      - "system2/SYSTEM2_MOPS_REVISION_CONTROL_MATRIX_V0_3.md"
      - "system2/SYSTEM2_REVISION_AUTHORITY_PROVENANCE_MATRIX_V0_2.md"
      - ".github/workflows/system2-tpex-3152-representative-control-readonly.yml"

permissions:
  contents: read

concurrency:
  group: system2-tpex-3152-representative-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run MOPS V0.3 tests
        run: node system2/tests/mops_revision_control_matrix_v0_3.test.mjs

      - name: Run authority V0.2 tests
        run: node system2/tests/revision_authority_provenance_matrix_v0_2.test.mjs

      - name: Physically verify 3152 TPEx representative control
        run: node system2/scripts/probe_tpex_3152_representative_control_readonly_v0_1.mjs

      - name: Confirm read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -qE 'CLOUDFLARE|SYSTEM2_DB|wrangler|secret|deploy|INSERT|UPDATE|DELETE' system2/scripts/probe_tpex_3152_representative_control_readonly_v0_1.mjs
          echo "Read-only TPEx 3152 representative control boundary PASS"
