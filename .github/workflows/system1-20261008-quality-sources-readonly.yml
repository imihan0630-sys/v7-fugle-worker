name: System1 20261008 Quality Sources Readonly

on:
  pull_request:
    paths:
      - "tests/system1_20261008_quality_sources_readonly.mjs"
      - ".github/workflows/system1-20261008-quality-sources-readonly.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate public GET-only source probe syntax
        run: node --check tests/system1_20261008_quality_sources_readonly.mjs
      - name: Verify public 10/8 quality sources independently of Worker and D1
        run: node tests/system1_20261008_quality_sources_readonly.mjs
      - name: Preserve sanitized source-only receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system1-20261008-quality-sources-${{ github.run_id }}
          path: artifacts/system1-20261008-quality-source-readonly.json
          retention-days: 30
          if-no-files-found: error
