name: System2 PIT-A 2330 Six CA Native Originals 20261016 (READ ONLY)

on:
  pull_request:
    branches: [main]
    paths:
      - "system2/scripts/capture_pita_2330_six_ca_originals_20261016_v0_1.mjs"
      - "system2/tests/capture_pita_2330_six_ca_originals_20261016_v0_1.test.mjs"
      - ".github/workflows/system2-pita-2330-six-ca-native-originals-20261016.yml"
  push:
    branches: [main]
    paths:
      - "system2/scripts/capture_pita_2330_six_ca_originals_20261016_v0_1.mjs"
      - "system2/tests/capture_pita_2330_six_ca_originals_20261016_v0_1.test.mjs"
      - ".github/workflows/system2-pita-2330-six-ca-native-originals-20261016.yml"

permissions:
  contents: read

concurrency:
  group: s2-pita-2330-six-ca-source-only-20261016-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preserve_six_official_ca_originals:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify six-family identity, real clock, original SHA and NO_EVENT negatives
        run: |
          set -euo pipefail
          node --check system2/scripts/capture_pita_2330_six_ca_originals_20261016_v0_1.mjs
          node --test system2/tests/capture_pita_2330_six_ca_originals_20261016_v0_1.test.mjs
          git diff --exit-code -- Worker.js wrangler.toml
      - name: One bounded six-source real official GET by 10-16 prospective cut
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          test "$(TZ=Asia/Taipei date +%F)" = "2026-10-16"
          node system2/scripts/capture_pita_2330_six_ca_originals_20261016_v0_1.mjs
          R=/tmp/s2-pita-2330-ca-six-20261016/pita-ca-sourceonly-receipt.json
          test -s "$R"
          test "$(jq -r .actualSourceFamilyDenominator "$R")" = '6'
          test "$(jq -r .directIssuerVersionAndAmendmentCompletenessCertified "$R")" = 'false'
          test "$(jq -r .authoritativeNegativeNoEventScopeCertified "$R")" = 'false'
          test "$(jq -r .historicalCfiEffectivePITCertified "$R")" = 'false'
          test "$(jq -r .independentAuditLaneCompletePitCertified "$R")" = 'false'
          test "$(jq -r .pitEligible "$R")" = 'false'
          test "$(jq -r .selectedCount "$R")" = 'null'
          test "$(jq -r .zeroPickDay "$R")" = 'null'
          test "$(jq -r .frozenD1Written "$R")" = 'false'
          test "$(jq -r .cloudflareD1Writes "$R")" = '0'
          echo "PITA_2330_SOURCE_CA_ORIGINALS=$(jq -r .observedSourceFamilies "$R")/6; CA_REVISION_NO_EVENT_PIT=UNKNOWN; CFI_HISTORICAL_PIT=UNKNOWN; FROZEN=0" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve all actual original gzip CA bodies with signed source receipt
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: s2-pita-2330-six-ca-original-20261016-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/s2-pita-2330-ca-six-20261016/
          retention-days: 90
          if-no-files-found: warn
      - name: No strategy / NO_EVENT / issuer-vintage / Frozen promotion
        if: always()
        run: |
          echo 'Six source originals are time-true transport only. Prior CA corrections, retractions, halts, publisher version history and complete NO_EVENT negative scope NOT CERTIFIED. No System1 or Cloudflare writes.' >> "$GITHUB_STEP_SUMMARY"
