name: System2 Private A1 Archive ONE-SHOT 20261013

# Owner-approved one-time initial private archival publication from frozen source Run 38351651871.
# Trigger once on this workflow file's exact initial push to main; delete after independent readback.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/system2-shared-official-a1-private-archive-once-20261013.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: system2-shared-official-a1-private-archive
  cancel-in-progress: false

jobs:
  archive:
    if: github.repository == 'imihan0630-sys/v7-fugle-worker' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve exact previously verified partial source run (121/122, never PIT-authorized)
        id: source
        run: |
          set -euo pipefail
          echo 'run_id=38351651871' >> "$GITHUB_OUTPUT"
          echo 'artifact_name=s2-shared-official-a1-38351651871' >> "$GITHUB_OUTPUT"
      - name: Download exact source artifact from successful run
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.source.outputs.run_id }}
          name: ${{ steps.source.outputs.artifact_name }}
          path: /tmp/shared-a1-source
          github-token: ${{ github.token }}
      - name: Verify publisher, source semantics, private-only scope and no production coupling
        run: |
          set -euo pipefail
          node --check system2/scripts/publish_shared_official_a1_private_archive_v0_1.mjs
          node --test system2/tests/shared_official_a1_private_archive_v0_1.test.mjs
          git diff --exit-code -- Worker.js wrangler.toml
      - name: Configure target-repository-only deploy key
        env:
          ARCHIVE_DEPLOY_KEY: ${{ secrets.S2_A1_ARCHIVE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test -n "$ARCHIVE_DEPLOY_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ARCHIVE_DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          curl --fail --silent --show-error https://api.github.com/meta |
            jq -r '.ssh_keys[] | "github.com " + .' > "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"
      - name: Prove target is non-public (anonymous 404 plus authenticated SSH clone)
        run: |
          set -euo pipefail
          RESULT="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://api.github.com/repos/imihan0630-sys/v7-system2-official-a1-archive)"
          test "$RESULT" = '404'
      - name: Clone only the approved private archive
        run: |
          set -euo pipefail
          git clone --depth 1 git@github.com:imihan0630-sys/v7-system2-official-a1-archive.git /tmp/private-a1-archive
          test "$(git -C /tmp/private-a1-archive remote get-url origin)" = "git@github.com:imihan0630-sys/v7-system2-official-a1-archive.git"
      - name: Prepare content-addressed create-only archive commit
        env:
          SHARED_A1_MANIFEST_PATH: /tmp/shared-a1-source/shared-official-a1-manifest.json
          SHARED_A1_ORIGINAL_DIR: /tmp/shared-a1-source/original-json
          SHARED_A1_ARCHIVE_DIR: /tmp/private-a1-archive
          SHARED_A1_ARCHIVE_AUTHORIZATION_PATH: system2/config/shared_official_a1_private_archive_authorization_v0_1.json
        run: |
          set -euo pipefail
          RECEIPT="$(find /tmp/shared-a1-source -maxdepth 1 -name 'official-61-*.json' -type f -print -quit)"
          test -n "$RECEIPT"
          export SHARED_A1_SOURCE_RECEIPT_PATH="$RECEIPT"
          node system2/scripts/publish_shared_official_a1_private_archive_v0_1.mjs
      - name: Commit and push only verified archive paths
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          set -euo pipefail
          cd /tmp/private-a1-archive
          git config user.name system2-a1-archive-writer
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- raw manifests source-receipts archive-receipts SOURCE_NOTICE.md
          if git diff --cached --quiet; then
            echo 'No new content-addressed source files.' >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "archive: shared official A1 source run $SOURCE_RUN_ID"
            git push origin HEAD:main
          fi
      - name: Independently clone published private main and verify all original bytes and archive identity
        env:
          SHARED_A1_MANIFEST_PATH: /tmp/shared-a1-source/shared-official-a1-manifest.json
          SHARED_A1_ORIGINAL_DIR: /tmp/shared-a1-source/original-json
          SHARED_A1_ARCHIVE_AUTHORIZATION_PATH: system2/config/shared_official_a1_private_archive_authorization_v0_1.json
          SHARED_A1_ARCHIVE_DIR: /tmp/private-a1-independent-readback
          SHARED_A1_ARCHIVE_RECEIPT_DIR: /tmp/shared-a1-private-independent-readback
        run: |
          set -euo pipefail
          git clone --depth 1 git@github.com:imihan0630-sys/v7-system2-official-a1-archive.git "$SHARED_A1_ARCHIVE_DIR"
          RECEIPT="$(find /tmp/shared-a1-source -maxdepth 1 -name 'official-61-*.json' -type f -print -quit)"
          test -n "$RECEIPT"
          export SHARED_A1_SOURCE_RECEIPT_PATH="$RECEIPT"
          node system2/scripts/publish_shared_official_a1_private_archive_v0_1.mjs
          FIRST='/tmp/shared-a1-private-archive-publish/archive-publish-receipt.json'
          SECOND="$SHARED_A1_ARCHIVE_RECEIPT_DIR/archive-publish-receipt.json"
          test -s "$FIRST" && test -s "$SECOND"
          test "$(jq -r .archiveReceiptHash "$FIRST")" = "$(jq -r .archiveReceiptHash "$SECOND")"
          test "$(jq -r .sourceMarketDatePairs "$SECOND")" = '121'
          test "$(jq -r .newFiles "$SECOND")" = '0'
          test "$(jq -r .verifiedExistingFiles "$SECOND")" = '124'
          echo 'PRIVATE_ARCHIVE_121_SOURCE_FILES_INDEPENDENT_READBACK_PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve non-secret archive receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-a1-private-archive-receipt-${{ github.run_id }}
          path: |
            /tmp/shared-a1-private-archive-publish/archive-publish-receipt.json
            /tmp/shared-a1-private-independent-readback/archive-publish-receipt.json
          if-no-files-found: warn
          retention-days: 90
      - name: Safety declaration
        if: always()
        run: |
          rm -f "$HOME/.ssh/id_ed25519"
          echo 'Target: dedicated private content-addressed Git archive only.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No public raw publication, paid plan, D1/R2, System1 Formal/runtime, selection, Frozen, push or orders.' >> "$GITHUB_STEP_SUMMARY"
