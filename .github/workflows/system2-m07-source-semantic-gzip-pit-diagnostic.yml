name: S2 M07 SOURCE semantic original R2 gzip structure and PIT diagnostic READONLY
# Existing G3 private unmatched artifact, 27 expected SOURCE LIST pages,
# exactly ONE prior-proven 10,556-byte semantic body HEAD+GET, no mutation.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/system2-m07-source-semantic-gzip-pit-diagnostic.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: s2-m07-source-original-semantic-schema-pit-one-shot
  cancel-in-progress: false
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: system2-research
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Validate gzipped schema, PIT unknown, caps and adversarial forged receipts
        run: |
          set -euo pipefail
          node --check system2/migration/issue1236_m07_source_semantic_gzip_schema_pit_diagnostic_v0_1.mjs
          node system2/tests/issue1236_m07_source_semantic_gzip_schema_pit_v0_1.test.mjs
      - name: Reuse ORIGINAL G3 protected 498 R2 key-hash identities
        uses: actions/download-artifact@v4
        with:
          name: s2-m07-private-498-extra-keyhashes-38527825185-1
          run-id: 38527825185
          github-token: ${{ github.token }}
          repository: imihan0630-sys/v7-fugle-worker
          path: /tmp/s2-m07-original-private-498
      - name: Original SOURCE semantic R2 HEAD GET byte SHA gzip PIT structural diagnostic
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_R2_ACCESS_KEY_ID: ${{ secrets.SYSTEM2_R2_ACCESS_KEY_ID }}
          SYSTEM2_R2_SECRET_ACCESS_KEY: ${{ secrets.SYSTEM2_R2_SECRET_ACCESS_KEY }}
          SYSTEM2_R2_BUCKET: ${{ vars.SYSTEM2_R2_BUCKET }}
        run: node system2/migration/issue1236_m07_source_semantic_gzip_schema_pit_diagnostic_v0_1.mjs
      - name: Archive only sanitized structural fields, no securities or keys
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s2-m07-source-original-semantic-gzip-pit-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/s2-m07-semantic-body-schema/sanitized-original-semantic-body-structure.json
          if-no-files-found: warn
          retention-days: 90
