name: System2 Bounded Revision Event Bundle V0.3 Readonly

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "system2/runtime/bounded_revision_event_bundle_v0_3.mjs"
      - "system2/tests/bounded_revision_event_bundle_v0_3.test.mjs"
      - "system2/scripts/probe_bounded_revision_event_bundle_low_volume_readonly_v0_3.mjs"
      - "system2/SYSTEM2_BOUNDED_REVISION_EVENT_BUNDLE_V0_3.md"
      - ".github/workflows/system2-bounded-revision-event-bundle-v0-3-readonly.yml"
  push:
    branches: [main]
    paths:
      - "system2/runtime/bounded_revision_event_bundle_v0_3.mjs"
      - "system2/tests/bounded_revision_event_bundle_v0_3.test.mjs"
      - "system2/scripts/probe_bounded_revision_event_bundle_low_volume_readonly_v0_3.mjs"
      - "system2/SYSTEM2_BOUNDED_REVISION_EVENT_BUNDLE_V0_3.md"
      - ".github/workflows/system2-bounded-revision-event-bundle-v0-3-readonly.yml"

permissions:
  contents: read

concurrency:
  group: system2-bounded-revision-event-bundle-v0-3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run V0.3 tests
        run: node system2/tests/bounded_revision_event_bundle_v0_3.test.mjs
      - name: Run physical low-volume event-bundle probe
        run: node system2/scripts/probe_bounded_revision_event_bundle_low_volume_readonly_v0_3.mjs
      - name: Confirm read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -qE 'CLOUDFLARE|SYSTEM2_DB|wrangler|secret|deploy|INSERT|UPDATE|DELETE' system2/scripts/probe_bounded_revision_event_bundle_low_volume_readonly_v0_3.mjs
          echo "Read-only bounded revision event-bundle boundary PASS"
