name: System2 MOPSOV Multi Control Reconciliation Readonly

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "system2/runtime/mops_revision_control_matrix_v0_2.mjs"
      - "system2/runtime/mops_revision_source_capability_v0_1.mjs"
      - "system2/scripts/probe_mopsov_multi_control_month_shard_reconciliation_readonly_v0_1.mjs"
      - "system2/SYSTEM2_MOPSOV_MULTI_CONTROL_MONTH_SHARD_RECONCILIATION_V0_1.md"
      - ".github/workflows/system2-mopsov-multi-control-reconciliation-readonly.yml"
  push:
    branches: [main]
    paths:
      - "system2/runtime/mops_revision_control_matrix_v0_2.mjs"
      - "system2/runtime/mops_revision_source_capability_v0_1.mjs"
      - "system2/scripts/probe_mopsov_multi_control_month_shard_reconciliation_readonly_v0_1.mjs"
      - "system2/SYSTEM2_MOPSOV_MULTI_CONTROL_MONTH_SHARD_RECONCILIATION_V0_1.md"
      - ".github/workflows/system2-mopsov-multi-control-reconciliation-readonly.yml"

permissions:
  contents: read

concurrency:
  group: system2-mopsov-multi-control-reconciliation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Probe multi-control MOPSOV full query versus month shards
        run: node system2/scripts/probe_mopsov_multi_control_month_shard_reconciliation_readonly_v0_1.mjs

      - name: Confirm read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -qE 'CLOUDFLARE|SYSTEM2_DB|wrangler|secret|deploy|INSERT|UPDATE|DELETE' system2/scripts/probe_mopsov_multi_control_month_shard_reconciliation_readonly_v0_1.mjs
          echo "Read-only MOPSOV multi-control reconciliation boundary PASS"
