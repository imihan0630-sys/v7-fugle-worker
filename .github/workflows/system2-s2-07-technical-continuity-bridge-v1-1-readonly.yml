name: System2 S2-07 Technical Continuity Bridge V1.1 Readonly

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "system2/runtime/s2_07_technical_continuity_bridge_v1_1.mjs"
      - "system2/tests/s2_07_technical_continuity_bridge_v1_1.test.mjs"
      - "system2/scripts/probe_s2_07_technical_continuity_bridge_readonly_v1_1.mjs"
      - "system2/SYSTEM2_S2_07_TECHNICAL_CONTINUITY_BRIDGE_V1_1.md"
      - "system2/evidence/S2_07_RAW_A1_LINEAGE_V1_0_PHYSICAL_20261007.json"
      - ".github/workflows/system2-s2-07-technical-continuity-bridge-v1-1-readonly.yml"
  push:
    branches: [main]
    paths:
      - "system2/runtime/s2_07_technical_continuity_bridge_v1_1.mjs"
      - "system2/tests/s2_07_technical_continuity_bridge_v1_1.test.mjs"
      - "system2/scripts/probe_s2_07_technical_continuity_bridge_readonly_v1_1.mjs"
      - "system2/SYSTEM2_S2_07_TECHNICAL_CONTINUITY_BRIDGE_V1_1.md"
      - "system2/evidence/S2_07_RAW_A1_LINEAGE_V1_0_PHYSICAL_20261007.json"
      - ".github/workflows/system2-s2-07-technical-continuity-bridge-v1-1-readonly.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Targeted 4806 technical continuity bridge tests
        run: node system2/tests/s2_07_technical_continuity_bridge_v1_1.test.mjs
      - name: Read-only physical 4806 continuity bridge probe
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$SYSTEM2_CLOUDFLARE_API_TOKEN"
          node system2/scripts/probe_s2_07_technical_continuity_bridge_readonly_v1_1.mjs
      - name: Read-only and System1 isolation guard
        shell: bash
        run: |
          set -euo pipefail
          ! grep -qE '\b(INSERT|UPDATE|DELETE|REPLACE|DROP|ALTER|CREATE)\b' system2/scripts/probe_s2_07_technical_continuity_bridge_readonly_v1_1.mjs
          ! grep -qE 'wrangler|secret put|deploy' system2/scripts/probe_s2_07_technical_continuity_bridge_readonly_v1_1.mjs
          git diff --exit-code -- Worker.js wrangler.toml
          echo "S2-07 technical continuity bridge V1.1 read-only/System1 isolation PASS"
