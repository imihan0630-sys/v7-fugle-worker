name: D08 TWSE Valuation Year Backfill

on:
  push:
    branches:
      - "research/d08-valuation-history-yearly-v0-1"
    paths:
      - "research/d08_twse_daily_valuation_backfill_request_v0_1.json"
  workflow_dispatch:
    inputs:
      year:
        description: "Single year 2017..2026; blank means matrix"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: d08-twse-valuation-year-backfill-${{ github.ref }}-${{ inputs.year || 'matrix' }}
  cancel-in-progress: false

jobs:
  backfill:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        year: [2017,2018,2019,2020,2021,2022,2023,2024,2025,2026]
    if: ${{ inputs.year == '' || inputs.year == null || inputs.year == format('{0}', matrix.year) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: system2-research
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Guard research-only yearly valuation backfill
        run: |
          set -euo pipefail
          node system2/tests/d08_historical_valuation_year_pack.test.mjs
          node system2/tests/d08_valuation_year_backfill_guard.test.mjs
          node --check system2/scripts/d08_twse_valuation_year_backfill_v0_1.mjs
          git diff --exit-code -- Worker.js wrangler.toml
      - name: Capture one TWSE valuation history year to isolated R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_R2_ACCESS_KEY_ID: ${{ secrets.SYSTEM2_R2_ACCESS_KEY_ID }}
          SYSTEM2_R2_SECRET_ACCESS_KEY: ${{ secrets.SYSTEM2_R2_SECRET_ACCESS_KEY }}
          SYSTEM2_R2_BUCKET: ${{ vars.SYSTEM2_R2_BUCKET }}
          D08_VALUATION_HISTORY_YEAR: ${{ matrix.year }}
        run: |
          set -euo pipefail
          node system2/scripts/d08_twse_valuation_year_backfill_v0_1.mjs | tee /tmp/d08-valuation-year-${D08_VALUATION_HISTORY_YEAR}.jsonl
      - name: Production isolation guard
        run: |
          set -euo pipefail
          git diff --exit-code -- Worker.js wrangler.toml
          echo "D08 yearly valuation backfill isolation PASS"
