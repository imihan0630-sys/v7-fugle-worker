name: System2 MOPS U04 Announcement Detail Capability Readonly

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "system2/scripts/probe_mops_u04_announcement_detail_capability_readonly_v0_1.mjs"
      - "system2/SYSTEM2_MOPS_U04_ANNOUNCEMENT_DETAIL_CAPABILITY_V0_1.md"
      - ".github/workflows/system2-mops-u04-announcement-detail-capability-readonly.yml"
  push:
    branches: [main]
    paths:
      - "system2/scripts/probe_mops_u04_announcement_detail_capability_readonly_v0_1.mjs"
      - "system2/SYSTEM2_MOPS_U04_ANNOUNCEMENT_DETAIL_CAPABILITY_V0_1.md"
      - ".github/workflows/system2-mops-u04-announcement-detail-capability-readonly.yml"

permissions:
  contents: read

concurrency:
  group: system2-mops-u04-detail-capability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe official MOPS U04 detail endpoint
        run: node system2/scripts/probe_mops_u04_announcement_detail_capability_readonly_v0_1.mjs
      - name: Confirm read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -qE 'CLOUDFLARE|SYSTEM2_DB|wrangler|secret|deploy|INSERT|UPDATE|DELETE' system2/scripts/probe_mops_u04_announcement_detail_capability_readonly_v0_1.mjs
          echo "MOPS U04 detail capability read-only boundary PASS"
