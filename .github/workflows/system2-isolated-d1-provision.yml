name: System2 Isolated D1 Provision

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type CREATE_SYSTEM2_ISOLATED_D1 to create/reuse the isolated System2 D1 and apply schema"
        required: true
        type: string
      quota_reservation_rows:
        description: "Evidence-based conservative D1 rowsWritten reservation for genuine schema mutation"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: system2-isolated-d1-writer
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: system2-research
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Guard explicit confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          test "$CONFIRM" = "CREATE_SYSTEM2_ISOLATED_D1"

      - name: Reserve shared account D1 budget
        id: quota
        uses: ./.github/actions/system2-d1-budget-gate
        with:
          writer_id: ISOLATED_D1_PROVISION
          requested_rows_written: ${{ inputs.quota_reservation_rows }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Create or reuse isolated System2 D1, apply schema and verify write/read
        if: steps.quota.outputs.physical_allowed == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
          SYSTEM2_CONFIRM: ${{ inputs.confirm }}
        run: node system2/deploy/provision_system2_d1.mjs

      - name: Reconcile shared account D1 budget result
        if: steps.quota.outputs.physical_allowed == 'true' && success()
        uses: ./.github/actions/system2-d1-budget-gate
        with:
          writer_id: ISOLATED_D1_PROVISION
          mode: result
          reservation_receipt_path: ${{ steps.quota.outputs.reservation_receipt_path }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Preserve quota evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system2-d1-provision-quota-${{ github.run_id }}
          path: |
            /tmp/system2-d1-budget-reservation.json
            /tmp/system2-d1-budget-result.json
          if-no-files-found: warn
          retention-days: 30

      - name: Confirm production configuration was not edited
        run: |
          set -euo pipefail
          test "$(sed -n '1p' wrangler.toml)" = 'name = "fugle-test"'
          git diff --exit-code -- wrangler.toml Worker.js
          echo "Production configuration isolation PASS"
