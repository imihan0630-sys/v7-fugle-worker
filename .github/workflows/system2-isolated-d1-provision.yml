name: System2 Isolated D1 Provision

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type CREATE_SYSTEM2_ISOLATED_D1 to create/reuse the isolated System2 D1 and apply schema"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: system2-isolated-d1-writer
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: system2-research
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Guard explicit confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          test "$CONFIRM" = "CREATE_SYSTEM2_ISOLATED_D1"

      - name: Create or reuse isolated System2 D1, apply schema and verify write/read
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
          SYSTEM2_CONFIRM: ${{ inputs.confirm }}
        run: node system2/deploy/provision_system2_d1.mjs

      - name: Confirm production configuration was not edited
        run: |
          set -euo pipefail
          test "$(sed -n '1p' wrangler.toml)" = 'name = "fugle-test"'
          git diff --exit-code -- wrangler.toml Worker.js
          echo "Production configuration isolation PASS"
