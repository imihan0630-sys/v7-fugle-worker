name: D02 PVE285 External Dependency Requests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/d02_pve285_external_dependency_request_v0_1.json"
      - "research/d02_pve285_external_dependency_request_guard_v0_1.mjs"
      - "tests/test_d02_pve285_external_dependency_request_guard_v0_1.mjs"
      - ".github/workflows/d02-pve285-external-dependency-requests.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/test_d02_pve285_external_dependency_request_guard_v0_1.mjs
