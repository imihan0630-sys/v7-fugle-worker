name: D02 PVE275 Wave1 Anti-Bypass Firewall

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/d02_pve275_wave1_anti_bypass_firewall_v0_1.mjs"
      - "tests/test_d02_pve275_wave1_anti_bypass_firewall_v0_1.mjs"
      - ".github/workflows/d02-pve275-wave1-anti-bypass-firewall.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/test_d02_pve275_wave1_anti_bypass_firewall_v0_1.mjs
