name: System2 AUDIT Recent60 Hot D1 PIT Evidence Integrity
on:
  pull_request:
    paths:
      - "system2/tests/audit_recent60_hot_d1_pit_evidence_gate_v0_1.test.mjs"
      - "system2/evidence/S2_RECENT60_20261008_FULL_GAP_ARTIFACT_READBACK_20261009_V0_1.json"
      - "system2/evidence/S2_RECENT60_20261008_HOT_D1_VS_PIT_PHYSICAL_SAMPLE_V0_1.json"
      - ".github/workflows/system2-audit-recent60-evidence-gate-v0-1.yml"
  push:
    branches: [main]
    paths:
      - "system2/tests/audit_recent60_hot_d1_pit_evidence_gate_v0_1.test.mjs"
      - "system2/evidence/S2_RECENT60_20261008_FULL_GAP_ARTIFACT_READBACK_20261009_V0_1.json"
      - "system2/evidence/S2_RECENT60_20261008_HOT_D1_VS_PIT_PHYSICAL_SAMPLE_V0_1.json"
      - ".github/workflows/system2-audit-recent60-evidence-gate-v0-1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Independently reconcile PIT gaps, physical sample and provenance
        run: node system2/tests/audit_recent60_hot_d1_pit_evidence_gate_v0_1.test.mjs
