name: D02 PVE279 D16 Wave2 Admission Binding

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/d02_pve279_d16_wave2_admission_binding_v0_1.mjs"
      - "tests/test_d02_pve279_d16_wave2_admission_binding_v0_1.mjs"
      - ".github/workflows/d02-pve279-d16-wave2-admission-binding.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/test_d02_pve279_d16_wave2_admission_binding_v0_1.mjs
