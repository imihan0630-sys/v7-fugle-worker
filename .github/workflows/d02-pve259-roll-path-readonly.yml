name: D02 PVE259 Roll Path Readonly

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/d02_pve259_roll_path_readonly_v0_1.mjs"
      - ".github/workflows/d02-pve259-roll-path-readonly.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read prior-session PV roll path without outcomes or mutation
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node research/d02_pve259_roll_path_readonly_v0_1.mjs
      - name: Preserve sanitized PVE-259 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d02-pve259-roll-path-readonly-${{ github.run_id }}
          path: artifacts/d02-pve259-roll-path-readonly.json
          if-no-files-found: warn
          retention-days: 30
