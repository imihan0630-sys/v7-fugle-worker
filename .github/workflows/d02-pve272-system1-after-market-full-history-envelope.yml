name: D02 PVE272 System1 Full-History After-Market Envelope

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/d02_pve272_system1_after_market_full_history_envelope_v0_1.mjs"
      - ".github/workflows/d02-pve272-system1-after-market-full-history-envelope.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read all healthy System1 after-market days
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
        run: node research/d02_pve272_system1_after_market_full_history_envelope_v0_1.mjs
      - name: Preserve PVE-272 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d02-pve272-system1-after-market-full-history-envelope-${{ github.run_id }}
          path: artifacts/d02-pve272-system1-after-market-full-history-envelope.json
          if-no-files-found: warn
          retention-days: 30
