name: V7 Repair CI

on:
  pull_request:
    branches: [main]
    paths:
      - "Worker.js"
      - "scripts/apply_v7_5_27.py"
      - "scripts/apply_v7_5_30.py"
      - "tests/**"
      - ".github/workflows/v7-cloudflare.yml"
      - ".github/workflows/v7-repair-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply guarded V7.5.29 repair
        run: python3 scripts/apply_v7_5_27.py

      - name: Apply V7.5.30 market consensus radar
        run: python3 scripts/apply_v7_5_30.py

      - name: Syntax check Worker.js
        run: |
          cp Worker.js /tmp/Worker.mjs
          node --check /tmp/Worker.mjs

      - name: Behavioral regression
        env:
          V7_TEST_WORKER_PATH: ${{ github.workspace }}/Worker.js
        run: node tests/test_requirements_repair.mjs

      - name: Verify expected version
        run: grep -F 'const VERSION = "7.5.30-market-consensus-radar";' Worker.js
