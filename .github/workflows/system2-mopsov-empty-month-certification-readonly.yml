name: System2 MOPSOV Empty Month Certification Readonly

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "system2/runtime/mopsov_empty_month_certification_v0_2.mjs"
      - "system2/tests/mopsov_empty_month_certification_v0_2.test.mjs"
      - "system2/scripts/probe_mopsov_empty_month_certification_readonly_v0_2.mjs"
      - "system2/SYSTEM2_MOPSOV_EMPTY_MONTH_CERTIFICATION_V0_2.md"
      - ".github/workflows/system2-mopsov-empty-month-certification-readonly.yml"
  push:
    branches: [main]
    paths:
      - "system2/runtime/mopsov_empty_month_certification_v0_2.mjs"
      - "system2/tests/mopsov_empty_month_certification_v0_2.test.mjs"
      - "system2/scripts/probe_mopsov_empty_month_certification_readonly_v0_2.mjs"
      - "system2/SYSTEM2_MOPSOV_EMPTY_MONTH_CERTIFICATION_V0_2.md"
      - ".github/workflows/system2-mopsov-empty-month-certification-readonly.yml"

permissions:
  contents: read

concurrency:
  group: system2-mopsov-empty-month-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run fail-closed certification tests
        run: node system2/tests/mopsov_empty_month_certification_v0_2.test.mjs

      - name: Physically certify MOPSOV empty-month semantics
        run: node system2/scripts/probe_mopsov_empty_month_certification_readonly_v0_2.mjs

      - name: Confirm read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -qE 'CLOUDFLARE|SYSTEM2_DB|wrangler|secret|deploy|INSERT|UPDATE|DELETE' system2/scripts/probe_mopsov_empty_month_certification_readonly_v0_2.mjs
          echo "Read-only MOPSOV empty-month certification boundary PASS"
