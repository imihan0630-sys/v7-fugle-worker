name: Target RR Capture Guard Research

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "tests/test_target_rr_audit_observer_v0_1.mjs"
      - "research/target_rr_scarcity_capture_matrix_v0_1.json"
      - "TARGET_RESISTANCE_RR_RESEARCH.md"
      - ".github/workflows/target-rr-capture-guard-research.yml"

permissions:
  contents: read

jobs:
  falsification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run canonical target RR observer tests
        run: node tests/test_target_rr_audit_observer_v0_1.mjs
      - name: Verify research-only capture matrix
        run: |
          grep -F '"formalCoreChanged": false' research/target_rr_scarcity_capture_matrix_v0_1.json
          grep -F '"outcomeDataUsed": false' research/target_rr_scarcity_capture_matrix_v0_1.json
          grep -F '"formalDecisionImpact": false' research/target_rr_scarcity_capture_matrix_v0_1.json
          grep -F 'TARGET_NULL_LOW_RR_FINAL_GRADE_SEPARABLE_PRE_OUTCOME' research/target_rr_scarcity_capture_matrix_v0_1.json
