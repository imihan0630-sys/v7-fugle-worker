name: System2 Historical Inventory Readonly

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "system2/scripts/audit_historical_inventory_readonly_v0_1.mjs"
      - "system2/tests/historical_inventory_readonly_workflow_guard.test.mjs"
      - ".github/workflows/system2-historical-inventory-readonly.yml"

permissions:
  contents: read

concurrency:
  group: system2-historical-inventory-readonly
  cancel-in-progress: true

jobs:
  inventory:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: system2-research
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Guard read-only boundary
        run: |
          set -euo pipefail
          node system2/tests/historical_inventory_readonly_workflow_guard.test.mjs
          node --check system2/scripts/audit_historical_inventory_readonly_v0_1.mjs
          git diff --exit-code -- Worker.js wrangler.toml

      - name: Read isolated historical inventory
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$SYSTEM2_CLOUDFLARE_API_TOKEN"
          node system2/scripts/audit_historical_inventory_readonly_v0_1.mjs | tee /tmp/system2-historical-inventory.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const r=JSON.parse(fs.readFileSync("/tmp/system2-historical-inventory.json","utf8"));
          if(r.result!=="PASS"||r.databaseName!=="system2-research"||r.d1SchemaVersion!=="1.1")throw new Error("inventory/database mismatch");
          if(r.mutationPerformed!==false||r.system1RuntimeUsed!==false||r.d1Metrics.rowsWritten!==0)throw new Error("read-only boundary violated");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            "System2 historical inventory PASS\n\n"+
            "Bars: "+JSON.stringify(r.historicalBarsByMarket)+"\n\n"+
            "Universe: "+JSON.stringify(r.historicalUniverse)+"\n\n"+
            "Cold control plane: "+JSON.stringify(r.externalColdStoreControlPlane)+"\n");
          NODE

      - name: Preserve inventory receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system2-historical-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/system2-historical-inventory.json
          if-no-files-found: warn
          retention-days: 90
