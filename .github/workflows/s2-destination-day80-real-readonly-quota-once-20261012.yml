name: S2 D1 Destination 80k Budget Real READ-ONLY Preflight ONCE 20261012
# Isolated one-shot real dest account GET / D1 SELECT / query-only GraphQL.
# Absolutely no imported data, DDL, source D1, production, R2, Secrets or subscription mutations.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/s2-destination-day80-real-readonly-quota-once-20261012.yml
permissions:
  contents: read
concurrency:
  group: s2-target-d1-day80-physical-readonly-preflight-once-20261012
  cancel-in-progress: false
jobs:
  read_only_budget_preflight:
    runs-on: ubuntu-latest
    environment: system2-schema-only
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Validate syntax and source-only immutable row inventory
        run: |
          set -euo pipefail
          node --check system2/migration/destination_day80_readonly_cloudflare_preflight_20261012.mjs
          node system2/tests/source_d1_day80_original_table_inventory_and_write_budget_20261012.test.mjs
      - name: REAL Cloudflare destination GET SELECT account-wide GraphQL; no data mutation
        env:
          S2_SCHEMA_DEST_ACCOUNT_ID: ${{ secrets.S2_SCHEMA_DEST_ACCOUNT_ID }}
          S2_SCHEMA_DEST_D1_WRITE_TOKEN: ${{ secrets.S2_SCHEMA_DEST_D1_WRITE_TOKEN }}
        run: node system2/migration/destination_day80_readonly_cloudflare_preflight_20261012.mjs
      - name: Preserve sanitized evidence (read-only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s2-destination-day80-real-readonly-preflight-${{ github.run_id }}
          path: /tmp/s2-day80-destination-readonly/receipt.json
          if-no-files-found: warn
          retention-days: 14
