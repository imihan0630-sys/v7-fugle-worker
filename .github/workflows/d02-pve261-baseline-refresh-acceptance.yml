name: D02 PVE261 Baseline Refresh Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/d02_pve261_baseline_refresh_acceptance_v0_1.mjs"
      - "tests/test_d02_pve261_baseline_refresh_acceptance_v0_1.mjs"
      - ".github/workflows/d02-pve261-baseline-refresh-acceptance.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/test_d02_pve261_baseline_refresh_acceptance_v0_1.mjs
