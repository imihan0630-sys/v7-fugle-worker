name: D03 TWSE Official Document Contract Readonly

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/d03-twse-official-document-contract-readonly.yml"

permissions:
  contents: read

concurrency:
  group: d03-twse-official-document-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch official TWSE announcement page
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://wwwc.twse.com.tw"
          PAGE="/zh/announcement/announcement/list.html"
          curl --fail --silent --show-error --location --max-time 30 \
            --header "User-Agent: D03-TWSE-Official-Document-Contract/0.1" \
            "${BASE}${PAGE}" -o /tmp/twse_announcement.html
          echo "http_fetch=PASS"
          echo "bytes=$(wc -c </tmp/twse_announcement.html)"
          echo "sha256=$(sha256sum /tmp/twse_announcement.html | awk '{print $1}')"

      - name: Inspect forms inputs scripts and endpoint-like strings
        shell: python
        run: |
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlparse
          from pathlib import Path
          import json, re, subprocess

          BASE="https://wwwc.twse.com.tw"
          html=Path("/tmp/twse_announcement.html").read_text(encoding="utf-8",errors="replace")

          class P(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.forms=[]; self.inputs=[]; self.scripts=[]; self.links=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag=="form": self.forms.append(d)
                  if tag in ("input","select","textarea","button"):
                      self.inputs.append({"tag":tag,**d})
                  if tag=="script" and d.get("src"): self.scripts.append(d["src"])
                  if tag=="a" and d.get("href"): self.links.append(d["href"])
          p=P(); p.feed(html)

          print("FORMS_JSON="+json.dumps(p.forms,ensure_ascii=False))
          print("INPUTS_JSON="+json.dumps(p.inputs,ensure_ascii=False))
          print("SCRIPT_SRCS_JSON="+json.dumps(p.scripts,ensure_ascii=False))

          inline=set()
          for m in re.finditer(r'https?://[^"\'\s<>]+',html,re.I):
              inline.add(m.group(0))
          for m in re.finditer(r'["\']([^"\']*(?:announcement|ajax|api|query|search|report|csv|json)[^"\']*)["\']',html,re.I):
              inline.add(m.group(1))
          print("INLINE_ENDPOINT_HINTS_JSON="+json.dumps(sorted(inline)[:300],ensure_ascii=False))

          same_host_scripts=[]
          for src in p.scripts:
              u=urljoin(BASE,src)
              if urlparse(u).hostname=="wwwc.twse.com.tw":
                  same_host_scripts.append(u)
          print("SAME_HOST_SCRIPT_COUNT="+str(len(same_host_scripts)))

          hints=[]
          for i,u in enumerate(same_host_scripts[:40]):
              cp=subprocess.run(
                  ["curl","--fail","--silent","--show-error","--location","--max-time","30",
                   "--header","User-Agent: D03-TWSE-Official-Document-Contract/0.1",u],
                  text=True,capture_output=True
              )
              if cp.returncode!=0:
                  print("SCRIPT_FETCH_ERROR",u,cp.stderr[:300])
                  continue
              for line_no,line in enumerate(cp.stdout.splitlines(),1):
                  if re.search(r'announcement|ajax|api|query|search|startDate|endDate|keyword|csv|json|response|page',line,re.I):
                      hints.append({"url":u,"line":line_no,"text":line.strip()[:1000]})
          print("SCRIPT_HINTS_JSON="+json.dumps(hints[:500],ensure_ascii=False))

      - name: Inspect report framework request construction
        shell: python
        run: |
          import re, subprocess
          url="https://wwwc.twse.com.tw/res/js/web-report.js"
          p=subprocess.run(["curl","--fail","--silent","--show-error","--location","--max-time","30",url],text=True,capture_output=True,check=True)
          js=p.stdout
          print("WEB_REPORT_BYTES="+str(len(js.encode("utf-8"))))
          needles=[
              'data("api")', "data('api')", "dataset.api", "cfg.api", "cfg.root",
              "$.ajax", "$.getJSON", "$.get(", "fetch(", "URLSearchParams",
              "startDate", "endDate", "keyword", "csv", "download"
          ]
          for needle in needles:
              pos=0; n=0
              while True:
                  i=js.find(needle,pos)
                  if i<0: break
                  n+=1
                  lo=max(0,i-700); hi=min(len(js),i+1400)
                  print("\nREQUEST_CONTEXT needle="+needle+" hit="+str(n))
                  print(js[lo:hi])
                  pos=i+len(needle)
                  if n>=8: break
          for m in list(re.finditer(r'/[A-Za-z0-9_./{}?-]*(?:announcement|report)[A-Za-z0-9_./{}?=&-]*',js,re.I))[:80]:
              print("PATH_HINT="+m.group(0))

      - name: Resolve apiHost and language configuration
        shell: python
        run: |
          import subprocess
          urls=[
            "https://wwwc.twse.com.tw/zh/announcement/announcement/list.html",
            "https://wwwc.twse.com.tw/res/js/web.js",
            "https://wwwc.twse.com.tw/res/js/main.js",
          ]
          needles=["apiHost","cfg.lan","lan:","rwd:","api.twse","www.twse","wwwc.twse","config"]
          for url in urls:
              p=subprocess.run(["curl","--fail","--silent","--show-error","--location","--max-time","30",url],text=True,capture_output=True,check=True)
              s=p.stdout
              print("\nURL="+url+" bytes="+str(len(s.encode("utf-8"))))
              for needle in needles:
                  pos=0; hits=0
                  while True:
                      i=s.find(needle,pos)
                      if i<0: break
                      hits+=1
                      print("CFG_CONTEXT needle="+needle+" hit="+str(hits))
                      print(s[max(0,i-900):min(len(s),i+1700)])
                      pos=i+len(needle)
                      if hits>=6: break

      - name: Probe reconstructed official announcement API
        shell: python
        run: |
          import json, subprocess, urllib.parse, hashlib

          base="https://wwwc.twse.com.tw/rwd/zh/announcement/announcement"
          params={
            "startDate":"20260701",
            "endDate":"20260810",
            "keyword":"減資",
            "response":"json",
          }
          url=base+"?"+urllib.parse.urlencode(params)
          p=subprocess.run(
            ["curl","--fail","--silent","--show-error","--location","--max-time","30",
             "--header","User-Agent: D03-TWSE-Official-Document-Contract/0.1",url],
            text=True,capture_output=True
          )
          print("API_URL="+url)
          print("API_CURL_EXIT="+str(p.returncode))
          if p.returncode!=0:
              print("API_CURL_ERROR="+p.stderr[:1000])
              raise SystemExit(1)
          raw=p.stdout
          print("API_BYTES="+str(len(raw.encode("utf-8"))))
          print("API_SHA256="+hashlib.sha256(raw.encode("utf-8")).hexdigest())
          obj=json.loads(raw)
          print("API_TOP_LEVEL="+json.dumps({k:obj.get(k) for k in obj.keys() if k not in ("data","tables")},ensure_ascii=False))
          print("API_FIELDS="+json.dumps(obj.get("fields"),ensure_ascii=False))
          data=obj.get("data") or []
          print("API_DATA_COUNT="+str(len(data)))
          print("API_DATA_SAMPLE="+json.dumps(data[:20],ensure_ascii=False))

          # The same front-end exposes CSV from the same endpoint/arguments.
          csv_params=dict(params); csv_params["response"]="csv"
          csv_url=base+"?"+urllib.parse.urlencode(csv_params)
          q=subprocess.run(
            ["curl","--fail","--silent","--show-error","--location","--max-time","30",
             "--header","User-Agent: D03-TWSE-Official-Document-Contract/0.1",csv_url],
            text=True,capture_output=True
          )
          print("CSV_URL="+csv_url)
          print("CSV_CURL_EXIT="+str(q.returncode))
          if q.returncode==0:
              print("CSV_BYTES="+str(len(q.stdout.encode("utf-8"))))
              print("CSV_SHA256="+hashlib.sha256(q.stdout.encode("utf-8")).hexdigest())
              print("CSV_HEAD="+json.dumps(q.stdout.splitlines()[:20],ensure_ascii=False))
          else:
              print("CSV_CURL_ERROR="+q.stderr[:1000])

      - name: Inspect result table paging attributes
        shell: python
        run: |
          from html.parser import HTMLParser
          from pathlib import Path
          import json
          html=Path("/tmp/twse_announcement.html").read_text(encoding="utf-8",errors="replace")
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.tables=[]; self.divs=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag=="table": self.tables.append(d)
                  if tag=="div" and ("class" in d or any(k.startswith("data-") for k in d)): self.divs.append(d)
          p=P(); p.feed(html)
          interesting=[]
          for d in p.tables+p.divs:
              s=json.dumps(d,ensure_ascii=False)
              if "rwd-table" in s or "paging" in s or "server-side" in s or "reports" in s:
                  interesting.append(d)
          print("PAGING_ATTRS_JSON="+json.dumps(interesting,ensure_ascii=False))

      - name: Reconcile server-side pagination over a high-volume bounded interval
        shell: python
        run: |
          import json, subprocess, urllib.parse, hashlib, math

          base="https://wwwc.twse.com.tw/rwd/zh/announcement/announcement"
          common={"startDate":"20260701","endDate":"20260810","keyword":"","response":"json"}

          def fetch(extra):
              q=dict(common); q.update(extra)
              url=base+"?"+urllib.parse.urlencode(q)
              p=subprocess.run(
                ["curl","--fail","--silent","--show-error","--location","--max-time","30",
                 "--header","User-Agent: D03-TWSE-Official-Document-Contract/0.1",url],
                text=True,capture_output=True
              )
              if p.returncode!=0: raise RuntimeError(p.stderr[:1000])
              obj=json.loads(p.stdout)
              if str(obj.get("stat","")).lower()!="ok": raise RuntimeError("non-ok "+str(obj.get("stat")))
              return url,p.stdout,obj

          # Browser contract says paging=15, server-side.
          page_size=15
          url0,raw0,obj0=fetch({"paging":page_size,"offset":0})
          total=int(obj0.get("total",0))
          pages=max(1,math.ceil(total/page_size))
          all_rows=[]
          receipts=[]
          for page in range(pages):
              off=page*page_size
              url,raw,obj=fetch({"paging":page_size,"offset":off})
              rows=obj.get("data") or []
              receipts.append({
                "page":page+1,"offset":off,"count":len(rows),"total":obj.get("total"),
                "sha256":hashlib.sha256(raw.encode("utf-8")).hexdigest()
              })
              all_rows.extend(rows)

          ids=[str(row[-1]) for row in all_rows if isinstance(row,list) and row]
          unique_ids=sorted(set(ids))
          print("PAGED_URL0="+url0)
          print("PAGED_TOTAL="+str(total))
          print("PAGED_PAGE_COUNT="+str(pages))
          print("PAGED_FETCHED_ROWS="+str(len(all_rows)))
          print("PAGED_UNIQUE_IDS="+str(len(unique_ids)))
          print("PAGED_DUPLICATE_IDS="+str(len(ids)-len(unique_ids)))
          print("PAGED_RECEIPTS="+json.dumps(receipts,ensure_ascii=False))
          print("PAGED_FIRST_ROWS="+json.dumps(all_rows[:5],ensure_ascii=False))
          print("PAGED_LAST_ROWS="+json.dumps(all_rows[-5:],ensure_ascii=False))

          # Characterize unpaged behavior on the identical frozen interval.
          un_url,un_raw,un_obj=fetch({})
          un_rows=un_obj.get("data") or []
          un_ids=[str(row[-1]) for row in un_rows if isinstance(row,list) and row]
          print("UNPAGED_URL="+un_url)
          print("UNPAGED_TOTAL="+str(un_obj.get("total")))
          print("UNPAGED_DATA_COUNT="+str(len(un_rows)))
          print("UNPAGED_UNIQUE_IDS="+str(len(set(un_ids))))
          print("UNPAGED_SHA256="+hashlib.sha256(un_raw.encode("utf-8")).hexdigest())

          exact=(len(all_rows)==total and len(unique_ids)==total and len(ids)==len(unique_ids))
          unpaged_exact=(len(un_rows)==total and set(un_ids)==set(unique_ids))
          print("SERVER_SIDE_PAGINATION_RECONCILIATION="+("PASS" if exact else "FAIL"))
          print("UNPAGED_EQUIVALENCE="+("PASS" if unpaged_exact else "NOT_EQUIVALENT"))
          if not exact:
              raise SystemExit("server-side pagination reconciliation failed")

      - name: Probe exchange-side suspension and revocation chronology
        shell: python
        run: |
          import json, subprocess, urllib.parse, re, hashlib

          base="https://wwwc.twse.com.tw/rwd/zh/announcement/announcement"
          params={
            "startDate":"20260701","endDate":"20260810",
            "keyword":"川飛能源","response":"json"
          }
          url=base+"?"+urllib.parse.urlencode(params)
          p=subprocess.run(["curl","--fail","--silent","--show-error","--location","--max-time","30",url],
                           text=True,capture_output=True,check=True)
          obj=json.loads(p.stdout)
          rows=obj.get("data") or []
          print("REVERSAL_QUERY_URL="+url)
          print("REVERSAL_TOTAL="+str(obj.get("total")))
          print("REVERSAL_ROWS="+json.dumps(rows,ensure_ascii=False))
          stop=[r for r in rows if "停止申報生效" in str(r[3]) and "解除停止申報生效" not in str(r[3])]
          release=[r for r in rows if "解除停止申報生效" in str(r[3])]
          print("STOP_COUNT="+str(len(stop)))
          print("RELEASE_COUNT="+str(len(release)))
          chronology_pass=bool(stop and release)
          print("REVERSAL_CHRONOLOGY_PAIR="+("PASS" if chronology_pass else "NOT_PROVEN"))

          # Characterize detail pages for every pair row. Do not execute browser JS.
          for tag,group in (("STOP",stop),("RELEASE",release)):
              for idx,row in enumerate(group,1):
                  token=str(row[-1]).replace("-","")
                  page="https://wwwc.twse.com.tw/zh/announcement/announcement/detail.html?"+token
                  q=subprocess.run(["curl","--fail","--silent","--show-error","--location","--max-time","30",page],
                                   text=True,capture_output=True,check=True)
                  html=q.stdout
                  api=re.findall(r'data-api=["\']([^"\']+)["\']',html,re.I)
                  fields=re.findall(r'(?:name|data-[a-z-]+)=["\']([^"\']+)["\']',html,re.I)
                  print(tag+"_DETAIL_"+str(idx)+"_URL="+page)
                  print(tag+"_DETAIL_"+str(idx)+"_BYTES="+str(len(html.encode("utf-8"))))
                  print(tag+"_DETAIL_"+str(idx)+"_SHA256="+hashlib.sha256(html.encode("utf-8")).hexdigest())
                  print(tag+"_DETAIL_"+str(idx)+"_DATA_API="+json.dumps(api,ensure_ascii=False))
                  print(tag+"_DETAIL_"+str(idx)+"_TOKEN_PRESENT="+str(token.lower() in html.lower()).lower())
                  for needle in ("announcement","api","id","token","query"):
                      pos=html.lower().find(needle.lower())
                      if pos>=0:
                          print(tag+"_DETAIL_CONTEXT_"+needle+"="+html[max(0,pos-300):min(len(html),pos+900)].replace("\n"," ")[:1300])

      - name: Resolve official-document detail API token contract
        shell: python
        run: |
          import json, subprocess, re, urllib.parse, hashlib

          token="0DE33D5F8CB111F19A80005056BE3760"
          page="https://wwwc.twse.com.tw/zh/announcement/announcement/detail.html?"+token
          p=subprocess.run(["curl","--fail","--silent","--show-error","--location","--max-time","30",page],
                           text=True,capture_output=True,check=True)
          html=p.stdout
          print("DETAIL_INLINE_CONTEXTS_BEGIN")
          for needle in ("location.search","onload-argv","announcement_detail","URLSearchParams","search.substring","document.location"):
              pos=0; hits=0
              while True:
                  i=html.find(needle,pos)
                  if i<0: break
                  hits+=1
                  print("DETAIL_INLINE needle="+needle+" hit="+str(hits))
                  print(html[max(0,i-600):min(len(html),i+1600)].replace("\n"," ")[:2400])
                  pos=i+len(needle)
                  if hits>=6: break
          print("DETAIL_INLINE_CONTEXTS_END")

          base="https://wwwc.twse.com.tw/rwd/zh/announcement/announcement_detail"
          variants=[
              {"id":token,"response":"json"},
              {"ID":token,"response":"json"},
              {"uuid":token,"response":"json"},
              {"keyword":token,"response":"json"},
          ]
          for q in variants:
              url=base+"?"+urllib.parse.urlencode(q)
              z=subprocess.run(["curl","--fail","--silent","--show-error","--location","--max-time","30",url],
                               text=True,capture_output=True)
              print("DETAIL_API_VARIANT="+url)
              print("DETAIL_API_EXIT="+str(z.returncode))
              if z.returncode==0:
                  raw=z.stdout
                  print("DETAIL_API_BYTES="+str(len(raw.encode("utf-8"))))
                  print("DETAIL_API_SHA256="+hashlib.sha256(raw.encode("utf-8")).hexdigest())
                  try:
                      obj=json.loads(raw)
                      print("DETAIL_API_JSON="+json.dumps(obj,ensure_ascii=False)[:12000])
                  except Exception:
                      print("DETAIL_API_TEXT_HEAD="+json.dumps(raw[:3000],ensure_ascii=False))
              else:
                  print("DETAIL_API_ERROR="+z.stderr[:600])

      - name: Bounded raw-page grep
        shell: bash
        run: |
          set -euo pipefail
          grep -Ein 'announcement|ajax|api|query|search|startDate|endDate|keyword|csv|json|page' /tmp/twse_announcement.html | head -n 250 || true
          echo "READ_ONLY_BOUNDARY=PASS"
          echo "HISTORY_MUTATION=false"
          echo "STRATEGY_EVALUATION=false"
          echo "SELECTION_AUTHORITY=false"
          echo "SYSTEM1_RUNTIME_USED=false"
