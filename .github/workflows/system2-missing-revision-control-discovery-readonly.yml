name: System2 Missing Revision Control Discovery Readonly

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "system2/scripts/probe_missing_revision_representative_controls_readonly_v0_1.mjs"
      - "system2/SYSTEM2_MISSING_REVISION_REPRESENTATIVE_CONTROL_DISCOVERY_V0_1.md"
      - ".github/workflows/system2-missing-revision-control-discovery-readonly.yml"
  push:
    branches: [main]
    paths:
      - "system2/scripts/probe_missing_revision_representative_controls_readonly_v0_1.mjs"
      - "system2/SYSTEM2_MISSING_REVISION_REPRESENTATIVE_CONTROL_DISCOVERY_V0_1.md"
      - ".github/workflows/system2-missing-revision-control-discovery-readonly.yml"

permissions:
  contents: read

concurrency:
  group: system2-missing-revision-control-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Discover revision control candidates
        run: node system2/scripts/probe_missing_revision_representative_controls_readonly_v0_1.mjs

      - name: Confirm read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -qE 'CLOUDFLARE|SYSTEM2_DB|wrangler|secret|deploy|INSERT|UPDATE|DELETE' system2/scripts/probe_missing_revision_representative_controls_readonly_v0_1.mjs
          echo "Read-only missing revision control discovery boundary PASS"
