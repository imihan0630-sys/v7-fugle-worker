name: System2 Recent60 Hot D1 vs PIT Sample Readonly

on:
  workflow_dispatch:
    inputs:
      market_date:
        description: "Already-ended Taiwan-market date; retrospective diagnostic only"
        type: string
        required: true
        default: "2026-10-08"
  push:
    branches: [main]
    paths:
      - ".github/workflows/system2-recent60-hot-d1-vs-pit-readonly.yml"
      - "system2/runtime/recent60_hot_d1_vs_pit_gap_audit_v0_1.mjs"
      - "system2/scripts/audit_recent60_hot_d1_vs_pit_gap_readonly_v0_1.mjs"
      - "system2/tests/recent60_hot_d1_vs_pit_gap_audit_v0_1.test.mjs"

permissions:
  contents: read

concurrency:
  group: system2-recent60-hot-d1-vs-pit-sample-readonly
  cancel-in-progress: false

jobs:
  readback:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: system2-research
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify D1 SELECT-only and System1 isolation tests
        run: |
          set -euo pipefail
          node system2/tests/recent60_hot_d1_vs_pit_gap_audit_v0_1.test.mjs
          node --check system2/scripts/audit_recent60_hot_d1_vs_pit_gap_readonly_v0_1.mjs
          git diff --exit-code -- Worker.js wrangler.toml

      - name: Inspect 2026-10-08 historical PIT gaps against isolated hot D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
          SYSTEM2_RECENT60_AUDIT_MARKET_DATE: ${{ inputs.market_date || '2026-10-08' }}
          SYSTEM2_RECENT60_AUDIT_OUTPUT: /tmp/system2-recent60-hot-d1-vs-pit-readonly.json
        run: |
          set -euo pipefail
          node system2/scripts/audit_recent60_hot_d1_vs_pit_gap_readonly_v0_1.mjs

      - name: Keep immutable diagnostic or blocked receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system2-recent60-hot-d1-vs-pit-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/system2-recent60-hot-d1-vs-pit-readonly.json
          if-no-files-found: warn
          retention-days: 90

      - name: Verify System1 production remained untouched
        if: always()
        run: |
          git diff --exit-code -- Worker.js wrangler.toml
          echo "Production isolation PASS"
