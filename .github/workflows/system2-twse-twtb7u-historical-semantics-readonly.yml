name: System2 TWSE TWTB7U Historical Semantics Readonly

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "system2/scripts/probe_twse_twtb7u_historical_semantics_readonly_v0_1.mjs"
      - "system2/SYSTEM2_TWSE_TWTB7U_HISTORICAL_SEMANTICS_V0_1.md"
      - ".github/workflows/system2-twse-twtb7u-historical-semantics-readonly.yml"
  push:
    branches: [main]
    paths:
      - "system2/scripts/probe_twse_twtb7u_historical_semantics_readonly_v0_1.mjs"
      - "system2/SYSTEM2_TWSE_TWTB7U_HISTORICAL_SEMANTICS_V0_1.md"
      - ".github/workflows/system2-twse-twtb7u-historical-semantics-readonly.yml"

permissions:
  contents: read

concurrency:
  group: system2-twse-twtb7u-historical-semantics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Characterize TWTB7U historical semantics
        run: node system2/scripts/probe_twse_twtb7u_historical_semantics_readonly_v0_1.mjs
      - name: Confirm read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -qE 'CLOUDFLARE|SYSTEM2_DB|wrangler|secret|deploy|INSERT|UPDATE|DELETE' system2/scripts/probe_twse_twtb7u_historical_semantics_readonly_v0_1.mjs
          echo "Read-only TWTB7U semantics boundary PASS"
