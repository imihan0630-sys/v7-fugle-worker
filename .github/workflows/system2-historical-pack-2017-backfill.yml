name: System2 Historical Pack 2017 Backfill

on:
  push:
    paths:
      - ".github/workflows/system2-historical-pack-2017-backfill.yml"
      - "system2/scripts/historical_pack_year_backfill_v0_1.mjs"
      - "system2/runtime/historical_pack_bulk_persistence_v0_1.mjs"
      - "system2/runtime/historical_pack_research_v0_1.mjs"
      - "system2/runtime/historical_twse_calendar_v0_1.mjs"
      - "system2/runtime/official_historical_backfill_source_v0_1.mjs"
      - "system2/sql/0005_historical_packs.sql"
      - "system2/deploy/provision_system2_d1.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system2-historical-pack-2017-backfill
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: system2-research
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Migrate isolated System2 D1 to schema 0.9
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
          SYSTEM2_CONFIRM: CREATE_SYSTEM2_ISOLATED_D1
        run: node system2/deploy/provision_system2_d1.mjs

  backfill:
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: system2-research
    strategy:
      fail-fast: false
      matrix:
        market: [TWSE, TPEX]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Backfill 2017 packed history
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
          SYSTEM2_HISTORY_YEAR: "2017"
          SYSTEM2_HISTORY_YEAR_MARKET: ${{ matrix.market }}
        run: node system2/scripts/historical_pack_year_backfill_v0_1.mjs
      - name: Confirm System1 production files untouched
        run: |
          set -euo pipefail
          test "$(sed -n '1p' wrangler.toml)" = 'name = "fugle-test"'
          git diff --exit-code -- wrangler.toml Worker.js
          echo "Production isolation PASS"
