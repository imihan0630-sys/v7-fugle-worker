name: System2 Historical Pack 2017 Backfill

on:
  workflow_dispatch:
    inputs:
      market:
        description: "Backfill one market only; run TWSE first, verify, then run TPEX"
        required: true
        type: choice
        options:
          - TWSE
          - TPEX

permissions:
  contents: read

concurrency:
  group: system2-isolated-d1-writer
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: system2-research
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Migrate isolated System2 D1 to schema 1.1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
          SYSTEM2_CONFIRM: CREATE_SYSTEM2_ISOLATED_D1
        run: node system2/deploy/provision_system2_d1.mjs

  backfill:
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: system2-research
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Backfill 2017 packed history
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
          SYSTEM2_R2_ACCESS_KEY_ID: ${{ secrets.SYSTEM2_R2_ACCESS_KEY_ID }}
          SYSTEM2_R2_SECRET_ACCESS_KEY: ${{ secrets.SYSTEM2_R2_SECRET_ACCESS_KEY }}
          SYSTEM2_R2_BUCKET: ${{ vars.SYSTEM2_R2_BUCKET }}
          SYSTEM2_HISTORY_YEAR: "2017"
          SYSTEM2_HISTORY_YEAR_MARKET: ${{ inputs.market }}
        run: node system2/scripts/historical_pack_year_backfill_v0_1.mjs
      - name: Physically verify 2017 TWSE coverage and R2 byte hashes
        if: ${{ inputs.market == 'TWSE' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
          SYSTEM2_R2_ACCESS_KEY_ID: ${{ secrets.SYSTEM2_R2_ACCESS_KEY_ID }}
          SYSTEM2_R2_SECRET_ACCESS_KEY: ${{ secrets.SYSTEM2_R2_SECRET_ACCESS_KEY }}
          SYSTEM2_R2_BUCKET: ${{ vars.SYSTEM2_R2_BUCKET }}
          SYSTEM2_HISTORY_YEAR: "2017"
          SYSTEM2_HISTORY_YEAR_MARKET: "TWSE"
          SYSTEM2_HISTORY_COVERAGE_OUTPUT: "/tmp/system2-historical-coverage-TWSE-2017.json"
        run: |
          set -euo pipefail
          node system2/scripts/historical_market_year_verify_v0_1.mjs | tee /tmp/system2-historical-coverage-TWSE-2017.log
      - name: Upload 2017 TWSE physical coverage evidence
        if: ${{ always() && inputs.market == 'TWSE' }}
        uses: actions/upload-artifact@v4
        with:
          name: system2-historical-coverage-TWSE-2017
          path: /tmp/system2-historical-coverage-TWSE-2017.json
          if-no-files-found: error
          retention-days: 30
      - name: Confirm System1 production files untouched
        if: ${{ always() }}
        run: |
          set -euo pipefail
          test "$(sed -n '1p' wrangler.toml)" = 'name = "fugle-test"'
          git diff --exit-code -- wrangler.toml Worker.js
          echo "Production isolation PASS"
