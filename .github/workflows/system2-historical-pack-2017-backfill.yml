name: System2 Historical Pack Annual Backfill

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Completed calendar year only; current year uses a separate incremental path"
        required: true
        type: choice
        default: "2018"
        options:
          - "2017"
          - "2018"
          - "2019"
          - "2020"
          - "2021"
          - "2022"
          - "2023"
          - "2024"
          - "2025"
      market:
        description: "Backfill one market only; run TWSE first, verify, then run TPEX"
        required: true
        type: choice
        options:
          - TWSE
          - TPEX

permissions:
  contents: read

concurrency:
  group: system2-isolated-d1-writer
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: system2-research
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Migrate isolated System2 D1 to schema 1.1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
          SYSTEM2_CONFIRM: CREATE_SYSTEM2_ISOLATED_D1
        run: node system2/deploy/provision_system2_d1.mjs

  backfill:
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: system2-research
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Backfill selected-year packed history
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
          SYSTEM2_R2_ACCESS_KEY_ID: ${{ secrets.SYSTEM2_R2_ACCESS_KEY_ID }}
          SYSTEM2_R2_SECRET_ACCESS_KEY: ${{ secrets.SYSTEM2_R2_SECRET_ACCESS_KEY }}
          SYSTEM2_R2_BUCKET: ${{ vars.SYSTEM2_R2_BUCKET }}
          SYSTEM2_HISTORY_YEAR: ${{ inputs.year }}
          SYSTEM2_HISTORY_YEAR_MARKET: ${{ inputs.market }}
        run: node system2/scripts/historical_pack_year_backfill_v0_1.mjs
      - name: Persist bounded 2021 TPEx PIT revision lineage
        if: ${{ inputs.year == '2021' && inputs.market == 'TPEX' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
          SYSTEM2_R2_ACCESS_KEY_ID: ${{ secrets.SYSTEM2_R2_ACCESS_KEY_ID }}
          SYSTEM2_R2_SECRET_ACCESS_KEY: ${{ secrets.SYSTEM2_R2_SECRET_ACCESS_KEY }}
          SYSTEM2_R2_BUCKET: ${{ vars.SYSTEM2_R2_BUCKET }}
          SYSTEM2_HISTORY_YEAR: ${{ inputs.year }}
          SYSTEM2_HISTORY_YEAR_MARKET: ${{ inputs.market }}
          SYSTEM2_HISTORY_REVISION_OUTPUT: "/tmp/system2-historical-revision-lineage-TPEX-2021.json"
        run: |
          set -euo pipefail
          node system2/scripts/historical_tpex_2021_revision_overlay_v0_1.mjs | tee /tmp/system2-historical-revision-lineage-TPEX-2021.log
      - name: Physically verify selected-year market coverage and R2 byte hashes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
          SYSTEM2_R2_ACCESS_KEY_ID: ${{ secrets.SYSTEM2_R2_ACCESS_KEY_ID }}
          SYSTEM2_R2_SECRET_ACCESS_KEY: ${{ secrets.SYSTEM2_R2_SECRET_ACCESS_KEY }}
          SYSTEM2_R2_BUCKET: ${{ vars.SYSTEM2_R2_BUCKET }}
          SYSTEM2_HISTORY_YEAR: ${{ inputs.year }}
          SYSTEM2_HISTORY_YEAR_MARKET: ${{ inputs.market }}
          SYSTEM2_HISTORY_COVERAGE_OUTPUT: "/tmp/system2-historical-coverage-${{ inputs.market }}-${{ inputs.year }}.json"
        run: |
          set -euo pipefail
          node system2/scripts/historical_market_year_verify_v0_1.mjs | tee /tmp/system2-historical-coverage-${{ inputs.market }}-${{ inputs.year }}.log
      - name: Upload selected-year physical coverage evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: system2-historical-coverage-${{ inputs.market }}-${{ inputs.year }}
          path: /tmp/system2-historical-coverage-${{ inputs.market }}-${{ inputs.year }}.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload bounded 2021 TPEx revision-lineage evidence
        if: ${{ always() && inputs.year == '2021' && inputs.market == 'TPEX' }}
        uses: actions/upload-artifact@v4
        with:
          name: system2-historical-revision-lineage-TPEX-2021
          path: /tmp/system2-historical-revision-lineage-TPEX-2021.json
          if-no-files-found: warn
          retention-days: 30
      - name: Confirm System1 production files untouched
        if: ${{ always() }}
        run: |
          set -euo pipefail
          test "$(sed -n '1p' wrangler.toml)" = 'name = "fugle-test"'
          git diff --exit-code -- wrangler.toml Worker.js
          echo "Production isolation PASS"
