name: System2 MOPS Revision Source Capability Readonly

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "system2/runtime/mops_revision_source_capability_v0_1.mjs"
      - "system2/tests/mops_revision_source_capability_v0_1.test.mjs"
      - "system2/scripts/probe_mops_revision_source_readonly_v0_1.mjs"
      - "system2/SYSTEM2_MOPS_REVISION_SOURCE_CAPABILITY_V0_1.md"
      - ".github/workflows/system2-mops-revision-source-capability-readonly.yml"
  push:
    branches: [main]
    paths:
      - "system2/runtime/mops_revision_source_capability_v0_1.mjs"
      - "system2/tests/mops_revision_source_capability_v0_1.test.mjs"
      - "system2/scripts/probe_mops_revision_source_readonly_v0_1.mjs"
      - "system2/SYSTEM2_MOPS_REVISION_SOURCE_CAPABILITY_V0_1.md"
      - ".github/workflows/system2-mops-revision-source-capability-readonly.yml"

permissions:
  contents: read

concurrency:
  group: system2-mops-revision-source-capability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run focused tests
        run: node system2/tests/mops_revision_source_capability_v0_1.test.mjs

      - name: Probe MOPS historical original/correction coexistence
        run: node system2/scripts/probe_mops_revision_source_readonly_v0_1.mjs

      - name: Confirm read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -qE 'CLOUDFLARE|SYSTEM2_DB|wrangler|secret|deploy' system2/scripts/probe_mops_revision_source_readonly_v0_1.mjs
          echo "Read-only MOPS revision source capability boundary PASS"
