name: V8 Oct12 Scheduled Scan Lock Provider READONLY ONCE 20261013
on:
  push:
    branches:
      - ops/v8-oct12-cron-lock-forensics-readonly-20261013
    paths:
      - .github/workflows/v8-oct12-cron-lock-forensics-once-20261013.yml
permissions:
  contents: read
jobs:
  forensics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
      V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Query exact source Cloudflare scheduling + minimal SELECT only; no Worker mutation
        run: node ops/v8-oct12-cron-lock-forensics-readonly-20261013.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v8-oct12-cron-lock-forensics-${{ github.run_id }}
          path: artifacts/v8-oct12-cron-lock-forensics-readonly.json
          retention-days: 60
          if-no-files-found: error
