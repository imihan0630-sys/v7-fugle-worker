name: System2 AUDIT Postmarket 0015 Parent Lineage
on:
  pull_request:
    paths:
      - "system2/tests/audit_postmarket_0015_recovery_parent_v0_1.test.mjs"
      - "system2/runtime/post_market_clock_gate_v0_1.mjs"
      - ".github/workflows/system2-audit-postmarket-parent-v0-1.yml"
  push:
    branches: [main]
    paths:
      - "system2/tests/audit_postmarket_0015_recovery_parent_v0_1.test.mjs"
      - "system2/runtime/post_market_clock_gate_v0_1.mjs"
      - ".github/workflows/system2-audit-postmarket-parent-v0-1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Independently observe forged recovery parent boundary
        run: node system2/tests/audit_postmarket_0015_recovery_parent_v0_1.test.mjs
      - name: Syntax check
        run: node --check system2/runtime/post_market_clock_gate_v0_1.mjs
