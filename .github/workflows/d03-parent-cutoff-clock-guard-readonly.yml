name: D03 Parent Cutoff Clock Guard Readonly

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/d03_parent_cutoff_clock_guard_v0_1.mjs"
      - "research/test_d03_parent_cutoff_clock_guard_v0_1.mjs"
      - "research/D03_PARENT_CUTOFF_CLOCK_GUARD_V0_1.md"
      - ".github/workflows/d03-parent-cutoff-clock-guard-readonly.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run outcome-blind parent cutoff guard tests
        run: node research/test_d03_parent_cutoff_clock_guard_v0_1.mjs
      - name: Confirm isolation
        shell: bash
        run: |
          set -euo pipefail
          ! grep -qE 'fetch\(|CLOUDFLARE|wrangler|INSERT|UPDATE|DELETE|sendPush|processSignalState' research/d03_parent_cutoff_clock_guard_v0_1.mjs
          echo "D03 parent-cutoff guard isolation PASS"
