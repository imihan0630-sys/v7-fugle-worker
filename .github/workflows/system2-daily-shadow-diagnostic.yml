name: System2 Daily Shadow Diagnostic

on:
  schedule:
    - cron: "35 10 * * 1-5" # 18:35 Asia/Taipei; diagnostic observation clock only
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "system2/runtime/daily_shadow_diagnostic_orchestrator_v0_1.mjs"
      - "system2/runtime/daily_shadow_destination_account_route_v0_1.mjs"
      - "system2/scripts/run_d1_account_quota_gate_v0_1.mjs"
      - "system2/runtime/daily_shadow_a1_source_v0_1.mjs"
      - "system2/runtime/a1_symbol_snapshot_adapter.mjs"
      - "system2/runtime/current_listing_metadata_v0_1.mjs"
      - "system2/runtime/official_historical_a1_source_v0_1.mjs"
      - "system2/runtime/official_historical_backfill_source_v0_1.mjs"
      - "system2/runtime/daily_shadow_input_preflight_v0_1.mjs"
      - "system2/runtime/daily_shadow_history_reader_v0_1.mjs"
      - "system2/runtime/daily_shadow_prospective_history_v0_1.mjs"
      - "system2/runtime/historical_store_v0_1.mjs"
      - "system2/scripts/run_daily_shadow_diagnostic.mjs"
      - ".github/workflows/system2-daily-shadow-diagnostic.yml"

permissions:
  contents: read

concurrency:
  group: system2-isolated-d1-writer
  cancel-in-progress: false

jobs:
  diagnostic:
    if: github.ref == 'refs/heads/main' && github.event_name != 'push' # no unscheduled D1 writer during ongoing source->dest migration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: system2-schema-only # Verified new destination account only; source environment quarantined
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify diagnostic authority and persistence boundaries
        run: |
          set -euo pipefail
          node system2/tests/daily_shadow_diagnostic_v0_1.test.mjs
          node system2/tests/current_listing_metadata_v0_1.test.mjs
          node system2/tests/daily_shadow_a1_exact_date_fallback_v0_2.test.mjs
          node system2/tests/daily_shadow_diagnostic_workflow_guard.test.mjs
          node system2/tests/persistence_executor.test.mjs
          node system2/tests/daily_shadow_capacity_orchestrator_v0_1.test.mjs
          node system2/tests/daily_shadow_destination_routing_p0_20261012.test.mjs
          git diff --exit-code -- Worker.js wrangler.toml
      - name: Reserve shared account D1 budget
        id: quota
        uses: ./.github/actions/system2-d1-budget-gate
        with:
          writer_id: DAILY_SHADOW_DIAGNOSTIC
        env:
          SYSTEM2_D1_ACCOUNT_ROLE: DESTINATION
          SYSTEM2_GITHUB_ENVIRONMENT: system2-schema-only
          S2_SCHEMA_DEST_ACCOUNT_ID: ${{ secrets.S2_SCHEMA_DEST_ACCOUNT_ID }}
          S2_SCHEMA_DEST_D1_WRITE_TOKEN: ${{ secrets.S2_SCHEMA_DEST_D1_WRITE_TOKEN }}
          S2_DEST_ACCOUNT_ANALYTICS_READ_TOKEN: ${{ secrets.S2_DEST_ACCOUNT_ANALYTICS_READ_TOKEN }}
      - name: Persist and read back isolated daily diagnostics
        if: steps.quota.outputs.physical_allowed == 'true'
        env:
          SYSTEM2_D1_ACCOUNT_ROLE: DESTINATION
          SYSTEM2_GITHUB_ENVIRONMENT: system2-schema-only
          S2_DEST_ACCOUNT_ANALYTICS_READ_TOKEN: ${{ secrets.S2_DEST_ACCOUNT_ANALYTICS_READ_TOKEN }}
          S2_SCHEMA_DEST_ACCOUNT_ID: ${{ secrets.S2_SCHEMA_DEST_ACCOUNT_ID }}
          S2_SCHEMA_DEST_D1_WRITE_TOKEN: ${{ secrets.S2_SCHEMA_DEST_D1_WRITE_TOKEN }}
          SYSTEM2_CONFIRM: WRITE_SYSTEM2_DAILY_DIAGNOSTIC_ONLY
        run: |
          set -euo pipefail
          test -n "$S2_SCHEMA_DEST_ACCOUNT_ID"
          test -n "$S2_SCHEMA_DEST_D1_WRITE_TOKEN"
          node system2/scripts/run_daily_shadow_diagnostic.mjs | tee /tmp/system2-daily-diagnostic.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const d=JSON.parse(fs.readFileSync("/tmp/system2-daily-diagnostic.json","utf8"));
          const r=d.receipt;
          if(d.result!=="PASS"||d.databaseName!=="system2-research")throw new Error("wrong diagnostic/database");
          if(r.capacityRunId!==null||r.zeroPickDay!==null||r.selectedCount!==null)throw new Error("fabricated capacity or zero-pick");
          if(r.finalSelectionEnabled!==false||r.generalCaptureEnabled!==false||r.livePushEnabled!==false||r.orderImpact!==false||r.system1RuntimeUsed!==false)throw new Error("authority boundary");
          if(!["IMMUTABLE_D1_READBACK_VERIFIED","SKIPPED_IDENTICAL_COMPLETED_RUN"].includes(r.persistenceState))throw new Error("missing readback");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`Daily diagnostic: ${r.state}\n\nDate: ${r.marketDate}; symbols observed: ${r.symbolCount}; UNKNOWN factors: ${r.unknownFactorCount}. No capacity/zero-pick/SELECTED claim.\n`);
          NODE
      - name: Destination D1 actual fresh readback — NOT source Worker URL
        if: steps.quota.outputs.physical_allowed == 'true'
        env:
          S2_SCHEMA_DEST_ACCOUNT_ID: ${{ secrets.S2_SCHEMA_DEST_ACCOUNT_ID }}
          S2_SCHEMA_DEST_D1_WRITE_TOKEN: ${{ secrets.S2_SCHEMA_DEST_D1_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import assert from "node:assert/strict";
          import {createRemoteD1RestAdapter} from "./system2/deploy/remote_d1_rest_adapter.mjs";
          import {sha256Hex} from "./system2/runtime/decision_archive.mjs";
          const original=JSON.parse(fs.readFileSync("/tmp/system2-daily-diagnostic.json","utf8"));
          const receipt=original.receipt;
          const db=await createRemoteD1RestAdapter({
            accountId:process.env.S2_SCHEMA_DEST_ACCOUNT_ID,
            apiToken:process.env.S2_SCHEMA_DEST_D1_WRITE_TOKEN,
            databaseName:"system2-research",
          });
          const row=await db.prepare(
            "SELECT observed_payload_json,check_hash FROM s2_infrastructure_checks WHERE check_id = ? LIMIT 1"
          ).bind("S2-DAILY-DIAGNOSTIC:"+receipt.marketDate+":"+receipt.runId).first();
          assert(row,"DEST_D1_PHYSICAL_DIAGNOSTIC_ROW_MISSING");
          const saved=JSON.parse(row.observed_payload_json);
          assert.equal(await sha256Hex(saved),row.check_hash);
          assert.equal(saved.runId,receipt.runId);
          assert.equal(saved.revision,receipt.revision);
          assert.deepEqual(saved.prospectiveHistory,receipt.prospectiveHistory);
          assert.equal(saved.zeroPickDay,null);
          assert.equal(saved.finalSelectionEnabled,false);
          const out={
            result:"DESTINATION_D1_ORIGINAL_ROW_READBACK_PASS",
            marketDate:receipt.marketDate,runId:receipt.runId,
            originalHash:row.check_hash,db:"system2-research",
            accountRole:"DESTINATION",
            selectedCount:null,zeroPickDay:null,
            finalSelectionEnabled:false,
            d1RowsReadForReadback:db.metrics.rowsRead,
          };
          console.log(JSON.stringify(out));
          fs.writeFileSync("/tmp/system2-daily-diagnostic-readback.json",JSON.stringify(out,null,2));
          NODE
      - name: Reconcile shared account D1 budget result
        if: always() && steps.quota.outputs.physical_allowed == 'true'
        uses: ./.github/actions/system2-d1-budget-gate
        with:
          writer_id: DAILY_SHADOW_DIAGNOSTIC
          mode: result
          reservation_receipt_path: ${{ steps.quota.outputs.reservation_receipt_path }}
          execution_outcome: ${{ job.status }}
        env:
          SYSTEM2_D1_ACCOUNT_ROLE: DESTINATION
          SYSTEM2_GITHUB_ENVIRONMENT: system2-schema-only
          S2_SCHEMA_DEST_ACCOUNT_ID: ${{ secrets.S2_SCHEMA_DEST_ACCOUNT_ID }}
          S2_SCHEMA_DEST_D1_WRITE_TOKEN: ${{ secrets.S2_SCHEMA_DEST_D1_WRITE_TOKEN }}
          S2_DEST_ACCOUNT_ANALYTICS_READ_TOKEN: ${{ secrets.S2_DEST_ACCOUNT_ANALYTICS_READ_TOKEN }}
      - name: Preserve execution receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system2-daily-shadow-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/system2-daily-diagnostic.json
            /tmp/system2-daily-diagnostic-readback.json
            /tmp/system2-d1-budget-reservation.json
            /tmp/system2-d1-budget-result.json
          if-no-files-found: warn
          retention-days: 90
