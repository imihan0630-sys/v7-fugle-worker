name: System2 TWTAWU Positive JSON CSV Parity Readonly

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/system2-twtawu-positive-json-csv-parity-readonly.yml"
      - "system2/runtime/twtawu_positive_json_csv_parity_diagnostic_v0_1.mjs"
      - "system2/scripts/probe_twtawu_positive_json_csv_parity_readonly_v0_1.mjs"
      - "system2/tests/twtawu_positive_json_csv_parity_diagnostic_v0_1.test.mjs"

permissions:
  contents: read

concurrency:
  group: system2-twtawu-positive-json-csv-parity-readonly
  cancel-in-progress: false

jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Strict offline positive parity and no-promotion regressions
        run: |
          set -euo pipefail
          node system2/tests/twtawu_positive_json_csv_parity_diagnostic_v0_1.test.mjs
          node --check system2/scripts/probe_twtawu_positive_json_csv_parity_readonly_v0_1.mjs
          git diff --exit-code -- Worker.js wrangler.toml

      - name: Read official bounded 1218 TWTAWU JSON and candidate CSV
        env:
          SYSTEM2_TWTAWU_POSITIVE_PARITY_OUTPUT: /tmp/s2-twtawu-positive-json-csv-parity.json
        run: |
          set -euo pipefail
          node system2/scripts/probe_twtawu_positive_json_csv_parity_readonly_v0_1.mjs

      - name: Preserve positive physical PASS or blocked export contract
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system2-twtawu-positive-parity-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/s2-twtawu-positive-json-csv-parity.json
          if-no-files-found: warn
          retention-days: 90

      - name: Confirm System1 isolation
        if: always()
        run: |
          git diff --exit-code -- Worker.js wrangler.toml
          echo "System1 untouched; no D1/R2/Worker mutation"
