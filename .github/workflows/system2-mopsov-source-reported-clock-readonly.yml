name: System2 MOPSOV Source Reported Clock Readonly

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "system2/runtime/mopsov_source_reported_clock_v0_1.mjs"
      - "system2/tests/mopsov_source_reported_clock_v0_1.test.mjs"
      - "system2/scripts/probe_mopsov_source_reported_clock_readonly_v0_1.mjs"
      - "system2/SYSTEM2_MOPSOV_SOURCE_REPORTED_CLOCK_V0_1.md"
      - ".github/workflows/system2-mopsov-source-reported-clock-readonly.yml"
  push:
    branches: [main]
    paths:
      - "system2/runtime/mopsov_source_reported_clock_v0_1.mjs"
      - "system2/tests/mopsov_source_reported_clock_v0_1.test.mjs"
      - "system2/scripts/probe_mopsov_source_reported_clock_readonly_v0_1.mjs"
      - "system2/SYSTEM2_MOPSOV_SOURCE_REPORTED_CLOCK_V0_1.md"
      - ".github/workflows/system2-mopsov-source-reported-clock-readonly.yml"

permissions:
  contents: read

concurrency:
  group: system2-mopsov-source-reported-clock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run source-reported clock fail-closed tests
        run: node system2/tests/mopsov_source_reported_clock_v0_1.test.mjs

      - name: Physically verify MOPSOV source-reported version clocks
        run: node system2/scripts/probe_mopsov_source_reported_clock_readonly_v0_1.mjs

      - name: Confirm read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -qE 'CLOUDFLARE|SYSTEM2_DB|wrangler|secret|deploy|INSERT|UPDATE|DELETE' system2/scripts/probe_mopsov_source_reported_clock_readonly_v0_1.mjs
          echo "Read-only MOPSOV source-reported clock boundary PASS"
