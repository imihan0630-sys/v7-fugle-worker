name: System2 S2-07 Reference Reconstruction V1.3 Readonly

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "system2/runtime/s2_07_reference_reconstruction_v1_3.mjs"
      - "system2/tests/s2_07_reference_reconstruction_v1_3.test.mjs"
      - "system2/scripts/probe_s2_07_reference_reconstruction_readonly_v1_3.mjs"
      - "system2/SYSTEM2_S2_07_REFERENCE_RECONSTRUCTION_V1_3.md"
      - "system2/evidence/S2_07_TECHNICAL_CONTINUITY_BRIDGE_V1_1_PHYSICAL_20261007.json"
      - "system2/evidence/S2_07_RAW_A1_LINEAGE_V1_0_PHYSICAL_20261007.json"
      - ".github/workflows/system2-s2-07-reference-reconstruction-v1-3-readonly.yml"
  push:
    branches: [main]
    paths:
      - "system2/runtime/s2_07_reference_reconstruction_v1_3.mjs"
      - "system2/tests/s2_07_reference_reconstruction_v1_3.test.mjs"
      - "system2/scripts/probe_s2_07_reference_reconstruction_readonly_v1_3.mjs"
      - "system2/SYSTEM2_S2_07_REFERENCE_RECONSTRUCTION_V1_3.md"
      - "system2/evidence/S2_07_TECHNICAL_CONTINUITY_BRIDGE_V1_1_PHYSICAL_20261007.json"
      - "system2/evidence/S2_07_RAW_A1_LINEAGE_V1_0_PHYSICAL_20261007.json"
      - ".github/workflows/system2-s2-07-reference-reconstruction-v1-3-readonly.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Targeted reconstruction-gate tests
        run: node system2/tests/s2_07_reference_reconstruction_v1_3.test.mjs
      - name: Read-only physical 4806 reconstruction probe
        run: node system2/scripts/probe_s2_07_reference_reconstruction_readonly_v1_3.mjs
      - name: Read-only and System1 isolation guard
        shell: bash
        run: |
          set -euo pipefail
          ! grep -qE '\b(INSERT|UPDATE|DELETE|REPLACE|DROP|ALTER|CREATE)\b' system2/scripts/probe_s2_07_reference_reconstruction_readonly_v1_3.mjs
          ! grep -qE 'wrangler[[:space:]]+(deploy|secret)|secret[[:space:]]+put|workers[[:space:]]+deploy' system2/scripts/probe_s2_07_reference_reconstruction_readonly_v1_3.mjs
          git diff --exit-code -- Worker.js wrangler.toml
          echo "S2-07 reference reconstruction V1.3 read-only/System1 isolation PASS"
