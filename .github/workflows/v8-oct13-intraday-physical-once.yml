name: V8 Oct13 Live Intraday Physical Independent READONLY ONCE
on:
  push:
    branches:
      - ops/v8-oct13-intraday-physical-once-20261013
    paths:
      - .github/workflows/v8-oct13-intraday-physical-once.yml
permissions:
  contents: read
jobs:
  real_readback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Actual V8 09 market live and original Cloudflare Cron readbacks
        run: |
          node tests/test_v8_intraday_monitor_acceptance_readonly.mjs
          node ops/v8_intraday_monitor_acceptance_readonly.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v8-real-market-live-intraday-${{ github.run_id }}
          path: artifacts/v8-intraday-monitor-readback-*.json
          retention-days: 60
          if-no-files-found: error
