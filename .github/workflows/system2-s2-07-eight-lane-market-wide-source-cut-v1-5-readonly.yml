name: System2 S2-07 Eight-Lane Market-Wide Source Cut V1.5 Readonly

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "system2/runtime/s2_07_eight_lane_market_wide_source_cut_v1_5.mjs"
      - "system2/tests/s2_07_eight_lane_market_wide_source_cut_v1_5.test.mjs"
      - "system2/scripts/probe_s2_07_eight_lane_market_wide_source_cut_readonly_v1_5.mjs"
      - "system2/SYSTEM2_S2_07_EIGHT_LANE_MARKET_WIDE_SOURCE_CUT_V1_5.md"
      - ".github/workflows/system2-s2-07-eight-lane-market-wide-source-cut-v1-5-readonly.yml"
  push:
    branches: [main]
    paths:
      - "system2/runtime/s2_07_eight_lane_market_wide_source_cut_v1_5.mjs"
      - "system2/tests/s2_07_eight_lane_market_wide_source_cut_v1_5.test.mjs"
      - "system2/scripts/probe_s2_07_eight_lane_market_wide_source_cut_readonly_v1_5.mjs"
      - "system2/SYSTEM2_S2_07_EIGHT_LANE_MARKET_WIDE_SOURCE_CUT_V1_5.md"
      - ".github/workflows/system2-s2-07-eight-lane-market-wide-source-cut-v1-5-readonly.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: V1.5 contract tests
        run: node system2/tests/s2_07_eight_lane_market_wide_source_cut_v1_5.test.mjs

      - name: Physical eight-lane official source cut
        run: node system2/scripts/probe_s2_07_eight_lane_market_wide_source_cut_readonly_v1_5.mjs

      - name: No mutation / scheduler / System1 authority
        shell: bash
        run: |
          set -euo pipefail
          ! grep -qE '\\b(INSERT|UPDATE|DELETE|REPLACE|DROP|ALTER|CREATE)\\b' system2/scripts/probe_s2_07_eight_lane_market_wide_source_cut_readonly_v1_5.mjs
          ! grep -qE 'wrangler[[:space:]]+(deploy|secret)|secret[[:space:]]+put|workers[[:space:]]+deploy|cron' system2/scripts/probe_s2_07_eight_lane_market_wide_source_cut_readonly_v1_5.mjs
          git diff --exit-code -- Worker.js wrangler.toml

      - name: Upload physical evidence
        uses: actions/upload-artifact@v4
        with:
          name: s2-07-eight-lane-market-wide-source-cut-v1-5
          path: /tmp/S2_07_EIGHT_LANE_MARKET_WIDE_SOURCE_CUT_V1_5_PHYSICAL_20261007.json
          retention-days: 14
