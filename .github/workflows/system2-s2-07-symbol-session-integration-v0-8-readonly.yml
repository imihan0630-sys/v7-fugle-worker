name: System2 S2-07 Symbol Session Integration V0.8 Readonly

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "system2/runtime/s2_07_symbol_session_integration_v0_8.mjs"
      - "system2/tests/s2_07_symbol_session_integration_v0_8.test.mjs"
      - "system2/scripts/probe_s2_07_symbol_session_integration_readonly_v0_8.mjs"
      - "system2/evidence/S2_07_PROMOTION_LINKAGE_V0_7_PHYSICAL_20261006.json"
      - "system2/SYSTEM2_S2_07_SYMBOL_SESSION_INTEGRATION_V0_8.md"
      - ".github/workflows/system2-s2-07-symbol-session-integration-v0-8-readonly.yml"
  push:
    branches: [main]
    paths:
      - "system2/runtime/s2_07_symbol_session_integration_v0_8.mjs"
      - "system2/tests/s2_07_symbol_session_integration_v0_8.test.mjs"
      - "system2/scripts/probe_s2_07_symbol_session_integration_readonly_v0_8.mjs"
      - "system2/evidence/S2_07_PROMOTION_LINKAGE_V0_7_PHYSICAL_20261006.json"
      - "system2/SYSTEM2_S2_07_SYMBOL_SESSION_INTEGRATION_V0_8.md"
      - ".github/workflows/system2-s2-07-symbol-session-integration-v0-8-readonly.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node system2/tests/s2_07_symbol_session_integration_v0_8.test.mjs
      - run: node system2/scripts/probe_s2_07_symbol_session_integration_readonly_v0_8.mjs
      - shell: bash
        run: |
          set -euo pipefail
          ! grep -qE 'CLOUDFLARE|SYSTEM2_DB|wrangler|secret|deploy|INSERT|UPDATE|DELETE' system2/scripts/probe_s2_07_symbol_session_integration_readonly_v0_8.mjs
          echo "S2-07 V0.8 read-only boundary PASS"
