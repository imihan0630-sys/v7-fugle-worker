name: CORR003 Source Account Live Metadata Probe ONCE (syntax-fixed scoped GET)

on:
  push:
    branches:
      - remediation-lane/corr003-source-account-live-readonly-probe-20261011
    paths:
      - ".github/workflows/system2-corr003-source-account-live-readonly-once.yml"

permissions:
  contents: read

concurrency:
  group: corr003-source-account-live-metadata-once
  cancel-in-progress: false

jobs:
  source_metadata:
    if: github.repository == 'imihan0630-sys/v7-fugle-worker' && github.ref == 'refs/heads/remediation-lane/corr003-source-account-live-readonly-probe-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: system2-research
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Inspect old source Cloudflare D1 quota and two Worker schedules (READ ONLY)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node system2/remediation/run_corr003_source_account_metadata_once_v0_1.mjs
      - name: Preserve sanitised provider receipt even on partial metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corr003-source-account-live-metadata-${{ github.run_id }}
          path: /tmp/corr003-source-account-live-readonly.json
          if-no-files-found: warn
          retention-days: 7
      - name: Guard no System1 Formal/runtime modifications
        if: always()
        run: |
          git diff --exit-code -- Worker.js wrangler.toml
