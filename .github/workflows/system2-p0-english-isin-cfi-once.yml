name: System2 P0 Free English Official ISIN CFI Fallback ONCE
on:
  push:
    branches: [main]
    paths: ['.github/workflows/system2-p0-english-isin-cfi-once.yml']
permissions:
  contents: read
  actions: read
jobs:
  bounded_english_probe:
    if: github.repository == 'imihan0630-sys/v7-fugle-worker' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify CFI source parser and immutable no-promotion
        run: |
          set -euo pipefail
          node --test system2/tests/official_isin_cfi_readonly_v0_1.test.mjs
          git diff --exit-code -- Worker.js wrangler.toml
      - name: Download exact previously validated V0.2 original Chinese watch
        uses: actions/download-artifact@v4
        with:
          run-id: 38477169340
          name: s2-v02-tdr-filtered-observation-38477169340
          path: /tmp/s2-watch
          github-token: ${{ github.token }}
      - name: Resolve one and only one original signed watch receipt
        run: |
          set -euo pipefail
          test "$(find /tmp/s2-watch -type f -name preliminary-pv-watch.json | wc -l)" -eq 1
          F="$(find /tmp/s2-watch -type f -name preliminary-pv-watch.json -print -quit)"
          test -s "$F"
          echo "S2_V02_WATCH_RECEIPT=$F" >> "$GITHUB_ENV"
      - name: Probe current English native ISIN CFI, 18s per market
        run: |
          set -euo pipefail
          node system2/scripts/probe_current_isin_cfi_readonly_v0_1.mjs
      - name: Verify still not retrospective PIT/common-share or formal selected
        run: |
          set -euo pipefail
          F=/tmp/s2-current-cfi/receipt.json
          test -s "$F"
          test "$(jq -r .previewCount "$F")" = '30'
          test "$(jq -r .historicalSecurityClassPITCertified "$F")" = 'false'
          test "$(jq -r .currentRegistryEnglishNameNotChineseComparable "$F")" = 'true'
          test "$(jq -r .selectedCount "$F")" = 'null'
          test "$(jq -r .frozenWritten "$F")" = 'false'
      - name: Preserve sanitized current CFI status/hash, no original source page
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s2-English-ISIN-CFI-${{ github.run_id }}
          path: /tmp/s2-current-cfi/receipt.json
          retention-days: 7
          if-no-files-found: warn
