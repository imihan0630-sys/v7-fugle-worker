name: System2 MOPSOV High Row Pagination Stress Readonly

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "system2/runtime/mops_revision_source_capability_v0_1.mjs"
      - "system2/scripts/probe_mopsov_high_row_pagination_stress_readonly_v0_1.mjs"
      - "system2/SYSTEM2_MOPSOV_HIGH_ROW_PAGINATION_STRESS_V0_1.md"
      - ".github/workflows/system2-mopsov-high-row-pagination-stress-readonly.yml"
  push:
    branches: [main]
    paths:
      - "system2/runtime/mops_revision_source_capability_v0_1.mjs"
      - "system2/scripts/probe_mopsov_high_row_pagination_stress_readonly_v0_1.mjs"
      - "system2/SYSTEM2_MOPSOV_HIGH_ROW_PAGINATION_STRESS_V0_1.md"
      - ".github/workflows/system2-mopsov-high-row-pagination-stress-readonly.yml"

permissions:
  contents: read

concurrency:
  group: system2-mopsov-high-row-pagination-stress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Stress high-row MOPSOV query and month-shard reconciliation
        run: node system2/scripts/probe_mopsov_high_row_pagination_stress_readonly_v0_1.mjs

      - name: Confirm read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -qE 'CLOUDFLARE|SYSTEM2_DB|wrangler|secret|deploy|INSERT|UPDATE|DELETE' system2/scripts/probe_mopsov_high_row_pagination_stress_readonly_v0_1.mjs
          echo "Read-only MOPSOV high-row pagination stress boundary PASS"
