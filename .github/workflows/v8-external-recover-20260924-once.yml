name: V8 External Plan Recovery 2026-09-24
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v8-external-recover-20260924-once.yml"
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and recover staged external plan exactly once
        env:
          V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
        run: |
          node - <<'NODE'
          const origin='https://fugle-test.imihan0630.workers.dev';
          const headers={'x-admin-token':process.env.V7_ADMIN_TOKEN,'content-type':'application/json','accept':'application/json'};
          const response=await fetch(origin+'/api/three-min/recover-current',{method:'POST',headers,body:'{}',signal:AbortSignal.timeout(90000)});
          const text=await response.text();
          console.log(JSON.stringify({status:response.status,contentType:response.headers.get('content-type'),bodyPrefix:text.slice(0,2000).replace(/\s+/g,' ')}));
          if(!response.ok) throw new Error('external plan recovery failed');
          const result=JSON.parse(text);
          if(result.ok!==true || result.threeMinVerified!==true) throw new Error('external plan not verified');
          NODE
