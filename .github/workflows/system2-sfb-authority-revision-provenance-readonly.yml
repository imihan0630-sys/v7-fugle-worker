name: System2 SFB Authority Revision Provenance Readonly

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "system2/scripts/probe_sfb_authority_revision_provenance_readonly_v0_1.py"
      - "system2/SYSTEM2_AUTHORITY_REVISION_PROVENANCE_ROUTING_V0_1.md"
      - ".github/workflows/system2-sfb-authority-revision-provenance-readonly.yml"
  push:
    branches: [main]
    paths:
      - "system2/scripts/probe_sfb_authority_revision_provenance_readonly_v0_1.py"
      - "system2/SYSTEM2_AUTHORITY_REVISION_PROVENANCE_ROUTING_V0_1.md"
      - ".github/workflows/system2-sfb-authority-revision-provenance-readonly.yml"

permissions:
  contents: read

concurrency:
  group: system2-sfb-authority-revision-provenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe official SFB/FSC authority-side revision evidence
        run: python system2/scripts/probe_sfb_authority_revision_provenance_readonly_v0_1.py

      - name: Confirm read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -qE 'CLOUDFLARE|SYSTEM2_DB|wrangler|secret|deploy|INSERT|UPDATE|DELETE' system2/scripts/probe_sfb_authority_revision_provenance_readonly_v0_1.py
          echo "Read-only SFB authority revision provenance boundary PASS"
