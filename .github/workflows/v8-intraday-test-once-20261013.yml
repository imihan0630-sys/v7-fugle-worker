name: V8 Intraday Acceptance Adversarial Tests ONE SHOT Oct13
on:
  push:
    branches:
      - fix/system1-daily-live-monitor-acceptance-20261013
    paths:
      - .github/workflows/v8-intraday-test-once-20261013.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Physical original branch code runtime tests for live monitor acceptance
        run: |
          node --check ops/v8_intraday_monitor_acceptance_readonly.mjs
          node tests/test_v8_intraday_monitor_acceptance_readonly.mjs
