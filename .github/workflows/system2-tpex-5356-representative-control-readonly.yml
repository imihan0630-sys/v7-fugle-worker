name: System2 TPEx 5356 Representative Control Readonly

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "system2/runtime/mops_revision_control_matrix_v0_5.mjs"
      - "system2/runtime/revision_authority_provenance_matrix_v0_4.mjs"
      - "system2/runtime/supplemental_revision_provenance_receipt_v0_4.mjs"
      - "system2/tests/mops_revision_control_matrix_v0_5.test.mjs"
      - "system2/tests/revision_authority_provenance_matrix_v0_4.test.mjs"
      - "system2/tests/supplemental_revision_provenance_receipt_v0_4.test.mjs"
      - "system2/scripts/probe_tpex_5356_representative_control_readonly_v0_1.mjs"
      - "system2/SYSTEM2_TPEX_5356_REPRESENTATIVE_CONTROL_V0_1.md"
      - ".github/workflows/system2-tpex-5356-representative-control-readonly.yml"
  push:
    branches: [main]
    paths:
      - "system2/runtime/mops_revision_control_matrix_v0_5.mjs"
      - "system2/runtime/revision_authority_provenance_matrix_v0_4.mjs"
      - "system2/runtime/supplemental_revision_provenance_receipt_v0_4.mjs"
      - "system2/tests/mops_revision_control_matrix_v0_5.test.mjs"
      - "system2/tests/revision_authority_provenance_matrix_v0_4.test.mjs"
      - "system2/tests/supplemental_revision_provenance_receipt_v0_4.test.mjs"
      - "system2/scripts/probe_tpex_5356_representative_control_readonly_v0_1.mjs"
      - "system2/SYSTEM2_TPEX_5356_REPRESENTATIVE_CONTROL_V0_1.md"
      - ".github/workflows/system2-tpex-5356-representative-control-readonly.yml"

permissions:
  contents: read

concurrency:
  group: system2-tpex-5356-representative-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run MOPS V0.5 tests
        run: node system2/tests/mops_revision_control_matrix_v0_5.test.mjs
      - name: Run authority V0.4 tests
        run: node system2/tests/revision_authority_provenance_matrix_v0_4.test.mjs
      - name: Run receipt V0.4 tests
        run: node system2/tests/supplemental_revision_provenance_receipt_v0_4.test.mjs
      - name: Physically verify 5356 TPEx dividend representative control
        run: node system2/scripts/probe_tpex_5356_representative_control_readonly_v0_1.mjs
      - name: Confirm read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -qE 'CLOUDFLARE|SYSTEM2_DB|wrangler|secret|deploy|INSERT|UPDATE|DELETE' system2/scripts/probe_tpex_5356_representative_control_readonly_v0_1.mjs
          echo "Read-only 5356 representative-control boundary PASS"
