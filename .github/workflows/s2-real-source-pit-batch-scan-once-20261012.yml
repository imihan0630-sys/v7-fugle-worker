name: S2 Original Encrypted Source PIT Batch Read ONLY Once 20261012
# Main-once offline audit in existing DEST protected environment. No cloud D1 SQL write.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/s2-real-source-pit-batch-scan-once-20261012.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: s2-actual-source-original-pit-batch-read-only-once-20261012
  cancel-in-progress: false
jobs:
  source_original_offline_pit:
    runs-on: ubuntu-latest
    environment: system2-schema-only
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Syntax checks and original source audit negative safety
        run: |
          set -euo pipefail
          python3 -m py_compile system2/migration/issue1068_real_archive_pit_batch_plan_offline_v0_1.py
          node --check system2/migration/secure_cross_environment_sql_transfer_20261011.mjs
          git diff --exit-code -- Worker.js wrangler.toml
      - name: Download existing token-sealed RSA private/public key encrypted artifact ONLY
        uses: actions/download-artifact@v4
        with:
          name: s2-dest-protected-rsa-public-sealed-private-38151167952
          run-id: 38151167952
          github-token: ${{ github.token }}
          repository: imihan0630-sys/v7-fugle-worker
          path: /tmp/s2-bridge-input/destkey
      - name: Download existing original RSA-wrapped AES-GCM encrypted SOURCE SQL ONLY
        uses: actions/download-artifact@v4
        with:
          name: s2-source-sql-rsa-wrapped-gcm-transfer-38151167952
          run-id: 38151167952
          github-token: ${{ github.token }}
          repository: imihan0630-sys/v7-fugle-worker
          path: /tmp/s2-bridge-input/transfer
      - name: REAL original source PIT and complete-batch offline scan plus destination empty readback
        env:
          S2_SCHEMA_DEST_ACCOUNT_ID: ${{ secrets.S2_SCHEMA_DEST_ACCOUNT_ID }}
          S2_SCHEMA_DEST_D1_WRITE_TOKEN: ${{ secrets.S2_SCHEMA_DEST_D1_WRITE_TOKEN }}
        run: node system2/migration/secure_cross_environment_sql_transfer_20261011.mjs DEST_PIT_PLAN
      - name: Retain sanitized original readback and full batch-metadata hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s2-original-source-pit-batches-sanitized-${{ github.run_id }}
          path: |
            /tmp/s2-secure-d1-bridge/destination-pit-plan-receipt.json
            /tmp/s2-secure-d1-bridge/sanitized-source-pit-batch-plan.json
          if-no-files-found: warn
          retention-days: 30
      - name: Strict migration scope
        if: always()
        run: echo 'Read-only ORIGINAL source archive offline PIT self-report scan. NOT AUDIT PASS, NOT any destination D1 import, R2 entitlement, Worker or Cron deployment.' >> "$GITHUB_STEP_SUMMARY"
