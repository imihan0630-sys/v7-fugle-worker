name: D08 TWSE Daily Valuation Year Pack

on:
  pull_request:
    paths:
      - ".github/workflows/d08-twse-daily-valuation-year-pack.yml"
      - "system2/runtime/d08_twse_daily_valuation_year_pack_v0_1.mjs"
      - "system2/runtime/d08_historical_valuation_percentile_engine_v0_1.mjs"
      - "system2/runtime/d08_historical_valuation_percentile_snapshot_v0_1.mjs"
      - "system2/scripts/d08_twse_daily_valuation_year_pack_capture_v0_1.mjs"
      - "system2/tests/d08_daily_valuation_year_pack.test.mjs"
      - "system2/tests/d08_daily_valuation_year_pack_guard.test.mjs"
      - "system2/tests/d08_historical_valuation_percentile_engine.test.mjs"
      - "system2/tests/d08_historical_valuation_percentile_snapshot.test.mjs"
      - "system2/runtime/official_historical_a6_valuation_v0_1.mjs"
      - "system2/tests/d08_historical_valuation_source_core.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d08-daily-valuation-year-pack-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture-years:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        year: [2026]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: system2-research
    env:
      D08_YEAR: "${{ matrix.year }}"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Guard D08 year-pack boundary
        run: |
          set -euo pipefail
          node system2/tests/d08_historical_valuation_source_core.test.mjs
          node system2/tests/d08_daily_valuation_year_pack.test.mjs
          node system2/tests/d08_historical_valuation_percentile_engine.test.mjs
          node system2/tests/d08_historical_valuation_percentile_snapshot.test.mjs
          node system2/tests/d08_daily_valuation_year_pack_guard.test.mjs
          node --check system2/scripts/d08_twse_daily_valuation_year_pack_capture_v0_1.mjs
          git diff --exit-code -- Worker.js wrangler.toml
      - name: Capture immutable TWSE daily valuation year pack
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_R2_ACCESS_KEY_ID: ${{ secrets.SYSTEM2_R2_ACCESS_KEY_ID }}
          SYSTEM2_R2_SECRET_ACCESS_KEY: ${{ secrets.SYSTEM2_R2_SECRET_ACCESS_KEY }}
          SYSTEM2_R2_BUCKET: ${{ vars.SYSTEM2_R2_BUCKET }}
        run: |
          set -euo pipefail
          node system2/scripts/d08_twse_daily_valuation_year_pack_capture_v0_1.mjs | tee "/tmp/d08-year-${D08_YEAR}.jsonl"
      - name: Production isolation guard
        run: |
          set -euo pipefail
          git diff --exit-code -- Worker.js wrangler.toml
          echo "D08 research-only year-pack isolation PASS for ${D08_YEAR}"
