name: D02 PVE268 Cross-System D1 Quota Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/d02_pve268_cross_system_d1_quota_acceptance_v0_1.mjs"
      - "tests/test_d02_pve268_cross_system_d1_quota_acceptance_v0_1.mjs"
      - ".github/workflows/d02-pve268-cross-system-d1-quota-acceptance.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/test_d02_pve268_cross_system_d1_quota_acceptance_v0_1.mjs
