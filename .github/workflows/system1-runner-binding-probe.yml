name: System1 Runner Binding Probe

on:
  push:
    branches: [main]
    paths:
      - "ops/system1_runner_binding_probe.mjs"
      - ".github/workflows/system1-runner-binding-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe System1 binding identifiers only
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node ops/system1_runner_binding_probe.mjs
