name: System2 SOURCE D1 ENCRYPTED Full Physical Backup Once 20261011
# Branch-only, owner approved SOURCE old D1 system2-research, never V8.
# NEVER merge this auto-trigger workflow into main.
on:
  push:
    branches: [s2-source-native-d1-export-encrypted-20261011]
    paths: [.github/workflows/s2-source-native-d1-encrypted-backup-once-20261011.yml]
permissions:
  contents: read
concurrency:
  group: s2-source-d1-owner-backup-single-20261011
  cancel-in-progress: false
jobs:
  source_backup:
    if: github.event.head_commit.message == 'S2_OWNER_FULL_SOURCE_D1_EXPORT_ENCRYPT_ONLY_20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    environment: system2-research
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Verify owner quota waiver, old S2 writer quarantine, V8 file and source deployment safeguards
        run: |
          set -euo pipefail
          node --check system2/migration/source_native_d1_temporary_encrypted_export_20261011.mjs
          node -e "const fs=require('node:fs');const w=fs.readFileSync('.github/workflows/system2-resonance-deploy.yml','utf8');const q=require('./system2/config/source_account_d1_writer_quarantine_v0_1.json');const v=require('./system2/evidence/S2_CORR_20261007_003_SYSTEM1_AFTER_MARKET_RESERVE_POLICY_V0_1.json');if(!q.active||q.automaticRelease!==false||!v.ownerV8ExtraQuotaReserveWaived||!w.includes('if: '+String.fromCharCode(36)+'{{ false }}'))process.exit(2)"
          git diff --exit-code -- Worker.js wrangler.toml
      - name: Cloudflare native S2 D1 full export, encrypt before public artifact, isolated offline restore
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node system2/migration/source_native_d1_temporary_encrypted_export_20261011.mjs
      - name: Upload sanitized receipt and only encrypted compressed archive under 65 MB cap
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s2-source-private-encrypted-backup-${{ github.run_id }}
          path: |
            /tmp/s2-source-private-encrypted-export/sanitized-backup-receipt.json
            /tmp/s2-source-private-encrypted-export/*.aes256gcm
          if-no-files-found: warn
          retention-days: 14
      - name: Never assert a completed destination import
        if: always()
        run: echo 'Only SOURCE D1 export and local encrypted private archive with existing token is possible; does not import new D1, activate R2/Worker/Cron or change V8. Key restore depends on preserving original source D1 token.' >> "$GITHUB_STEP_SUMMARY"
