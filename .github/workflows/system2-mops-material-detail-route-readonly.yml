name: System2 MOPS Material Detail Route Readonly

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "system2/scripts/probe_mops_material_detail_route_readonly_v0_1.mjs"
      - ".github/workflows/system2-mops-material-detail-route-readonly.yml"
  push:
    branches: [main]
    paths:
      - "system2/scripts/probe_mops_material_detail_route_readonly_v0_1.mjs"
      - ".github/workflows/system2-mops-material-detail-route-readonly.yml"

permissions:
  contents: read

concurrency:
  group: system2-mops-material-detail-route-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detail-route:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe official MOPS material detail route
        run: node system2/scripts/probe_mops_material_detail_route_readonly_v0_1.mjs
      - name: Confirm read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -qE 'CLOUDFLARE|SYSTEM2_DB|wrangler|secret|deploy|INSERT|UPDATE|DELETE' system2/scripts/probe_mops_material_detail_route_readonly_v0_1.mjs
          echo "Read-only MOPS material-detail route boundary PASS"
