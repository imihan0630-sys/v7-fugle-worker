name: V8 Commit 2026-09-24 Formal Plans
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v8-commit-20260924-formal-once.yml"
permissions:
  contents: read
jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recompute read-only and commit exact Formal plans
        env:
          V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
        run: |
          node - <<'NODE'
          const origin='https://fugle-test.imihan0630.workers.dev';
          const headers={'x-admin-token':process.env.V7_ADMIN_TOKEN,'content-type':'application/json','accept':'application/json'};
          const previewResponse=await fetch(origin+'/api/scan-preview',{method:'POST',headers,body:JSON.stringify({dryRun:true,marketDate:'2026-09-24'}),signal:AbortSignal.timeout(180000)});
          const preview=await previewResponse.json();
          if(!previewResponse.ok) throw new Error('preview failed '+JSON.stringify(preview).slice(0,500));
          if(preview.scanDate!=='2026-09-24') throw new Error('wrong scan date');
          if(!Array.isArray(preview.stocks) || preview.stocks.length>3) throw new Error('invalid Formal general pool');
          if((preview.thousandStockPool?.stocks||[]).length>3) throw new Error('invalid Formal thousand pool');
          const formal=[...preview.stocks,...(preview.thousandStockPool?.stocks||[])];
          if(formal.some(x=>!['FORMAL_GENERAL','FORMAL_THOUSAND'].includes(x.strategyPool))) throw new Error('unexpected strategy pool');
          const save=await fetch(origin+'/api/config',{method:'POST',headers,body:JSON.stringify({stocks:formal}),signal:AbortSignal.timeout(45000)});
          const saved=await save.json();
          if(!save.ok || saved.verified!==true) throw new Error('config save failed '+JSON.stringify(saved).slice(0,500));
          const verify=await fetch(origin+'/api/config',{headers,signal:AbortSignal.timeout(45000)});
          const actual=await verify.json();
          const expectedSymbols=formal.map(x=>String(x.symbol));
          const actualSymbols=(actual.stocks||[]).map(x=>String(x.symbol));
          if(JSON.stringify(expectedSymbols)!==JSON.stringify(actualSymbols)) throw new Error('readback mismatch '+JSON.stringify({expectedSymbols,actualSymbols}));
          console.log(JSON.stringify({ok:true,scanDate:preview.scanDate,formalGeneral:preview.stocks.map(x=>({symbol:x.symbol,name:x.name,signalLevel:x.signalLevel,buyLow:x.buyLow,buyHigh:x.buyHigh,stop:x.stop,profitCheck:x.profitCheck})),formalThousand:(preview.thousandStockPool?.stocks||[]).map(x=>({symbol:x.symbol,name:x.name})),hybridSelected:(preview.hybridStocks||[]).map(x=>({symbol:x.symbol,name:x.name})),hybridWatch:preview.diagnostics?.hybridWatch?.shortlist||[],savedSymbols:actualSymbols}));
          NODE
