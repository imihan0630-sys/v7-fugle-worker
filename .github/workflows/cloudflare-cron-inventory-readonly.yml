name: Cloudflare Cron Inventory Readonly

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-cron-inventory-readonly.yml"

permissions:
  contents: read

concurrency:
  group: cloudflare-cron-inventory-readonly
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Read-only Cloudflare Worker Cron inventory
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKERS_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const accountId=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.WORKERS_API_TOKEN;
          const origin="https://api.cloudflare.com/client/v4";

          if(!accountId||!token) throw new Error("Cloudflare read credentials are required");

          async function get(path){
            const r=await fetch(origin+path,{
              method:"GET",
              headers:{authorization:`Bearer ${token}`,accept:"application/json"},
              signal:AbortSignal.timeout(45000)
            });
            const text=await r.text();
            let data=null;
            try{data=JSON.parse(text)}catch{}
            if(!r.ok||data?.success===false){
              throw new Error(`GET ${path.replace(accountId,"<account>")} HTTP ${r.status}: ${data?.errors?.[0]?.message||text.slice(0,300)}`);
            }
            return data?.result;
          }

          const scriptsResult=await get(`/accounts/${accountId}/workers/scripts`);
          const scripts=Array.isArray(scriptsResult)?scriptsResult:[];
          const inventory=[];

          for(const script of scripts){
            const name=script?.id;
            if(!name) continue;
            const raw=await get(`/accounts/${accountId}/workers/scripts/${encodeURIComponent(name)}/schedules`);
            const schedules=Array.isArray(raw)?raw:Array.isArray(raw?.schedules)?raw.schedules:[];
            if(schedules.length){
              inventory.push({
                worker:name,
                cronCount:schedules.length,
                crons:schedules.map(x=>x?.cron).filter(Boolean).sort()
              });
            }
          }

          inventory.sort((a,b)=>a.worker.localeCompare(b.worker));
          const totalCronTriggers=inventory.reduce((sum,x)=>sum+x.cronCount,0);
          console.log(JSON.stringify({
            result:"PASS",
            mutationPerformed:false,
            workerCountWithCron:inventory.length,
            totalCronTriggers,
            inventory
          },null,2));
          NODE

      - name: Read-only System1 Worker invocation telemetry
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WORKER_NAME: fugle-test
        run: node ops/cloudflare_worker_invocations_readonly.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system1-worker-invocations-${{ github.run_id }}
          path: artifacts/system1-worker-invocations-*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Confirm inventory workflow is read-only
        run: |
          set -euo pipefail
          ! grep -Eiq 'method:"(POST|PUT|PATCH|DELETE)"|wrangler[[:space:]]+(deploy|delete)|secret[[:space:]]+put|schedules.*(POST|PUT|DELETE)' .github/workflows/cloudflare-cron-inventory-readonly.yml
          ! grep -Eiq 'method:"(PUT|PATCH|DELETE)"|wrangler[[:space:]]+(deploy|delete)|secret[[:space:]]+put|/schedules' ops/cloudflare_worker_invocations_readonly.mjs
          echo "Cloudflare Cron inventory mutation guard PASS"
