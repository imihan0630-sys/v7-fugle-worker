name: System2 NC-T01 Physical Readonly V0.2

on:
  workflow_dispatch:
    inputs:
      market_date:
        description: "YYYY-MM-DD market date"
        required: true
        type: string
      decision_timestamp:
        description: "Optional exact ISO decision timestamp for replay/receipt binding"
        required: false
        type: string
      continuity_receipt_path:
        description: "Repo-local real continuity receipt JSON path"
        required: true
        type: string
      batch_size:
        description: "Remote D1 PIT prefetch batch size"
        required: false
        default: "25"
        type: string

permissions:
  contents: read

concurrency:
  group: system2-nct01-physical-readonly-v0-2
  cancel-in-progress: false

jobs:
  physical-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: system2-research
    steps:
      - name: Checkout exact execution head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate bounded physical inputs
        id: inputs
        env:
          INPUT_MARKET_DATE: ${{ inputs.market_date }}
          INPUT_DECISION_TIMESTAMP: ${{ inputs.decision_timestamp }}
          INPUT_CONTINUITY_RECEIPT_PATH: ${{ inputs.continuity_receipt_path }}
          INPUT_BATCH_SIZE: ${{ inputs.batch_size }}
        run: |
          set -euo pipefail
          market_date="$INPUT_MARKET_DATE"
          [[ "$market_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          batch_size="${INPUT_BATCH_SIZE:-25}"
          [[ "$batch_size" =~ ^[0-9]+$ ]]
          test "$batch_size" -ge 1
          test "$batch_size" -le 100
          test -n "$INPUT_CONTINUITY_RECEIPT_PATH"
          case "$INPUT_CONTINUITY_RECEIPT_PATH" in
            /*|../*|*/../*|*"/.." ) echo "continuity path must remain repo-local"; exit 1 ;;
          esac
          test -f "$INPUT_CONTINUITY_RECEIPT_PATH"
          {
            echo "market_date=$market_date"
            echo "decision_timestamp=$INPUT_DECISION_TIMESTAMP"
            echo "continuity_receipt_path=$INPUT_CONTINUITY_RECEIPT_PATH"
            echo "batch_size=$batch_size"
          } >> "$GITHUB_OUTPUT"

      - name: Static runtime-guard prerequisites
        run: |
          set -euo pipefail
          node --check system2/scripts/run_nct01_physical_artifact_readonly_v0_1.mjs
          node --check system2/runtime/nct01_runtime_guard_v0_1.mjs
          grep -q 'createNcT01RuntimeGuardV0_1' system2/scripts/run_nct01_physical_artifact_readonly_v0_1.mjs
          grep -q 'runtime guard ledger drifted after hidden-fallback audit cut' system2/scripts/run_nct01_physical_artifact_readonly_v0_1.mjs
          ! grep -q 'function sameCutRuntimeEvidence' system2/scripts/run_nct01_physical_artifact_readonly_v0_1.mjs
          echo "Physical wrapper static guard prerequisites PASS"

      - name: Run real guarded NC-T01 artifact path
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
          MARKET_DATE: ${{ steps.inputs.outputs.market_date }}
          DECISION_TIMESTAMP: ${{ steps.inputs.outputs.decision_timestamp }}
          CONTINUITY_RECEIPT_PATH: ${{ steps.inputs.outputs.continuity_receipt_path }}
          BATCH_SIZE: ${{ steps.inputs.outputs.batch_size }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$SYSTEM2_CLOUDFLARE_API_TOKEN"
          args=(
            --market-date "$MARKET_DATE"
            --continuity-receipt-path "$CONTINUITY_RECEIPT_PATH"
            --batch-size "$BATCH_SIZE"
            --output system2/evidence/nct01-physical-readonly-v0-2-output.json
          )
          if [ -n "$DECISION_TIMESTAMP" ]; then
            args+=(--decision-timestamp "$DECISION_TIMESTAMP")
          fi
          node system2/scripts/run_nct01_physical_artifact_readonly_v0_1.mjs "${args[@]}"             | tee /tmp/system2-nct01-physical-readonly-v0-2.log

      - name: Verify measured guard and physical fail-closed boundaries
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const d=JSON.parse(
            fs.readFileSync("system2/evidence/nct01-physical-readonly-v0-2-output.json","utf8"),
          );
          const guard=d.runtimeGuard;
          const ledger=guard?.ledger;
          const runtime=guard?.runtimeEvidence;
          if(!guard||!ledger||!runtime) throw new Error("runtime guard evidence missing");
          if(ledger.guardComplete!==true) throw new Error("runtime guard incomplete");
          if(runtime.instrumented!==true||runtime.sameExecutionCut!==true) {
            throw new Error("runtime guard not same-cut instrumented");
          }
          if(runtime.runtimeForbiddenAccessCount!==0) {
            throw new Error("forbidden runtime access observed");
          }
          if(!/^[a-f0-9]{64}$/.test(runtime.runtimeEvidenceDigest||"")) {
            throw new Error("runtime evidence digest missing");
          }

          if(ledger.d1?.databaseName!=="system2-research") throw new Error("wrong D1 database");
          if(!/^[a-f0-9]{64}$/.test(ledger.d1?.databaseIdentityDigest||"")) {
            throw new Error("D1 immutable identity digest missing");
          }
          if(ledger.d1?.rejectedMutationAttemptCount!==0) throw new Error("D1 mutation attempt observed");
          if(ledger.d1?.rowsWritten!==0) throw new Error("D1 write observed");
          if(ledger.network?.forbiddenOriginAttemptCount!==0) throw new Error("forbidden origin observed");
          if(ledger.capabilities?.forbiddenCapabilityAttemptCount!==0) {
            throw new Error("forbidden capability observed");
          }

          const audit=d.hiddenFallbackAudit?.audit;
          if(!audit) throw new Error("hidden-fallback audit missing");
          if(audit.auditState!=="CLEAN_PROVEN_ABSENT") throw new Error("hidden-fallback audit not clean");
          if(audit.runnerHeadSha!==process.env.GITHUB_SHA) throw new Error("hidden audit HEAD mismatch");
          if(!Array.isArray(audit.auditedBlobIdentities)||audit.auditedBlobIdentities.length<1) {
            throw new Error("transitive graph manifest missing");
          }
          if(audit.runtimeEvidence?.runtimeEvidenceDigest!==runtime.runtimeEvidenceDigest) {
            throw new Error("runtime guard digest is not bound into hidden audit");
          }
          if(audit.runtimeEvidence?.runtimeForbiddenAccessCount!==0) {
            throw new Error("hidden audit reports forbidden access");
          }

          if(d.d1Metrics?.rowsWritten!==0) throw new Error("post-run D1 write readback nonzero");
          const safety=d.safety||{};
          if(safety.databaseName!=="system2-research") throw new Error("safety D1 identity mismatch");
          if(safety.d1PersistenceExecuted!==false) throw new Error("persistence execution mismatch");
          if(safety.system1RuntimeUsed!==false) throw new Error("System1 runtime boundary mismatch");
          if(safety.finalSelectionEnabled!==false||safety.livePushEnabled!==false) {
            throw new Error("selection/push authority mismatch");
          }
          if(safety.capitalImpact!==false||safety.orderImpact!==false) {
            throw new Error("capital/order authority mismatch");
          }

          const p=d.physicalEvidence;
          const receipt=d.physicalReceipt;
          if(!p||!receipt) throw new Error("physical evidence/receipt missing");
          if(p.hiddenFallbackRuntimeForbiddenAccessCount!==0) {
            throw new Error("physical evidence forbidden-access count mismatch");
          }
          if(p.hiddenFallbackAuditIntegrityValid!==true) {
            throw new Error("physical evidence hidden audit integrity mismatch");
          }

          if(d.acceptanceState==="PENDING_00_INDEPENDENT_REVIEW"){
            if(d.continuityReceiptInput?.supplied!==true||d.continuityReceiptInput?.count<1) {
              throw new Error("physical candidate lacks supplied real continuity receipt");
            }
            if((p.strategyExecutableSymbolCount||0)<1) {
              throw new Error("physical candidate lacks W1 strategy-executable witness");
            }
            if(receipt.resultClassification!=="PHYSICALLY_INDEPENDENT_PATH_OBSERVED") {
              throw new Error("physical classification mismatch");
            }
          } else {
            if(d.acceptanceState!=="EVIDENCE_INCOMPLETE") {
              throw new Error("unsupported acceptance state: "+d.acceptanceState);
            }
            if(receipt.resultClassification==="PHYSICALLY_INDEPENDENT_PATH_OBSERVED") {
              throw new Error("incomplete run cannot claim physical independence");
            }
          }

          console.log(JSON.stringify({
            result:"PASS",
            acceptanceState:d.acceptanceState,
            marketDate:d.marketDate,
            continuityReceiptCount:d.continuityReceiptInput?.count||0,
            strategyExecutableSymbolCount:p.strategyExecutableSymbolCount||0,
            allowedReadQueryCount:ledger.d1.allowedReadQueryCount,
            allowedNetworkRequestCount:ledger.network.allowedNetworkRequestCount,
            runtimeEvidenceDigest:runtime.runtimeEvidenceDigest,
            hiddenAuditDigest:audit.auditDigest,
            finalReceiptHash:receipt.receiptHash,
          },null,2));
          NODE

      - name: Confirm System1 production files untouched
        run: |
          set -euo pipefail
          git diff --exit-code HEAD^ HEAD -- Worker.js wrangler.toml || {
            echo "System1 production files changed in execution head"
            exit 1
          }
          echo "System1 production files unchanged PASS"

      - name: Upload physical NC-T01 evidence
        uses: actions/upload-artifact@v4
        with:
          name: system2-nct01-physical-readonly-v0-2
          path: |
            system2/evidence/nct01-physical-readonly-v0-2-output.json
            /tmp/system2-nct01-physical-readonly-v0-2.log
          if-no-files-found: error
          retention-days: 30
