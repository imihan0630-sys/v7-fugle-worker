name: D02 PVE274 H003 Baseline Symmetry Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/d02_pve274_h003_baseline_symmetry_gate_v0_1.mjs"
      - "tests/test_d02_pve274_h003_baseline_symmetry_gate_v0_1.mjs"
      - ".github/workflows/d02-pve274-h003-baseline-symmetry.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/test_d02_pve274_h003_baseline_symmetry_gate_v0_1.mjs
