name: S2 DATA #1068 Oct15 Postwriter Destination D1 SELECT Only
# One-shot path-scoped provider readback, deliberately distinct from raw-copy producer.
# Runs after merge touching ONLY this workflow; never a schedule or same-day D1 writer.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/system2-data-issue1068-oct15-dest-readback-once.yml

permissions:
  contents: read

concurrency:
  group: s2-data-issue1068-oct15-independent-destination-count-readback
  cancel-in-progress: false

jobs:
  dest_readback:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: system2-schema-only
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Fail-closed read-only source-code guards and syntax
        run: |
          set -euo pipefail
          node --check system2/migration/destination_raw_a1_live_readback_once_20261012.mjs
          node system2/tests/destination_raw_a1_live_readback_scope_20261012.test.mjs
          node system2/tests/issue1068_oct15_dest_count_readback_scope_v0_1.test.mjs
          git diff --exit-code -- Worker.js wrangler.toml
      - name: Original Cloudflare DEST account only, GET metadata and one SQL SELECT
        env:
          S2_SCHEMA_DEST_ACCOUNT_ID: ${{ secrets.S2_SCHEMA_DEST_ACCOUNT_ID }}
          S2_SCHEMA_DEST_D1_WRITE_TOKEN: ${{ secrets.S2_SCHEMA_DEST_D1_WRITE_TOKEN }}
        run: node system2/migration/destination_raw_a1_live_readback_once_20261012.mjs
      - name: Archive sanitized actual-provider counts and metering
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s2-data-issue1068-oct15-dest-count-readonly-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/s2-copy-live-readback/sanitized-original-provider-readback.json
          if-no-files-found: warn
          retention-days: 90
      - name: Explicit no-acceptance-promotion notice
        if: always()
        run: |
          echo 'Separate DEST physical count-only evidence, not raw bar payload hash equality, source PIT, Frozen, R2 or full migration acceptance.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No D1 writes; no source account queries; no Worker/Cron or System1 V8 changes.' >> "$GITHUB_STEP_SUMMARY"
