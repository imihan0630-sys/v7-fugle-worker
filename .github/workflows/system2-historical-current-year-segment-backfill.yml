name: System2 Historical Current-Year Segmented Backfill

on:
  workflow_dispatch:
    inputs:
      market:
        description: "Current-year completed-month cold segments; run one market at a time"
        required: true
        type: choice
        options:
          - TWSE
          - TPEX
      quota_reservation_rows:
        description: "Evidence-based conservative D1 rowsWritten reservation for completed-month segment write"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: system2-isolated-d1-writer
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: system2-research
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify existing System2 segmented schema without any D1 writes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
        run: node system2/scripts/historical_segment_schema_readonly_preflight_v0_1.mjs

  backfill:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: system2-research
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reserve shared account D1 budget
        id: quota
        uses: ./.github/actions/system2-d1-budget-gate
        with:
          writer_id: HISTORICAL_CURRENT_YEAR_SEGMENT
          requested_rows_written: ${{ inputs.quota_reservation_rows }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Backfill current-year completed-month cold segments
        if: steps.quota.outputs.physical_allowed == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
          SYSTEM2_R2_ACCESS_KEY_ID: ${{ secrets.SYSTEM2_R2_ACCESS_KEY_ID }}
          SYSTEM2_R2_SECRET_ACCESS_KEY: ${{ secrets.SYSTEM2_R2_SECRET_ACCESS_KEY }}
          SYSTEM2_R2_BUCKET: ${{ vars.SYSTEM2_R2_BUCKET }}
          SYSTEM2_HISTORY_SEGMENT_MARKET: ${{ inputs.market }}
          SYSTEM2_HISTORY_SEGMENT_OUTPUT: "/tmp/system2-current-year-segments-${{ inputs.market }}.json"
        run: |
          set -euo pipefail
          node system2/scripts/historical_current_year_segment_backfill_v0_1.mjs \
            | tee /tmp/system2-current-year-segments-${{ inputs.market }}.log

      - name: Reconcile shared account D1 budget result
        if: always() && steps.quota.outputs.physical_allowed == 'true'
        uses: ./.github/actions/system2-d1-budget-gate
        with:
          writer_id: HISTORICAL_CURRENT_YEAR_SEGMENT
          mode: result
          reservation_receipt_path: ${{ steps.quota.outputs.reservation_receipt_path }}
          execution_outcome: ${{ job.status }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Upload current-year segmented cold evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: system2-current-year-segments-${{ inputs.market }}
          path: |
            /tmp/system2-current-year-segments-${{ inputs.market }}.json
            /tmp/system2-d1-budget-reservation.json
            /tmp/system2-d1-budget-result.json
          if-no-files-found: warn
          retention-days: 30

      - name: Confirm System1 production files untouched
        if: ${{ always() }}
        run: |
          set -euo pipefail
          test "$(sed -n '1p' wrangler.toml)" = 'name = "fugle-test"'
          git diff --exit-code -- wrangler.toml Worker.js
          echo "Production isolation PASS"
