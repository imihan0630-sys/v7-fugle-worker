name: S1 V8 Formal Live Public Health GET ONCE 20261011
on:
  push:
    branches:
      - fix/owner-waive-v8-quota-reserve-20261011
    paths:
      - .github/workflows/system1-v8-public-health-once-20261011.yml
permissions:
  contents: read
jobs:
  public_get:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Public HTTPS GET only; no login, POST, trading or secrets
        run: |
          set -euo pipefail
          node --check tests/system1_public_runtime_evidence.mjs
          node tests/system1_public_runtime_evidence.mjs
          git diff --exit-code -- Worker.js wrangler.toml
      - name: Upload true as-of runtime health receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system1-v8-public-live-get-20261011-${{ github.run_id }}
          path: artifacts/system1-public-runtime-readonly.json
          retention-days: 90
          if-no-files-found: warn
