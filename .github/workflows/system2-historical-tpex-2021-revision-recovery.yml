name: System2 Historical 2021 TPEx Revision Recovery

on:
  workflow_dispatch:
    inputs:
      quota_reservation_rows:
        description: "Evidence-based conservative D1 rowsWritten reservation for recovery persistence"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: system2-isolated-d1-writer
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: system2-research
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify required isolated D1 schema without mutation
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
          SYSTEM2_D1_SCHEMA_MUTATION_ALLOWED: "false"
        run: node system2/deploy/ensure_system2_d1_ready.mjs

  recover:
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: system2-research
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Reserve shared account D1 budget
        id: quota
        uses: ./.github/actions/system2-d1-budget-gate
        with:
          writer_id: TPEX_2021_REVISION_RECOVERY
          requested_rows_written: ${{ inputs.quota_reservation_rows }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Capture immutable baseline plus prospective official revision overlay
        if: steps.quota.outputs.physical_allowed == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
          SYSTEM2_R2_ACCESS_KEY_ID: ${{ secrets.SYSTEM2_R2_ACCESS_KEY_ID }}
          SYSTEM2_R2_SECRET_ACCESS_KEY: ${{ secrets.SYSTEM2_R2_SECRET_ACCESS_KEY }}
          SYSTEM2_R2_BUCKET: ${{ vars.SYSTEM2_R2_BUCKET }}
          SYSTEM2_HISTORY_YEAR: "2021"
          SYSTEM2_HISTORY_YEAR_MARKET: TPEX
          SYSTEM2_HISTORY_REVISION_OUTPUT: /tmp/system2-historical-revision-TPEX-2021.json
        run: |
          set -euo pipefail
          node system2/scripts/historical_tpex_2021_revision_overlay_v0_1.mjs \
            | tee /tmp/system2-historical-revision-TPEX-2021.log

      - name: Physically re-verify 2021 TPEx through PIT revision lineage
        if: steps.quota.outputs.physical_allowed == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
          SYSTEM2_R2_ACCESS_KEY_ID: ${{ secrets.SYSTEM2_R2_ACCESS_KEY_ID }}
          SYSTEM2_R2_SECRET_ACCESS_KEY: ${{ secrets.SYSTEM2_R2_SECRET_ACCESS_KEY }}
          SYSTEM2_R2_BUCKET: ${{ vars.SYSTEM2_R2_BUCKET }}
          SYSTEM2_HISTORY_YEAR: "2021"
          SYSTEM2_HISTORY_YEAR_MARKET: TPEX
          SYSTEM2_HISTORY_COVERAGE_OUTPUT: /tmp/system2-historical-coverage-TPEX-2021-revision-recovered.json
        run: |
          set -euo pipefail
          node system2/scripts/historical_market_year_verify_v0_1.mjs \
            | tee /tmp/system2-historical-coverage-TPEX-2021-revision-recovered.log

      - name: Reconcile shared account D1 budget result
        if: always() && steps.quota.outputs.physical_allowed == 'true'
        uses: ./.github/actions/system2-d1-budget-gate
        with:
          writer_id: TPEX_2021_REVISION_RECOVERY
          mode: result
          reservation_receipt_path: ${{ steps.quota.outputs.reservation_receipt_path }}
          execution_outcome: ${{ job.status }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Upload 2021 TPEx revision recovery evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: system2-historical-revision-recovery-TPEX-2021
          path: |
            /tmp/system2-historical-revision-TPEX-2021.json
            /tmp/system2-historical-coverage-TPEX-2021-revision-recovered.json
            /tmp/system2-d1-budget-reservation.json
            /tmp/system2-d1-budget-result.json
          if-no-files-found: warn
          retention-days: 30

      - name: Confirm System1 production files untouched
        if: ${{ always() }}
        run: |
          set -euo pipefail
          test "$(sed -n '1p' wrangler.toml)" = 'name = "fugle-test"'
          git diff --exit-code -- wrangler.toml Worker.js
          echo "Production isolation PASS"
