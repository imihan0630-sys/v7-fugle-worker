name: D02 PVE262 Cron Window Readonly

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/d02_pve262_cron_window_readonly_v0_1.mjs"
      - ".github/workflows/d02-pve262-cron-window-readonly.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read raw Production cron window without mutation
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node research/d02_pve262_cron_window_readonly_v0_1.mjs
      - name: Preserve sanitized PVE-262 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d02-pve262-cron-window-readonly-${{ github.run_id }}
          path: artifacts/d02-pve262-cron-window-readonly.json
          if-no-files-found: warn
          retention-days: 30
