name: System2 TPEx Halt Source Discovery Readonly

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "system2/scripts/probe_tpex_halt_source_discovery_readonly_v0_1.mjs"
      - "system2/SYSTEM2_TPEX_HALT_SOURCE_DISCOVERY_V0_1.md"
      - ".github/workflows/system2-tpex-halt-source-discovery-readonly.yml"
  push:
    branches: [main]
    paths:
      - "system2/scripts/probe_tpex_halt_source_discovery_readonly_v0_1.mjs"
      - "system2/SYSTEM2_TPEX_HALT_SOURCE_DISCOVERY_V0_1.md"
      - ".github/workflows/system2-tpex-halt-source-discovery-readonly.yml"

permissions:
  contents: read

concurrency:
  group: system2-tpex-halt-source-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Discover official TPEx halt/resumption data route
        run: node system2/scripts/probe_tpex_halt_source_discovery_readonly_v0_1.mjs

      - name: Probe official sprcHis route candidate
        run: node system2/scripts/probe_tpex_halt_route_candidate_readonly_v0_1.mjs

      - name: Confirm read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -qE 'CLOUDFLARE|SYSTEM2_DB|wrangler|secret|deploy|INSERT|UPDATE|DELETE' system2/scripts/probe_tpex_halt_source_discovery_readonly_v0_1.mjs
          ! grep -qE 'CLOUDFLARE|SYSTEM2_DB|wrangler|secret|deploy|INSERT|UPDATE|DELETE' system2/scripts/probe_tpex_halt_route_candidate_readonly_v0_1.mjs
          echo "Read-only TPEx halt source discovery boundary PASS"
