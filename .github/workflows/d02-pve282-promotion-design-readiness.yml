name: D02 PVE282 Promotion Design Readiness Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/d02_pve282_promotion_design_readiness_audit_v0_1.mjs"
      - "tests/test_d02_pve282_promotion_design_readiness_audit_v0_1.mjs"
      - ".github/workflows/d02-pve282-promotion-design-readiness.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/test_d02_pve282_promotion_design_readiness_audit_v0_1.mjs
