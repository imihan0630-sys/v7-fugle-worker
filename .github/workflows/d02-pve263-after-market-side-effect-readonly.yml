name: D02 PVE263 After Market Side Effect Readonly

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/d02_pve263_after_market_side_effect_readonly_v0_1.mjs"
      - ".github/workflows/d02-pve263-after-market-side-effect-readonly.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read Production after-market side effects without mutation
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node research/d02_pve263_after_market_side_effect_readonly_v0_1.mjs
      - name: Preserve sanitized PVE-263 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d02-pve263-after-market-side-effect-readonly-${{ github.run_id }}
          path: artifacts/d02-pve263-after-market-side-effect-readonly.json
          if-no-files-found: warn
          retention-days: 30
