name: System2 Recent60 Indexed D1 Read Cost Readonly

# Manual, post-reset, fixed retrospective date. Never start automatically:
# this would use account-wide Cloudflare D1 READ quota that has been exhausted.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system2-recent60-indexed-d1-read-cost-readonly
  cancel-in-progress: false

jobs:
  physical:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: system2-research
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test zero-write and retrospective observation boundary
        run: |
          set -euo pipefail
          node system2/tests/recent60_indexed_d1_read_cost_readonly_v0_1.test.mjs
          node system2/tests/daily_shadow_recent60_symbol_index_batches_v0_1.test.mjs
          git diff --exit-code -- Worker.js wrangler.toml

      - name: Physically measure bounded indexed READ count on frozen 2026-10-08 date
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
          SYSTEM2_RECENT60_INDEXED_READ_AUDIT_OUTPUT: /tmp/s2-recent60-indexed-d1-read-cost.json
        run: |
          set -euo pipefail
          node system2/scripts/audit_recent60_indexed_d1_read_cost_readonly_v0_1.mjs
      - name: Preserve physical PASS or BLOCKED read count evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system2-recent60-indexed-read-cost-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/s2-recent60-indexed-d1-read-cost.json
          if-no-files-found: warn
          retention-days: 90
      - name: Confirm System1 production files untouched
        if: always()
        run: |
          git diff --exit-code -- Worker.js wrangler.toml
          echo "Production isolation PASS"
