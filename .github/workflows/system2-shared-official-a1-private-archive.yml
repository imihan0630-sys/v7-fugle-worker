name: System2 Shared Official A1 Private Archive

on:
  workflow_run:
    workflows: ["System2 Shared Official TWSE TPEx A1 Incremental (READ ONLY)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful shared official A1 source workflow run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: system2-shared-official-a1-private-archive
  cancel-in-progress: false

jobs:
  archive:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve exact successful source run
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          DISPATCH_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then RUN_ID="$WORKFLOW_RUN_ID"; else RUN_ID="$DISPATCH_RUN_ID"; fi
          test -n "$RUN_ID"
          case "$RUN_ID" in (*[!0-9]*) exit 2;; esac
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_name=s2-shared-official-a1-$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Download exact source artifact from successful run
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.source.outputs.run_id }}
          name: ${{ steps.source.outputs.artifact_name }}
          path: /tmp/shared-a1-source
          github-token: ${{ github.token }}
      - name: Verify publisher, source semantics, private-only scope and no production coupling
        run: |
          set -euo pipefail
          node --check system2/scripts/publish_shared_official_a1_private_archive_v0_1.mjs
          node --test system2/tests/shared_official_a1_private_archive_v0_1.test.mjs
          git diff --exit-code -- Worker.js wrangler.toml
      - name: Configure target-repository-only deploy key
        env:
          ARCHIVE_DEPLOY_KEY: ${{ secrets.S2_A1_ARCHIVE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test -n "$ARCHIVE_DEPLOY_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$ARCHIVE_DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          curl --fail --silent --show-error https://api.github.com/meta |
            jq -r '.ssh_keys[] | "github.com " + .' > "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"
      - name: Clone only the approved private archive
        run: |
          set -euo pipefail
          git clone --depth 1 git@github.com:imihan0630-sys/v7-system2-official-a1-archive.git /tmp/private-a1-archive
          test "$(git -C /tmp/private-a1-archive remote get-url origin)" = "git@github.com:imihan0630-sys/v7-system2-official-a1-archive.git"
      - name: Prepare content-addressed create-only archive commit
        env:
          SHARED_A1_MANIFEST_PATH: /tmp/shared-a1-source/shared-official-a1-manifest.json
          SHARED_A1_ORIGINAL_DIR: /tmp/shared-a1-source/original-json
          SHARED_A1_ARCHIVE_DIR: /tmp/private-a1-archive
          SHARED_A1_ARCHIVE_AUTHORIZATION_PATH: system2/config/shared_official_a1_private_archive_authorization_v0_1.json
        run: |
          set -euo pipefail
          RECEIPT="$(find /tmp/shared-a1-source -maxdepth 1 -name 'official-61-*.json' -type f -print -quit)"
          test -n "$RECEIPT"
          export SHARED_A1_SOURCE_RECEIPT_PATH="$RECEIPT"
          node system2/scripts/publish_shared_official_a1_private_archive_v0_1.mjs
      - name: Commit and push only verified archive paths
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          set -euo pipefail
          cd /tmp/private-a1-archive
          git config user.name system2-a1-archive-writer
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- raw manifests source-receipts archive-receipts SOURCE_NOTICE.md
          if git diff --cached --quiet; then
            echo 'No new content-addressed source files.' >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "archive: shared official A1 source run $SOURCE_RUN_ID"
            git push origin HEAD:main
          fi
      - name: Preserve non-secret archive receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-a1-private-archive-receipt-${{ github.run_id }}
          path: /tmp/shared-a1-private-archive-publish/archive-publish-receipt.json
          if-no-files-found: warn
          retention-days: 90
      - name: Safety declaration
        if: always()
        run: |
          rm -f "$HOME/.ssh/id_ed25519"
          echo 'Target: dedicated private content-addressed Git archive only.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No public raw publication, paid plan, D1/R2, System1 Formal/runtime, selection, Frozen, push or orders.' >> "$GITHUB_STEP_SUMMARY"
