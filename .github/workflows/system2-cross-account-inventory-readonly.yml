name: System2 Cross-Account Inventory (READ ONLY)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type INVENTORY_ONLY_NO_MUTATION (no D1 SQL; no resource changes)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: system2-cross-account-inventory-readonly
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: system2-migration
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Guard manual read-only authorization
        env:
          ACK: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          test "$ACK" = INVENTORY_ONLY_NO_MUTATION
          # Metadata-only inventory: no Cloudflare mutations, SQL or object-byte retrieval.
          test -f system2/migration/run_readonly_inventory_v0_1.mjs
      - name: Diagnose each account's token status and D1 READ scope (GET only)
        env:
          S2_MIGRATION_READ_ONLY_ACK: ${{ inputs.confirm }}
          S2_MIGRATION_SOURCE_ACCOUNT_ID: ${{ secrets.S2_MIGRATION_SOURCE_ACCOUNT_ID }}
          S2_MIGRATION_SOURCE_READ_TOKEN: ${{ secrets.S2_MIGRATION_SOURCE_READ_TOKEN }}
          S2_MIGRATION_DESTINATION_ACCOUNT_ID: ${{ secrets.S2_MIGRATION_DESTINATION_ACCOUNT_ID }}
          S2_MIGRATION_DESTINATION_READ_TOKEN: ${{ secrets.S2_MIGRATION_DESTINATION_READ_TOKEN }}
        run: node system2/migration/run_readonly_auth_diagnostic_v0_1.mjs
      - name: Upload sanitized authentication receipts (even on blocked auth)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system2-cross-account-readonly-auth-${{ github.run_id }}
          path: /tmp/system2-cross-account-inventory/auth-diagnostic.json
          if-no-files-found: warn
          retention-days: 14
      - name: Fail closed if either D1 read authorization is unverified
        run: |
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const r=JSON.parse(readFileSync("/tmp/system2-cross-account-inventory/auth-diagnostic.json","utf8"));
            if (r.status!=="D1_READ_PREFLIGHT_PASS") {
              console.error("Account READ credentials blocked; see sanitized auth receipt for SOURCE and DESTINATION.");
              process.exit(1);
            }
            console.log("Both account D1 READ scope checks passed");
          '
      - name: Diagnose SOURCE and DESTINATION D1 Workers KV and R2 independently (GET only)
        env:
          S2_MIGRATION_READ_ONLY_ACK: ${{ inputs.confirm }}
          S2_MIGRATION_SOURCE_ACCOUNT_ID: ${{ secrets.S2_MIGRATION_SOURCE_ACCOUNT_ID }}
          S2_MIGRATION_SOURCE_READ_TOKEN: ${{ secrets.S2_MIGRATION_SOURCE_READ_TOKEN }}
          S2_MIGRATION_DESTINATION_ACCOUNT_ID: ${{ secrets.S2_MIGRATION_DESTINATION_ACCOUNT_ID }}
          S2_MIGRATION_DESTINATION_READ_TOKEN: ${{ secrets.S2_MIGRATION_DESTINATION_READ_TOKEN }}
        run: node system2/migration/run_readonly_services_diagnostic_v0_1.mjs
      - name: Upload sanitized per-account service receipts even on denied access
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system2-cross-account-service-read-${{ github.run_id }}
          path: /tmp/system2-cross-account-inventory/service-diagnostic.json
          if-no-files-found: warn
          retention-days: 14
      - name: Block if any account service READ is unverified
        run: |
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const r=JSON.parse(readFileSync("/tmp/system2-cross-account-inventory/service-diagnostic.json","utf8"));
            const hasFour=(x,role)=>x?.role===role && Array.isArray(x.services) && x.services.length===4 &&
              new Set(x.services.map(s=>s.service)).size===4;
            const granted=(x,name)=>x.services.find(s=>s.service===name)?.classification==="READ_GRANTED";
            const src=hasFour(r.source,"SOURCE") && ["D1","WORKERS","KV","R2"].every(x=>granted(r.source,x));
            const dst=hasFour(r.destination,"DESTINATION") && ["D1","WORKERS","KV"].every(x=>granted(r.destination,x));
            const r2=r.destination?.services?.find(s=>s.service==="R2");
            const partial=r.status==="BLOCKED_SERVICE_READS" && src && dst &&
              r2?.classification==="R2_ACCOUNT_NOT_ENTITLED" && r2?.httpStatus===403 && r2?.errorCode===10042;
            const all=r.status==="SERVICES_READ_PREFLIGHT_PASS" && src && dst && granted(r.destination,"R2");
            if (!all && !partial) {
              console.error("READ_ONLY_SERVICE_SCOPE_BLOCKED; inspect sanitized per-service receipt.");
              process.exit(1);
            }
            console.log(partial ? "PARTIAL_READONLY_INVENTORY_DEST_R2_NOT_ENTITLED" : "FULL_METADATA_SCOPE_GRANTED");
          '
      - name: Collect both accounts metadata using dedicated scoped READ tokens
        env:
          S2_MIGRATION_READ_ONLY_ACK: ${{ inputs.confirm }}
          S2_MIGRATION_SOURCE_ACCOUNT_ID: ${{ secrets.S2_MIGRATION_SOURCE_ACCOUNT_ID }}
          S2_MIGRATION_SOURCE_READ_TOKEN: ${{ secrets.S2_MIGRATION_SOURCE_READ_TOKEN }}
          S2_MIGRATION_DESTINATION_ACCOUNT_ID: ${{ secrets.S2_MIGRATION_DESTINATION_ACCOUNT_ID }}
          S2_MIGRATION_DESTINATION_READ_TOKEN: ${{ secrets.S2_MIGRATION_DESTINATION_READ_TOKEN }}
        run: |
          set -euo pipefail
          node system2/migration/run_readonly_inventory_v0_1.mjs
      - name: Upload SANITIZED inventory evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: system2-cross-account-sanitized-inventory-${{ github.run_id }}
          path: /tmp/system2-cross-account-inventory/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify no production files were changed
        if: always()
        run: |
          set -euo pipefail
          git diff --exit-code -- Worker.js wrangler.toml
