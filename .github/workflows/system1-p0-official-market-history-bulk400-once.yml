name: System1 P0 OFFICIAL 400 History K-lines Data-only (ONE SHOT)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/system1-p0-official-market-history-bulk400-once.yml"
permissions:
  contents: read
concurrency:
  group: system1-history-cache-dataonly-safe-write
  cancel-in-progress: false
jobs:
  source_verified_bulk400:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SYSTEM2_CLOUDFLARE_API_TOKEN: ${{ secrets.SYSTEM2_CLOUDFLARE_API_TOKEN }}
      V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check guarded official source and exactly bounded data-only write scope
        run: |
          set -euo pipefail
          node --check ops/system1_p0_official_fullmarket_history_append_once_v0_1.mjs
          node system2/tests/official_historical_a1_source_v0_1.test.mjs
          grep -F -q 'const SYMBOL_CAP=400;' ops/system1_p0_official_fullmarket_history_append_once_v0_1.mjs
          grep -F -q 'WHERE symbol=?3 AND updated_at=?4' ops/system1_p0_official_fullmarket_history_append_once_v0_1.mjs
          grep -F -q "WHERE symbol='0000'" ops/system1_p0_official_fullmarket_history_append_once_v0_1.mjs
      - name: First bulk offline source validation then <=400 physical D1 CAS+readbacks
        run: node ops/system1_p0_official_fullmarket_history_append_once_v0_1.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system1-p0-official-history-bulk400-${{ github.run_id }}
          path: artifacts/system1-p0-official-wholemarket-firstbatch.json
          if-no-files-found: warn
          retention-days: 30
