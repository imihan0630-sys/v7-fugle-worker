name: V8 Official Valuation Source Date GET Diagnosis ONCE 20261012
on:
  push:
    branches:
      - ops/v8-owner-manual-preflight-20261012
    paths:
      - .github/workflows/v8-valuation-date-readonly-diagnosis-once-20261012.yml
permissions:
  contents: read
jobs:
  official_source_get:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read official public valuation source metadata only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import {writeFile} from "node:fs/promises";
          const urls=[
            ["TWSE","https://www.twse.com.tw/exchangeReport/BWIBBU_d?response=json&date=20261012&selectType=ALL"],
            ["TPEx","https://www.tpex.org.tw/openapi/v1/tpex_mainboard_peratio_analysis"]
          ];
          const out={schemaVersion:"V8_OFFICIAL_VALUATION_SOURCE_DATE_20261012_V0_1",observedAt:new Date().toISOString(),requestedDate:"2026-10-12",noCloudflareCalls:true,noWorkerMutation:true,noPlanChanges:true,items:{}};
          for(const [name,url] of urls){
            const row={httpStatus:null,sourceDate:null,rowCount:null,stat:null,error:null};
            try{
              const response=await fetch(url,{signal:AbortSignal.timeout(33000),headers:{accept:"application/json"}});
              const p=await response.json();row.httpStatus=response.status;
              row.sourceDate=String(p?.date??p?.Date??p?.reportDate??p?.title??p?.Title??"").slice(0,120);
              row.stat=String(p?.stat??p?.status??"").slice(0,140);
              row.rowCount=Array.isArray(p)?p.length:Array.isArray(p?.data)?p.data.length:null;
              row.rootKeys=Array.isArray(p)?["array"]:Object.keys(p||{}).slice(0,14);
              row.firstItemDate=Array.isArray(p)?String(p[0]?.Date??p[0]?.資料日期??p[0]?.日期??"").slice(0,70):null;
              row.firstItemKeys=Array.isArray(p)&&p[0]?Object.keys(p[0]).slice(0,15):null;
            }catch(e){row.error=e?.name==="TimeoutError"?"TIMEOUT":"OFFICIAL_SOURCE_GET_OR_PARSE_FAILED";}
            out.items[name]=row;
          }
          await writeFile("artifacts/v8-official-valuation-source-metadata-20261012.json",JSON.stringify(out,null,2)+"\n");
          console.log("V8_OFFICIAL_VALUATION_DIAG="+JSON.stringify(out));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: v8-valuation-source-get-diagnosis-20261012-${{ github.run_id }}
          path: artifacts/v8-official-valuation-source-metadata-20261012.json
          retention-days: 60
          if-no-files-found: warn
