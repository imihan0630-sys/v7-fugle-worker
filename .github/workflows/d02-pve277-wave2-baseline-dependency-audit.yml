name: D02 PVE277 Wave2 Baseline Dependency Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/d02_pve277_wave2_baseline_dependency_audit_v0_1.mjs"
      - "tests/test_d02_pve277_wave2_baseline_dependency_audit_v0_1.mjs"
      - ".github/workflows/d02-pve277-wave2-baseline-dependency-audit.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/test_d02_pve277_wave2_baseline_dependency_audit_v0_1.mjs
