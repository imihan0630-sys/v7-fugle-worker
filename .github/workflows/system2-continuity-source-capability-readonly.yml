name: System2 Continuity Source Capability Readonly

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "system2/runtime/fugle_corporate_action_capability_v0_1.mjs"
      - "system2/scripts/probe_fugle_corporate_actions_readonly_v0_1.mjs"
      - "system2/tests/fugle_corporate_action_capability_v0_1.test.mjs"
      - "system2/tests/continuity_source_capability_workflow_guard.test.mjs"
      - ".github/workflows/system2-continuity-source-capability-readonly.yml"

permissions:
  contents: read

concurrency:
  group: system2-continuity-source-capability-readonly
  cancel-in-progress: true

jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: system2-research
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify capability probe firewalls
        run: |
          set -euo pipefail
          node system2/tests/fugle_corporate_action_capability_v0_1.test.mjs
          node system2/tests/continuity_source_capability_workflow_guard.test.mjs
          node --check system2/scripts/probe_fugle_corporate_actions_readonly_v0_1.mjs
          git diff --exit-code -- Worker.js wrangler.toml

      - name: Probe Fugle corporate-action capability read-only
        env:
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$FUGLE_API_KEY"
          node system2/scripts/probe_fugle_corporate_actions_readonly_v0_1.mjs             | tee /tmp/system2-continuity-source-capability.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const r=JSON.parse(fs.readFileSync("/tmp/system2-continuity-source-capability.json","utf8"));
          if(r.result!=="PASS"||r.readOnly!==true)throw new Error("probe result mismatch");
          if(r.sourceCoverageComplete!==false||r.noEventMayBeClaimed!==false||r.technicalContinuityCertified!==false)throw new Error("continuity authority leaked");
          if(r.continuityTransformPerformed!==false||r.historyMutationPerformed!==false||r.selectionAuthority!==false||r.system1RuntimeUsed!==false)throw new Error("mutation/authority boundary leaked");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            "System2 continuity source probe: "+r.state+"\n\n"+
            "Range: "+r.startDate+".."+r.endDate+
            "; dividends HTTP: "+String(r.transports.dividends.httpStatus)+
            "; capital changes HTTP: "+String(r.transports.capitalChanges.httpStatus)+
            ". TECHNICAL_CONTINUITY remains uncertified.\n");
          NODE

      - name: Preserve capability receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system2-continuity-source-capability-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/system2-continuity-source-capability.json
          if-no-files-found: warn
          retention-days: 90
