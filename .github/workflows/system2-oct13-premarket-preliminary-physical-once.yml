name: System2 Oct13 Official A1 122 PREMARKET Preliminary Once READONLY
on:
  push:
    branches: [main]
    paths: ['.github/workflows/system2-oct13-premarket-preliminary-physical-once.yml']
permissions:
  contents: read
  actions: read
jobs:
  real_preliminary:
    if: github.repository == 'imihan0630-sys/v7-fugle-worker' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify actual delayed as-of-now preliminary vs strict formal and backtest PIT
        run: |
          set -euo pipefail
          node --test system2/tests/preliminary_daily_pv_watch_v0_1.test.mjs
          node --test system2/tests/shared_official_a1_source_ledger_bridge_v0_1.test.mjs
          node --test system2/tests/backtest_pit_scope_gate_v0_1.test.mjs
          git diff --exit-code -- Worker.js wrangler.toml
      - name: Download exact actual 2026-10-13 official 61-session TWSE TPEx 122 original evidence
        uses: actions/download-artifact@v4
        with:
          run-id: 38468816687
          name: s2-shared-official-a1-38468816687
          path: /tmp/s2-preliminary-actual-official
          github-token: ${{ github.token }}
      - name: Independently readback all 122 original bytes and source dates
        env:
          S2_A1_AUDIT_SOURCE_DIR: /tmp/s2-preliminary-actual-official
          S2_A1_EXPECT_INCOMPLETE_DIAGNOSTIC: "false"
        run: |
          set -euo pipefail
          node system2/scripts/audit_shared_official_a1_source_v0_1.mjs
          A=/tmp/s2-shared-a1-independent-audit/audit-receipt.json
          test "$(jq -r .verdict "$A")" = 'ACCEPTED_SOURCE_INTEGRITY_ONLY'
          test "$(jq -r .marketDate "$A")" = '2026-10-13'
          test "$(jq -r .sourceMarketDatePairsVerified "$A")" = '122'
          test "$(jq -r .selectionAuthorized "$A")" = 'false'
      - name: Observe as of actual time without falsely backdating strict Stage1 or Frozen
        env:
          S2_A1_AUDIT_SOURCE_DIR: /tmp/s2-preliminary-actual-official
          S2_A1_AUDIT_RECEIPT_FILE: /tmp/s2-shared-a1-independent-audit/audit-receipt.json
        run: |
          set -euo pipefail
          node system2/scripts/run_shared_official_a1_stage1_readonly_v0_1.mjs
      - name: Check 1974-universe readback, actual preliminary observation and strict no promotion
        run: |
          set -euo pipefail
          A=/tmp/s2-shared-a1-independent-audit/audit-receipt.json
          P=/tmp/s2-a1-stage1-readonly/preliminary-pv-watch.json
          S=/tmp/s2-a1-stage1-readonly/summary.json
          R=/tmp/s2-a1-stage1-readonly/daily-selection-readiness.json
          test -s "$P"; test -s "$S"; test -s "$R"
          test "$(jq -r .marketDate "$P")" = '2026-10-13'
          test "$(jq -r .lateMorningObservationNotBackdated "$P")" = 'true'
          test "$(jq -r .state "$P")" = 'PRELIMINARY_DAILY_OBSERVATION_NOT_FORMAL_SELECTION'
          test "$(jq -r .officialUniverseCount "$P")" -ge 1000
          test "$(jq -r .historyContinuityUsableCount "$P")" -gt 0
          test "$(jq -r .preliminaryMatchedCount "$P")" -ge 0
          test "$(jq -r .displayedCount "$P")" -le 30
          test "$(jq -r .selectedCount "$P")" = 'null'
          test "$(jq -r .finalSelectionAuthorized "$P")" = 'false'
          test "$(jq -r .historicalBacktestCertified "$P")" = 'false'
          test "$(jq -r .frozenWritten "$P")" = 'false'
          test "$(jq -r .orderAuthorized "$P")" = 'false'
          test "$(jq -r .state "$S")" = 'BLOCKED_NO_ELIGIBLE_SOURCE_LEDGER'
          test "$(jq -r .selectedCount "$S")" = 'null'
          test "$(jq -r .state "$R")" = 'BLOCKED_SOURCE_NOT_SELECTION'
          test "$(jq -r .zeroPickDay "$R")" = 'null'
          echo "Physical original 122/122 independent audit SUCCESS" >> "$GITHUB_STEP_SUMMARY"
          echo "As-of-NOW preliminary $(jq -r .preliminaryMatchedCount "$P") of $(jq -r .officialUniverseCount "$P"); displayed $(jq -r .displayedCount "$P"); quarantined $(jq -r .anomalyQuarantinedCount "$P"); history withheld $(jq -r .withheldHistoryCount "$P")." >> "$GITHUB_STEP_SUMMARY"
          echo 'NO SHADOW decision, no ranking/capacity authority, no backtest certification, no Frozen, no live push/trading.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve sanitized receipt and preliminary candidates only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system2-oct13-premarket-preliminary-once-${{ github.run_id }}
          path: |
            /tmp/s2-shared-a1-independent-audit/audit-receipt.json
            /tmp/s2-a1-stage1-readonly/preliminary-pv-watch.json
            /tmp/s2-a1-stage1-readonly/summary.json
            /tmp/s2-a1-stage1-readonly/daily-selection-readiness.json
          retention-days: 7
          if-no-files-found: warn
