name: System2 Bounded Revision History Census Low Volume Readonly

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "system2/runtime/bounded_revision_history_census_v0_1.mjs"
      - "system2/tests/bounded_revision_history_census_v0_1.test.mjs"
      - "system2/scripts/probe_bounded_revision_history_census_low_volume_readonly_v0_1.mjs"
      - "system2/SYSTEM2_BOUNDED_REVISION_HISTORY_CENSUS_LOW_VOLUME_V0_1.md"
      - ".github/workflows/system2-bounded-revision-history-census-low-volume-readonly.yml"
  push:
    branches: [main]
    paths:
      - "system2/runtime/bounded_revision_history_census_v0_1.mjs"
      - "system2/tests/bounded_revision_history_census_v0_1.test.mjs"
      - "system2/scripts/probe_bounded_revision_history_census_low_volume_readonly_v0_1.mjs"
      - "system2/SYSTEM2_BOUNDED_REVISION_HISTORY_CENSUS_LOW_VOLUME_V0_1.md"
      - ".github/workflows/system2-bounded-revision-history-census-low-volume-readonly.yml"

permissions:
  contents: read

concurrency:
  group: system2-bounded-revision-history-census-low-volume-${{ github.ref }}
  cancel-in-progress: true

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run census unit tests
        run: node system2/tests/bounded_revision_history_census_v0_1.test.mjs
      - name: Run physical low-volume census
        run: node system2/scripts/probe_bounded_revision_history_census_low_volume_readonly_v0_1.mjs
      - name: Confirm read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -qE 'CLOUDFLARE|SYSTEM2_DB|wrangler|secret|deploy|INSERT|UPDATE|DELETE' system2/scripts/probe_bounded_revision_history_census_low_volume_readonly_v0_1.mjs
          echo "Read-only bounded revision-history census boundary PASS"
