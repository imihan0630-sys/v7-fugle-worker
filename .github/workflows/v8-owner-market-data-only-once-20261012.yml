name: V8 Owner Data Only TODAY Market Repair ONCE 20261012
on:
  push:
    branches:
      - ops/v8-owner-manual-preflight-20261012
    paths:
      - .github/workflows/v8-owner-market-data-only-once-20261012.yml
permissions:
  contents: read
jobs:
  restore_today_official_market_only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      OFFICIAL_MARKET_DATE: "2026-10-12"
      V7_RECOVERY_DATA_ONLY_DATE: "2026-10-12"
      V7_DATA_ONLY_RECOVERY: "true"
      V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate this is the real official Taiwan market session
        run: |
          set -euo pipefail
          node tests/trading_day_gate.mjs
      - name: Ingest TODAY official TWSE / TPEx market data ONLY using existing production-guarded script
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          test -n "$V7_ADMIN_TOKEN"
          node tests/prepare_market_cache.mjs 2>&1 | tee artifacts/v8-owner-market-cache-20261012.log
      - name: Verify Cloudflare live production market cache readback (GET only)
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {writeFile} from 'node:fs/promises';
          const path='/api/market-data/status?marketDate=2026-10-12';
          const res=await fetch('https://fugle-test.imihan0630.workers.dev'+path,{method:'GET',headers:{'x-admin-token':process.env.V7_ADMIN_TOKEN,accept:'application/json'},signal:AbortSignal.timeout(30000)});
          const body=await res.json();
          const out={schemaVersion:"V8_OWNER_MARKET_ONLY_TRUE_RECEIPT_V0_1",observedAt:new Date().toISOString(),marketDate:body.marketDate||null,httpStatus:res.status,ready:body.ready===true,twseReady:body.markets?.TWSE?.ready===true,tpexReady:body.markets?.TPEx?.ready===true,twseCount:body.markets?.TWSE?.count??null,tpexCount:body.markets?.TPEx?.count??null,formalSelectionTriggered:false,noTrade:true,noPush:true};
          await writeFile('artifacts/v8-owner-market-readback-20261012.json',JSON.stringify(out,null,2)+'\n');
          console.log('V8_OWNER_OFFICIAL_MARKET_READBACK='+JSON.stringify(out));
          if(!res.ok||!out.ready||!out.twseReady||!out.tpexReady||out.marketDate!=="2026-10-12")process.exitCode=2;
          NODE
      - name: Persist provenance of market-only operation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-owner-market-data-only-20261012-${{ github.run_id }}
          path: artifacts/v8-owner-*
          if-no-files-found: warn
          retention-days: 60
