name: V8 Formal Selection Oct12 Actual Readback ONE SHOT Oct13
on:
  push:
    branches:
      - ops/v8-20261012-formal-selection-readonly-20261013
    paths:
      - .github/workflows/v8-formal-selection-readback-once-20261013.yml
permissions:
  contents: read
jobs:
  live_production_readback:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
    steps:
      - name: Real production authenticated GET-only last selection and Cron evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import {writeFile} from "node:fs/promises";
          const base="https://fugle-test.imihan0630.workers.dev";
          const token=process.env.V7_ADMIN_TOKEN||"";
          const result={schemaVersion:"V8_REAL_FORMAL_20261012_READBACK_20261013_V0_1",observedAt:new Date().toISOString(),tokenAvailable:!!token,GETOnly:true,noProductionWrite:true,noFormalScan:true,noPush:true,noTrade:true,resources:{}};
          const endpoints=[
            ["version","/api/version",false],
            ["scan","/api/scan/status",true],
            ["recommendations","/api/recommendations",false],
            ["cron","/api/cron/status",true],
            ["storage","/api/storage/status",false]
          ];
          for(const [key,path,auth] of endpoints){
            const row={httpStatus:null,error:null};
            try{
              const response=await fetch(base+path,{method:"GET",headers:{"accept":"application/json",...(auth&&token?{"x-admin-token":token}:{})},signal:AbortSignal.timeout(22000)});
              row.httpStatus=response.status;
              const v=await response.json().catch(()=>null);
              if(!response.ok){row.error="HTTP_"+response.status;}
              if(key==="version"){row.version=v?.version||null;row.testMode=v?.testMode??null;}
              else if(key==="scan"){
                row.scanDate=v?.scanDate??null;
                row.generatedAt=v?.generatedAt??null;
                row.selectedCount=v?.selectedCount??null;
                row.dryRun=v?.dryRun??null;
                row.pipelineComplete=v?.pipeline?.complete===true;
                row.selectionCompleted=v?.pipeline?.selectionCompleted===true;
                row.configVerified=v?.pipeline?.configVerified===true;
                row.threeMinVerified=v?.pipeline?.threeMinVerified===true;
                row.dailyReportAccepted=v?.pipeline?.dailyReportAccepted===true;
                row.status=String(v?.status||"").slice(0,200);
                row.stocks=Array.isArray(v?.stocks)?v.stocks.slice(0,6).map(s=>({symbol:String(s?.symbol||""),name:String(s?.name||""),signalLevel:s?.signalLevel??null,channel:s?.channel??null})):null;
              } else if(key==="recommendations"){
                row.scanDate=v?.scanDate??null;
                row.isCurrent=v?.isCurrent===true;
                row.resultType=v?.resultType??null;
                row.selectedCount=v?.selectedCount??null;
                row.attempt=v?.attempt||null;
                row.status=String(v?.status||"").slice(0,200);
              } else if(key==="cron"){
                row.latest=v?.latest?{scheduled_at:v.latest.scheduled_at,started_at:v.latest.started_at,finished_at:v.latest.finished_at,job_type:v.latest.job_type,status:v.latest.status,cron_expression:v.latest.cron_expression,skipped:v.latest.skipped,error:String(v.latest.error||"").slice(0,300),detail:String(v.latest.detail||"").slice(0,350)}:null;
                row.recent=Array.isArray(v?.recent)?v.recent.slice(0,20).map(x=>({scheduled_at:x.scheduled_at,started_at:x.started_at,finished_at:x.finished_at,job_type:x.job_type,status:x.status,cron_expression:x.cron_expression,skipped:x.skipped,error:String(x.error||"").slice(0,220),detail:String(x.detail||"").slice(0,300)})):null;
              } else if(key==="storage"){
                row.d1=v?.d1?.configured===true;row.latestArchived=v?.d1?.latestArchived===true;row.scanDate=v?.d1?.scanDate??null;row.mirrorScanDate=v?.github?.scanDate??null;
              }
            }catch(e){row.error=e.name==="TimeoutError"?"TIMEOUT":"NETWORK_OR_PARSE_FAILED";}
            result.resources[key]=row;
          }
          await writeFile("artifacts/v8-formal-selection-readback-20261013.json",JSON.stringify(result,null,2)+"\n");
          console.log("V8_REAL_FORMAL_SELECTION_READBACK="+JSON.stringify(result));
          NODE
      - name: Save immutable safe original receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-real-formal-selection-readback-20261013-${{ github.run_id }}
          path: artifacts/v8-formal-selection-readback-20261013.json
          retention-days: 60
          if-no-files-found: error
