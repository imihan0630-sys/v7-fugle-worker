name: D02 PVE273 H20 Baseline Freshness Bridge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/d02_pve273_h20_baseline_freshness_bridge_v0_1.mjs"
      - "tests/test_d02_pve273_h20_baseline_freshness_bridge_v0_1.mjs"
      - ".github/workflows/d02-pve273-h20-baseline-freshness-bridge.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/test_d02_pve273_h20_baseline_freshness_bridge_v0_1.mjs
