name: System2 Scheme C Daily Independent-Audit Preview Consumer (NO NEW CRON)
on:
  pull_request:
    branches: [main]
    paths:
      - 'system2/runtime/scheme_c_daily_audit_handoff_v0_1.mjs'
      - 'system2/tests/scheme_c_daily_audit_handoff_v0_1.test.mjs'
      - 'system2/scripts/run_scheme_c_daily_audit_handoff_readonly_v0_1.mjs'
      - 'system2/runtime/scheme_c_daily_visible_report_v0_1.mjs'
      - 'system2/scripts/run_scheme_c_visible_report_readonly_v0_1.mjs'
      - 'system2/tests/scheme_c_daily_visible_report_v0_1.test.mjs'
      - 'system2/tests/scheme_c_actions_summary_visibility_v0_1.test.mjs'
      - '.github/workflows/system2-scheme-c-daily-audit-preview-consumer.yml'
  workflow_run:
    workflows: ['System2 Shared Official A1 Independent Source Audit (READ ONLY)']
    types: [completed]
permissions:
  actions: read
  contents: read
concurrency:
  group: s2-scheme-c-existing-a1-audit-preview-${{ github.event_name == 'pull_request' && github.head_ref || github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  build_preview_from_existing_audit:
    # Follow only authentic main sourced by completed source incremental A1 audit.
    # A push self-diagnostic 121/122 must not create false daily stock selections.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.event == 'workflow_run')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact ALREADY STORED current audit artifact or pinned historical proof
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event_name == 'pull_request' && '38469057567' || github.event.workflow_run.id }}
          name: ${{ github.event_name == 'pull_request' && 'system2-shared-official-a1-independent-audit-38469057567' || format('system2-shared-official-a1-independent-audit-{0}', github.event.workflow_run.id) }}
          github-token: ${{ github.token }}
          path: /tmp/s2-scheme-c-daily-original-audit/
      - name: Historical-PR-only different-run V02 original (the real daily audit stores both in ONE artifact)
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event_name == 'pull_request' && '38477169340' || github.event.workflow_run.id }}
          name: ${{ github.event_name == 'pull_request' && 's2-v02-tdr-filtered-observation-38477169340' || format('system2-shared-official-a1-independent-audit-{0}', github.event.workflow_run.id) }}
          github-token: ${{ github.token }}
          path: /tmp/s2-scheme-c-daily-derived-preview/
      - name: Independently bind audit and preliminary exact trading date / SHA / clock
        env:
          UPSTREAM_AUDIT_RUN: ${{ github.event_name == 'pull_request' && '38469057567' || github.event.workflow_run.id }}
          PHYSICAL_EXAMPLE_PR: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
          S2_SCHEME_C_OUTPUT_PATH: /tmp/s2-scheme-c-daily-build-result/daily-nonpit-preview.json
        run: |
          set -euo pipefail
          node --check system2/runtime/scheme_c_daily_audit_handoff_v0_1.mjs
          node --check system2/scripts/run_scheme_c_daily_audit_handoff_readonly_v0_1.mjs
          node --test system2/tests/scheme_c_daily_audit_handoff_v0_1.test.mjs
          node --check system2/runtime/scheme_c_daily_visible_report_v0_1.mjs
          node --check system2/scripts/run_scheme_c_visible_report_readonly_v0_1.mjs
          node --test system2/tests/scheme_c_daily_visible_report_v0_1.test.mjs
          node --test system2/tests/scheme_c_actions_summary_visibility_v0_1.test.mjs
          # In REAL daily workflow_run, both signed receipts are co-located
          # in the SAME exact source-audit artifact. No second GH download,
          # no cross-run source pairing, and no additional provider GET.
          # Old Oct13 physical replay is deliberately a separately pinned
          # two-run pair, downloaded only during PR tests.
          if [ "$PHYSICAL_EXAMPLE_PR" = 'true' ]; then
            PREVIEW_DIR=/tmp/s2-scheme-c-daily-derived-preview
          else
            PREVIEW_DIR=/tmp/s2-scheme-c-daily-original-audit
            test ! -d /tmp/s2-scheme-c-daily-derived-preview
          fi
          test "$(find /tmp/s2-scheme-c-daily-original-audit -type f -name 'audit-receipt.json' | wc -l)" -eq 1
          test "$(find "$PREVIEW_DIR" -type f -name 'preliminary-pv-watch.json' | wc -l)" -eq 1
          AUDIT="$(find /tmp/s2-scheme-c-daily-original-audit -type f -name 'audit-receipt.json' -print -quit)"
          PREVIEW="$(find "$PREVIEW_DIR" -type f -name 'preliminary-pv-watch.json' -print -quit)"
          test -s "$AUDIT"
          test -s "$PREVIEW"
          if [ "$PHYSICAL_EXAMPLE_PR" = "true" ]; then
            # Physical prior V02 watcher run #38477169340 explicitly consumed
            # independent source audit #38469057567, both source linked.
            node system2/scripts/run_scheme_c_daily_audit_handoff_readonly_v0_1.mjs "$AUDIT" "$PREVIEW" "$UPSTREAM_AUDIT_RUN" historical-pinned
          else
            node system2/scripts/run_scheme_c_daily_audit_handoff_readonly_v0_1.mjs "$AUDIT" "$PREVIEW" "$UPSTREAM_AUDIT_RUN"
          fi
          R="$S2_SCHEME_C_OUTPUT_PATH"
          test -s "$R"
          test "$(jq -r .pitACertificationGranted "$R")" = 'false'
          test "$(jq -r .pitBCertificationGranted "$R")" = 'false'
          test "$(jq -r .selectedCount "$R")" = 'null'
          test "$(jq -r .zeroPickDay "$R")" = 'null'
          test "$(jq -r .frozenD1Written "$R")" = 'false'
          test "$(jq -r .cloudflareD1Writes "$R")" = '0'
          test "$(jq -r .cloudflareR2Writes "$R")" = '0'
          test "$(jq -r .system1FormalCoreChanged "$R")" = 'false'
          if [ "$PHYSICAL_EXAMPLE_PR" = 'true' ]; then
            test "$(jq -r .state "$R")" = 'NON_PIT_SOURCE_OBSERVATION_READY'
            test "$(jq -r .marketDate "$R")" = '2026-10-13'
            test "$(jq -r .descriptiveSourceMatches "$R")" = '580'
            test "$(jq -r .observedPreviewCount "$R")" = '30'
            test "$(jq -r .previewReport.state "$R")" = 'LATE_SOURCE_DESCRIPTIVE_PREVIEW_ONLY'
            test "$(jq -r .previewReport.futureProspectiveForwardReturnsUsableForThisDecision "$R")" = 'false'
          fi
          node system2/scripts/run_scheme_c_visible_report_readonly_v0_1.mjs "$R" /tmp/s2-scheme-c-daily-build-result
          M=/tmp/s2-scheme-c-daily-build-result/daily-nonpit-preview-meta.json
          HUMAN=/tmp/s2-scheme-c-daily-build-result/daily-nonpit-preview.md
          test -s "$M"
          test -s "$HUMAN"
          test "$(jq -r .marketDate "$M")" = "$(jq -r .marketDate "$R")"
          test "$(jq -r .pitACertified "$M")" = 'false'
          test "$(jq -r .pitBCertified "$M")" = 'false'
          test "$(jq -r .strategySelectedCount "$M")" = 'null'
          test "$(jq -r .frozenWritten "$M")" = 'false'
          test "$(jq -r .ordersAuthorized "$M")" = 'false'
          test "$(jq -r .pushAuthorized "$M")" = 'false'
          test "$(jq -r .schedulerDispatchDelayMinutes "$M")" = 'null'
          test "$(jq -r .officialProviderPublicationAtUtc "$M")" = 'null'
          test "$(jq -r .preferredCutAtUtc "$M")" = "$(jq -r .marketDate "$M")T15:45:00Z"
          if [ "$PHYSICAL_EXAMPLE_PR" = 'true' ]; then
            # Historical true 2026-10-13 artifact has its OWN signed
            # independent audit clock; synthetic fixture 365/396.1
            # must never be projected onto those physically stored bytes.
            test "$(jq -r '.independentAuditOffsetMinutes > 0' "$M")" = 'true'
            test "$(jq -r '.previewObservationOffsetMinutes > 0' "$M")" = 'true'
            test "$(jq -r .researchReceiptCutStatus "$M")" = 'SOURCE_OBSERVED_AFTER_T2345_DESCRIPTIVE_ONLY'
            echo "PHYSICAL_OCT13 actual audit-after-cut=$(jq -r .independentAuditOffsetMinutes "$M")m, preview-after-cut=$(jq -r .previewObservationOffsetMinutes "$M")m; do NOT backdate."
          fi
          grep -q '非 PIT 研究預覽' "$HUMAN"
          grep -q '不是經獨立驗證的全市場普通股數' "$HUMAN" || grep -q SOURCE_NOT_READY "$HUMAN"
          git diff --exit-code -- Worker.js wrangler.toml
          # Only after all source, hash, PIT and no-authorization assertions
          # are satisfied, make the complete human-readable report directly
          # visible under this exact GitHub Actions run's Summary tab.
          # Do NOT imply PR historic fixture is the newest market date.
          {
            echo '## System 2｜方案 C 非 PIT 選股研究預覽'
            if [ "$PHYSICAL_EXAMPLE_PR" = 'true' ]; then
              echo '**歷史真實資料回放（2026-10-13），非最新交易日、非已上線的當日選股。**'
            else
              echo '**實際來源研究觀察。須以報告列示的交易日、來源時點及資料延遲標記為準。**'
            fi
            echo "**來源交易日：** $(jq -r .marketDate "$M")"
            echo "**預覽狀態：** $(jq -r .state "$R")"
            echo "**是否延後：** $(jq -r .lateSource "$M")"
            echo "**T23:45 相對截止—獨立稽核完成：** $(jq -r .independentAuditOffsetMinutes "$M") 分鐘（正數晚到、負數提前）"
            echo "**T23:45 相對截止—預覽觀察形成：** $(jq -r '.previewObservationOffsetMinutes // "UNKNOWN"' "$M") 分鐘（正數晚到、負數提前）"
            echo "**來源截止狀態：** $(jq -r .researchReceiptCutStatus "$M")"
            echo "**GitHub 排程延遲／官方公布時點：** 本收據無法單獨歸因；不可將上述相對截止分鐘數稱作 GitHub dispatch lag 或官方發布延遲。"
            echo "**描述性符合：** $(jq -r '.descriptiveSourceMatches // "UNKNOWN"' "$R")"
            echo "**實際展示：** $(jq -r '.observedPreviewCount // "UNKNOWN"' "$R")"
            echo "**正式 selectedCount：** UNKNOWN（不是零檔）"
            echo "**PIT-A／PIT-B：** 未認證｜**Frozen／正式推播：** 禁止"
            echo ''
            cat "$HUMAN"
            echo ''
            echo "**報告 SHA256：** $(jq -r .reportHash "$M")"
          } >> "$GITHUB_STEP_SUMMARY"
          test -s "$GITHUB_STEP_SUMMARY"
          grep -q 'System 2｜方案 C 非 PIT 選股研究預覽' "$GITHUB_STEP_SUMMARY"
          grep -q "$(jq -r .marketDate "$M")" "$GITHUB_STEP_SUMMARY"
          grep -q '研究觀察候選股\|來源限定的觀察名單\|SOURCE_NOT_READY' "$GITHUB_STEP_SUMMARY"
          if [ "$PHYSICAL_EXAMPLE_PR" = 'true' ]; then
            grep -q '歷史真實資料回放（2026-10-13）' "$GITHUB_STEP_SUMMARY"
          fi
          echo "SCHEME_C_USER_READABLE_REPORT marketDate=$(jq -r .marketDate "$M"), late=$(jq -r .lateSource "$M"), report_SHA=$(jq -r .reportHash "$M")" >> "$GITHUB_STEP_SUMMARY"
          echo "SCHEME_C source tradingDate=$(jq -r .marketDate "$R"), source audit run=$UPSTREAM_AUDIT_RUN; readiness=$(jq -r .state "$R"); preview=$(jq -r .observedPreviewCount "$R"); PIT-A/B=NO, selected=null, Frozen=NO, no provider GET, no new Cron." >> "$GITHUB_STEP_SUMMARY"
      - name: Surface missing source or invalid receipt without pretending zero selections
        if: failure()
        env:
          PARENT_AUDIT_RUN: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || 'PR_TEST' }}
        run: |
          {
            echo '## System 2｜方案 C｜SOURCE_NOT_READY'
            echo '來源 Artifact 缺漏、SHA/交易日/截止驗證失敗，或報告無法安全產出。本輪**沒有獲得有效研究候選報告**。'
            echo "**上游稽核 Run：** $PARENT_AUDIT_RUN"
            echo '**來源交易日：** UNKNOWN（禁止以當前日曆日、昨日或 PR 回放替代）'
            echo '**正式 selectedCount：** UNKNOWN（不能視為 0 檔）'
            echo '**PIT-A／PIT-B：** 未認證；Frozen、正式推播、下單：未啟用。'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve derived research receipt AND human-readable report (no native raw quotes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s2-scheme-c-daily-source-bound-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/s2-scheme-c-daily-build-result/
          retention-days: 30
          if-no-files-found: warn

  show_unavailable_upstream_audit:
    # A failed native-A1 source audit, or self-triggered 121/122 historical
    # diagnostic, is NOT proof the strategy picked zero stocks.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.conclusion != 'success' ||
       github.event.workflow_run.event != 'workflow_run')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Make source-unavailable diagnosis directly visible
        env:
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_RUN: ${{ github.event.workflow_run.id }}
        run: |
          {
            echo '## System 2｜方案 C｜SOURCE_NOT_READY'
            echo "**上游原始稽核 Run：** $UPSTREAM_RUN"
            echo "**上游結論：** $UPSTREAM_CONCLUSION"
            echo "**上游事件類型：** $UPSTREAM_EVENT"
            echo '**來源交易日：** UNKNOWN（未取得合格來源，不能自行猜測）'
            echo '**研究觀察：** 無可認證來源輸出（不等於零候選）'
            echo '**正式 selectedCount：** UNKNOWN（不是 0 檔）'
            echo '**PIT-A／PIT-B：** 未認證；Frozen／正式推播／交易：禁止。'
          } >> "$GITHUB_STEP_SUMMARY"

  verify_real_20261016_single_audit_zip:
    # Exact 2026-10-16 official source and preliminary JSON from ONE
    # native independent 122/122 audit artifact, even if observed late.
    # This is a PR-only research replay, not daily operations or PIT.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download REAL 2026-10-16 exact 122-of-122 audit ZIP once
        uses: actions/download-artifact@v4
        with:
          run-id: 38934321405
          name: system2-shared-official-a1-independent-audit-38934321405
          path: /tmp/s2-real-20261016-same-audit/
          github-token: ${{ github.token }}
      - name: Source-bind exact signed A1 and V02 receipts, render only late NON-PIT
        env:
          S2_SCHEME_C_OUTPUT_PATH: /tmp/s2-real-20261016-output/daily-nonpit-preview.json
        run: |
          set -euo pipefail
          ROOT=/tmp/s2-real-20261016-same-audit
          test "$(find "$ROOT" -type f -name 'audit-receipt.json' | wc -l)" -eq 1
          test "$(find "$ROOT" -type f -name 'preliminary-pv-watch.json' | wc -l)" -eq 1
          AUDIT="$(find "$ROOT" -type f -name 'audit-receipt.json' -print -quit)"
          PREVIEW="$(find "$ROOT" -type f -name 'preliminary-pv-watch.json' -print -quit)"
          test -s "$AUDIT"
          test -s "$PREVIEW"
          test "$(jq -r .marketDate "$AUDIT")" = '2026-10-16'
          test "$(jq -r .marketDate "$PREVIEW")" = '2026-10-16'
          test "$(jq -r .verdict "$AUDIT")" = 'ACCEPTED_SOURCE_INTEGRITY_ONLY'
          test "$(jq -r .sourceMarketDatePairsVerified "$AUDIT")" = '122'
          test "$(jq -r .selectedCount "$PREVIEW")" = 'null'
          test "$(jq -r .zeroPickDay "$PREVIEW")" = 'null'
          node --test system2/tests/scheme_c_daily_audit_handoff_v0_1.test.mjs
          node --test system2/tests/scheme_c_daily_visible_report_v0_1.test.mjs
          node --test system2/tests/three_layer_selection_preview_router_v0_1.test.mjs
          node system2/scripts/run_scheme_c_daily_audit_handoff_readonly_v0_1.mjs "$AUDIT" "$PREVIEW" 38934321405
          R="$S2_SCHEME_C_OUTPUT_PATH"
          test -s "$R"
          test "$(jq -r .marketDate "$R")" = '2026-10-16'
          test "$(jq -r .auditRunId "$R")" = '38934321405'
          test "$(jq -r .state "$R")" = 'NON_PIT_SOURCE_OBSERVATION_READY'
          test "$(jq -r .previewReport.state "$R")" = 'LATE_SOURCE_DESCRIPTIVE_PREVIEW_ONLY'
          test "$(jq -r .observedPreviewCount "$R")" = '30'
          test "$(jq -r '.previewReport.previewRows | length' "$R")" = '30'
          test "$(jq -r .selectedCount "$R")" = 'null'
          test "$(jq -r .zeroPickDay "$R")" = 'null'
          test "$(jq -r .pitACertificationGranted "$R")" = 'false'
          test "$(jq -r .pitBCertificationGranted "$R")" = 'false'
          test "$(jq -r .frozenD1Written "$R")" = 'false'
          test "$(jq -r .cloudflareD1Writes "$R")" = '0'
          test "$(jq -r .cloudflareR2Writes "$R")" = '0'
          node system2/scripts/run_scheme_c_visible_report_readonly_v0_1.mjs "$R" /tmp/s2-real-20261016-output
          HUMAN=/tmp/s2-real-20261016-output/daily-nonpit-preview.md
          META=/tmp/s2-real-20261016-output/daily-nonpit-preview-meta.json
          test -s "$HUMAN"
          test -s "$META"
          grep -q '2026-10-16 非 PIT 研究預覽' "$HUMAN"
          grep -q 'LATE_SOURCE' "$HUMAN"
          test "$(jq -r .lateSource "$META")" = 'true'
          test "$(jq -r .strategySelectedCount "$META")" = 'null'
          test "$(jq -r .pitACertified "$META")" = 'false'
          test "$(jq -r .frozenWritten "$META")" = 'false'
          test "$(jq -r .independentAuditOffsetMinutes "$META" | awk '{print ($1 > 0)}')" = '1'
          test "$(jq -r .previewObservationOffsetMinutes "$META" | awk '{print ($1 > 0)}')" = '1'
          test "$(jq -r .schedulerDispatchDelayMinutes "$META")" = 'null'
          test "$(jq -r .researchReceiptCutStatus "$META")" = 'SOURCE_OBSERVED_AFTER_T2345_DESCRIPTIVE_ONLY'
          {
            echo '## Scheme C｜2026/10/16 真實 122/122 同一稽核 ZIP 實體驗收'
            echo '**僅是晚到真實資料的歷史研究回放，不能倒填 10/16 正式選股，也不是 10/19 自動營運驗收。**'
            echo "**原稽核 Run：** 38934321405"
            echo "**預覽來源狀態：** $(jq -r .state "$R")"
            echo "**顯示候選：** $(jq -r .observedPreviewCount "$R")（研究觀察，非正式 selectedCount）"
            echo "**報告 SHA：** $(jq -r .reportHash "$META")"
            echo "**固定 T23:45 相對截止：** 獨立稽核 $(jq -r .independentAuditOffsetMinutes "$META") 分鐘；預覽形成 $(jq -r .previewObservationOffsetMinutes "$META") 分鐘。不能推論 GH scheduler 或 provider 出版時間。"
            echo '**PIT-A/B＝未認證；Frozen、推播、交易均未啟用。**'
            echo ''
            cat "$HUMAN"
          } >> "$GITHUB_STEP_SUMMARY"
          git diff --exit-code -- Worker.js wrangler.toml
      - name: Keep physical Oct16 same-run derived result, NO original market bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s2-scheme-c-real-20261016-same-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/s2-real-20261016-output/
          retention-days: 30
          if-no-files-found: warn
