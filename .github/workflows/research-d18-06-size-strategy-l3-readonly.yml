name: Research D18-06 Size Strategy L3 Readonly

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/d18_06_size_strategy_interaction_l3_v0_1.mjs"
      - "tests/test_d18_06_size_strategy_interaction_l3_v0_1.mjs"
      - "research/br037_size_leadership_receipt_20261001_v0_1.json"
      - ".github/workflows/research-d18-06-size-strategy-l3-readonly.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run D18-06 size-strategy L3 suite
        run: node tests/test_d18_06_size_strategy_interaction_l3_v0_1.mjs
      - name: Confirm research-only isolation
        shell: bash
        run: |
          set -euo pipefail
          ! grep -qE 'wrangler|deploy|CLOUDFLARE|ADMIN_TOKEN|V7_ADMIN_TOKEN|THREEMIN|fetch\(|INSERT|UPDATE|DELETE|CREATE TABLE|DROP TABLE' research/d18_06_size_strategy_interaction_l3_v0_1.mjs
          grep -F 'selectionImpact:false' research/d18_06_size_strategy_interaction_l3_v0_1.mjs
          grep -F 'rankingImpact:false' research/d18_06_size_strategy_interaction_l3_v0_1.mjs
          grep -F 'capitalImpact:false' research/d18_06_size_strategy_interaction_l3_v0_1.mjs
          grep -F 'formalCoreChanged:false' research/d18_06_size_strategy_interaction_l3_v0_1.mjs
          echo "Research-only D18-06 boundary PASS"
