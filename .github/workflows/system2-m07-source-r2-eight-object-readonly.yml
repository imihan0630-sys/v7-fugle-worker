name: S2 M07 SOURCE R2 8 Object Original Byte SHA (BOUNDED READONLY)
# Source environment only. 1 LIST, <=8 HEAD and 8 GET, <=512 KiB object data.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/system2-m07-source-r2-eight-object-readonly.yml
permissions:
  contents: read
concurrency:
  group: s2-m07-source-r2-eight-object-readonly-single
  cancel-in-progress: false
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: system2-research
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Eight-item original bytes and negative quota tests
        run: |
          set -euo pipefail
          node --check system2/migration/issue1236_m07_source_r2_eight_object_sha_v0_1.mjs
          node system2/tests/issue1236_m07_source_r2_eight_object_sha_v0_1.test.mjs
      - name: Authenticated original source R2 bounded list-head-get readback
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYSTEM2_R2_ACCESS_KEY_ID: ${{ secrets.SYSTEM2_R2_ACCESS_KEY_ID }}
          SYSTEM2_R2_SECRET_ACCESS_KEY: ${{ secrets.SYSTEM2_R2_SECRET_ACCESS_KEY }}
          SYSTEM2_R2_BUCKET: ${{ vars.SYSTEM2_R2_BUCKET }}
        run: node system2/migration/issue1236_m07_source_r2_eight_object_sha_v0_1.mjs
      - name: Store sanitized key-hashes and body SHA receipts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s2-m07-source-r2-eight-objects-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/s2-m07-source-eight-objects/sanitized-original-source-bodies.json
          if-no-files-found: warn
          retention-days: 30
