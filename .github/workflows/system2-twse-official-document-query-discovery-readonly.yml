name: System2 TWSE Official Document Query Discovery Readonly

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "system2/scripts/probe_twse_official_document_query_discovery_readonly_v0_1.mjs"
      - "system2/SYSTEM2_TWSE_OFFICIAL_DOCUMENT_QUERY_DISCOVERY_V0_1.md"
      - ".github/workflows/system2-twse-official-document-query-discovery-readonly.yml"
  push:
    branches: [main]
    paths:
      - "system2/scripts/probe_twse_official_document_query_discovery_readonly_v0_1.mjs"
      - "system2/SYSTEM2_TWSE_OFFICIAL_DOCUMENT_QUERY_DISCOVERY_V0_1.md"
      - ".github/workflows/system2-twse-official-document-query-discovery-readonly.yml"

permissions:
  contents: read

concurrency:
  group: system2-twse-official-document-query-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Discover official-document query contract
        run: node system2/scripts/probe_twse_official_document_query_discovery_readonly_v0_1.mjs
      - name: Confirm read-only boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -qE 'CLOUDFLARE|SYSTEM2_DB|wrangler|secret|deploy|INSERT|UPDATE|DELETE' system2/scripts/probe_twse_official_document_query_discovery_readonly_v0_1.mjs
          echo "Read-only official-document query discovery boundary PASS"
