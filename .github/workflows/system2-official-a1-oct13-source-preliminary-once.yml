name: System2 20261013 TWSE TPEx Actual Close Preliminary READONLY ONCE
# Research-only. Runs exactly on adding this workflow file to main; remove
# after original provider observation. NOT full 61-session/PIT/selection audit.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/system2-official-a1-oct13-source-preliminary-once.yml"

permissions:
  contents: read

jobs:
  observe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Physical official exact market-date observation (NO D1, NO SELECTION)
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {mkdir,writeFile} from 'node:fs/promises';
          import {gzipSync} from 'node:zlib';
          import {createHash} from 'node:crypto';
          import {buildOfficialHistoricalA1UrlV0_1,parseOfficialHistoricalA1PayloadV0_1}
            from './system2/runtime/official_historical_a1_source_v0_1.mjs';
          const targetDate='2026-10-13';
          const root='/tmp/s2-a1-1013-preliminary-physical-source';
          await mkdir(root,{recursive:true,mode:0o700});
          const rows=[];
          for(const market of ['TWSE','TPEX']){
            const url=buildOfficialHistoricalA1UrlV0_1(market,targetDate);
            const observation={market,marketDate:targetDate,sourceUrl:url,
              state:'NOT_READY',observedAtUtc:null,rawSha256:null,
              compressedBytes:null,originalBytes:null,ordinarySymbolCount:null,
              providerReportedDate:null,reasonCode:null};
            try{
              const response=await fetch(url,{method:'GET',
                headers:{accept:'application/json'},
                signal:AbortSignal.timeout(25000)});
              const raw=Buffer.from(await response.arrayBuffer());
              observation.observedAtUtc=new Date().toISOString();
              observation.httpStatus=response.status;
              if(!response.ok)throw Error('HTTP_NOT_OK');
              observation.rawSha256=createHash('sha256').update(raw).digest('hex');
              observation.originalBytes=raw.byteLength;
              // Do not persist incomplete/error HTML or wrong-date payloads as
              // authenticated official raw closing evidence.
              const source=parseOfficialHistoricalA1PayloadV0_1({
                market,marketDate:targetDate,payload:JSON.parse(raw.toString('utf8')),
                observedAt:observation.observedAtUtc,sourceUrl:url});
              observation.providerReportedDate=source.sourceDateEvidence;
              observation.ordinarySymbolCount=source.ordinarySymbolCount;
              if(source.state!=='READY'||source.ordinarySymbolCount<
                (market==='TWSE'?600:450))throw Error('CANONICAL_CLOSE_ROW_COVERAGE_INCOMPLETE');
              const gz=gzipSync(raw,{level:6});
              await writeFile(root+'/'+market+'-'+targetDate+'.json.gz',gz,{flag:'wx'});
              observation.compressedBytes=gz.byteLength;
              observation.state='OFFICIAL_EXACT_DATE_A1_CLOSE_OBSERVED_PIT_UNAUDITED';
              observation.reasonCode=null;
            }catch(error){
              const msg=String(error?.message||'ERROR');
              observation.reasonCode=msg.includes('daily table not found')?
                'OFFICIAL_CLOSE_TABLE_NOT_YET_PUBLISHED':
                msg.includes('SOURCE_DATE_MISMATCH')?'WRONG_REPORTED_DATE':
                msg.includes('CANONICAL_CLOSE_ROW_COVERAGE_INCOMPLETE')?
                  'SOURCE_ROW_COVERAGE_INCOMPLETE':
                msg.includes('HTTP_NOT_OK')?'HTTP_NOT_OK':'OFFICIAL_SOURCE_NOT_READY_OR_PARSE_FAILED';
            }
            rows.push(observation);
          }
          const result={schemaVersion:'S2_1013_A1_TWO_PROVIDER_REAL_OBSERVATION_V0_1',
            state:rows.every(x=>x.state==='OFFICIAL_EXACT_DATE_A1_CLOSE_OBSERVED_PIT_UNAUDITED')?
               'BOTH_OFFICIAL_DAILY_CLOSED_PAYLOADS_OBSERVED_PIT_UNAUDITED':
               'INCOMPLETE_OFFICIAL_DAILY_SOURCE',
            targetDate,rows,source61SessionPairsAccepted:null,source61SessionComplete:false,
            strategyPITCertified:false,corporateActionContinuityCertified:false,
            actualSelectedCount:null,zeroPickDay:null,frozenD1Writes:0,
            officialSourceOnly:true,system1FormalRuntimeTouched:false,
            paidServiceUsed:false};
          await writeFile(root+'/observation.json',JSON.stringify(result,null,2)+'\n',
            {flag:'wx'});
          console.log(JSON.stringify(result));
          if(result.state!=='BOTH_OFFICIAL_DAILY_CLOSED_PAYLOADS_OBSERVED_PIT_UNAUDITED')
             process.exitCode=2;
          NODE
      - name: Preserve one-shot source witnesses (7-day temporary, not immutable)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s2-a1-1013-source-preliminary-${{ github.run_id }}
          path: /tmp/s2-a1-1013-preliminary-physical-source/
          retention-days: 7
          if-no-files-found: warn
      - name: Read-only safety declaration
        if: always()
        run: |
          echo 'Only two official HTTPS GETs for 2026-10-13 TWSE/TPEx; no Cloudflare D1, no System1 Formal, no source promotion, no trading, no paid resources.' >> "$GITHUB_STEP_SUMMARY"
