name: D02 PVE280 D16 Semantic Admission Binding

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/d02_pve280_d16_semantic_admission_binding_v0_1.mjs"
      - "tests/test_d02_pve280_d16_semantic_admission_binding_v0_1.mjs"
      - ".github/workflows/d02-pve280-d16-semantic-admission-binding.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/test_d02_pve280_d16_semantic_admission_binding_v0_1.mjs
