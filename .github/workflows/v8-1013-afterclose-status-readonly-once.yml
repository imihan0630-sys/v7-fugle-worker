name: S1 V8 Exact Oct13 After-Close Source/Monitor READONLY ONCE
on:
  push:
    branches:
      - ops/v8-20261013-afterclose-physical-status-readonly
    paths:
      - .github/workflows/v8-1013-afterclose-status-readonly-once.yml
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
    steps:
      - name: Five source/selection/monitor GETs, no Formal scan, orders or writes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import {writeFile} from "node:fs/promises";
          const base="https://fugle-test.imihan0630.workers.dev",day="2026-10-13";
          const token=process.env.V7_ADMIN_TOKEN;
          if(!token)throw Error("ADMIN_SECRET_NOT_CONFIGURED");
          const headers={"x-admin-token":token,accept:"application/json"};
          const record={schema:"V8_1013_AFTERCLOSE_LIVE_HEALTH_GET_ONLY",observedAt:new Date().toISOString(),
            requestedMarketDate:day,noMutation:true,noD1Write:true,noKVWrite:true,noPlanUpdate:true,
            noTrade:true,no3MinWrite:true,noPush:true,live:{},errors:[]};
          async function get(key,path){
             const response=await fetch(base+path,{headers,signal:AbortSignal.timeout(23000)});
             if(!response.ok){record.errors.push(key+"_HTTP_"+response.status);return {};}
             return response.json();
          }
          try {
            const [market,institution,quality,scan,config,signal,cron]=await Promise.all([
               get("market","/api/market-data/status?marketDate="+day),
               get("institution","/api/institution-status?marketDate="+day),
               get("quality","/api/quality-status?marketDate="+day),
               get("scan","/api/scan/status"),
               get("config","/api/config"),
               get("signal","/api/signals"),
               get("cron","/api/cron/status")]);
            record.live={
              marketDate:market.marketDate??null,marketReady:market.ready===true,
              twse:market.markets?.TWSE?.ready===true,tpex:market.markets?.TPEx?.ready===true,
              institutionDate:institution.marketDate??null,institutionReady:institution.ready===true,
              institutionValidDates:institution.validDates??null,
              qualityDate:quality.marketDate??null,indexReady:quality.index?.ready===true,tdccReady:quality.tdcc?.ready===true,
              datasets:Object.fromEntries(["FINANCIAL","VALUATION","ANNOUNCEMENTS","QUARTER_EPS"].map(n=>[n,quality.datasets?.[n]?.ready===true])),
              scanDate:scan.scanDate??null,formalComplete:scan.pipeline?.complete===true,
              monitorSymbols:Array.isArray(config.stocks)?config.stocks.map(s=>s.symbol):null,
              monitorPlanDates:Array.isArray(config.stocks)?[...new Set(config.stocks.map(s=>s.planDate))]:null,
              monitorCapital:config.totalCapital??null,
              signalAt:signal.generatedAt??signal.checkedAt??null,
              cronAt:cron.latest?.scheduled_at??null,
              cronKind:cron.latest?.job_type??null,
              cronStatus:cron.latest?.status??null
            };
          }catch(e){record.errors.push("EXCEPTION:"+String(e.message||e).slice(0,250));}
          finally{
            await writeFile("artifacts/v8-afterclose-20261013-readonly.json",JSON.stringify(record,null,2)+"\n");
            console.log("V8_OCT13_ACTUAL_SOURCE_MONITOR_HEALTH="+JSON.stringify(record));
            if(record.errors.length)process.exitCode=2;
          }
          NODE
      - name: Preserve source-state evidence (no account write)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-oct13-afterclose-readonly-${{ github.run_id }}
          path: artifacts/v8-afterclose-20261013-readonly.json
          if-no-files-found: error
          retention-days: 60
