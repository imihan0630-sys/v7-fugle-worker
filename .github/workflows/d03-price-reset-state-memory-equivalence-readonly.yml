name: D03 Price Reset State Memory Equivalence Readonly

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/d03_price_reset_state_memory_equivalence_20261008_v0_1.json"
      - "research/test_d03_price_reset_state_memory_equivalence_v0_1.mjs"
      - ".github/workflows/d03-price-reset-state-memory-equivalence-readonly.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run price-reset state-memory equivalence oracle
        run: node research/test_d03_price_reset_state_memory_equivalence_v0_1.mjs
      - name: Confirm research-only isolation
        shell: bash
        run: |
          set -euo pipefail
          ! grep -qE 'wrangler|INSERT|UPDATE|DELETE|sendPush|processSignalState' research/test_d03_price_reset_state_memory_equivalence_v0_1.mjs
          echo "D03 state-memory equivalence isolation PASS"
