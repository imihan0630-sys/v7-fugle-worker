name: System2 New Account Destination Physical Schema GET Only ONCE 20261011
# TEMPORARY main-only physical credential readback. Delete after original receipt.
# Has no D1 data copy, no schema DDL, no Worker/Cron/R2/Secret operation.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/system2-dest-d1-schema-physical-once-20261011.yml
permissions:
  contents: read
concurrency:
  group: s2-dest-schema-metadata-real-provider-once-20261011
  cancel-in-progress: false
jobs:
  dest_d1_metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: system2-schema-only
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify immutable V8 protection and schema-only readback contract
        run: |
          set -euo pipefail
          node --check system2/migration/cross_account_source_dest_schema_metadata_probe_20261011.mjs
          git diff --exit-code -- Worker.js wrangler.toml
          node -e "const fs=require('node:fs');const s=fs.readFileSync('system2/migration/cross_account_source_dest_schema_metadata_probe_20261011.mjs','utf8');if(!s.includes('SQLITE_SCHEMA_ONLY')||!s.includes('sourceDataBackupPhysicallyDone=false'))process.exit(2)"
      - name: GET existing destination D1 metadata and read SQLite schema without mutation
        env:
          S2_PREFLIGHT_ACCOUNT_ID: ${{ secrets.S2_SCHEMA_DEST_ACCOUNT_ID }}
          S2_PREFLIGHT_D1_TOKEN: ${{ secrets.S2_SCHEMA_DEST_D1_WRITE_TOKEN }}
        run: node system2/migration/cross_account_source_dest_schema_metadata_probe_20261011.mjs DEST
      - name: Upload sanitized provider receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s2-dest-physical-schema-${{ github.run_id }}
          path: /tmp/s2-migration-physical-dest/sanitized-dest.json
          if-no-files-found: warn
          retention-days: 60
      - name: Nonpromotion statement
        if: always()
        run: echo 'GET D1 metadata and SELECT sqlite_schema only. Does NOT imply full historical copy, R2 or any Shadow/Cron activation.' >> "$GITHUB_STEP_SUMMARY"
