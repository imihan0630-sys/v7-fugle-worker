name: V8 3Min and Phone Push Configuration Physical READ ONLY ONCE 20261013
on:
  push:
    branches:
      - ops/v8-3min-push-bridge-readonly-probe-20261013
    paths:
      - .github/workflows/v8-3min-push-readonly-probe-once-20261013.yml
permissions:
  contents: read
jobs:
  original_real_metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      V7_ADMIN_TOKEN: ${{ secrets.V7_ADMIN_TOKEN }}
    steps:
      - name: Real production Worker bindings and GET-only business-state proof; never reveal endpoint values or secrets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node --input-type=module <<'NODE'
          import {writeFile} from "node:fs/promises";
          import {createHash} from "node:crypto";
          const account=process.env.CLOUDFLARE_ACCOUNT_ID||"";
          const token=process.env.CLOUDFLARE_API_TOKEN||"";
          const admin=process.env.V7_ADMIN_TOKEN||"";
          const out={schemaVersion:"S1_V8_BRIDGE_METADATA_REAL_READONLY_V0_1",
            at:new Date().toISOString(),scope:"SYSTEM1_FUGLE_TEST_ONLY",
            noWorkerMutation:true,noSecretRead:true,noD1Write:true,no3MinGet:true,no3MinPost:true,noPush:true,noTrade:true,
            checks:{},live:{},errors:[]};
          if(!/^[0-9a-f]{32}$/i.test(account)||!token||!admin)throw Error("SOURCE_ACCOUNT_OR_AUTH_MISSING");
          async function call(url,headers){
            const res=await fetch(url,{method:"GET",headers,signal:AbortSignal.timeout(20000)});
            const data=await res.json().catch(()=>null);
            if(!res.ok||data?.success===false)throw Error("READONLY_HTTP_"+res.status);
            return data;
          }
          try{
            const base="https://api.cloudflare.com/client/v4/accounts/"+account;
            const settings=(await call(base+"/workers/scripts/fugle-test/settings",{Authorization:"Bearer "+token})).result;
            const cronRaw=(await call(base+"/workers/scripts/fugle-test/schedules",{Authorization:"Bearer "+token})).result;
            const schedules=Array.isArray(cronRaw)?cronRaw:(Array.isArray(cronRaw?.schedules)?cronRaw.schedules:null);
            const byName=new Map((settings.bindings||[]).map(x=>[x.name,x]));
            for(const n of ["THREEMIN_API_URL","THREEMIN_VERIFY_URL","THREEMIN_API_TOKEN","PUSH_WEBHOOK_URL","FUGLE_API_KEY","V7_DB","STOCKS_KV"]){
              const binding=byName.get(n);
              out.checks[n]={present:Boolean(binding),
                bindingType:binding?.type||null,
                valueConfigured:binding?.type==="plain_text"?Boolean(binding?.text):Boolean(binding)};
            }
            out.checks.cloudCronCount=Array.isArray(schedules)?schedules.length:null;
            out.checks.hasOriginalIntradayCron=Array.isArray(schedules)&&schedules.some(s=>String(s.cron||"")==="* 1-4 * * MON-FRI");
            const gh={"x-admin-token":admin,accept:"application/json"};
            const worker="https://fugle-test.imihan0630.workers.dev";
            const [version,scan,config,cron]=await Promise.all([
              call(worker+"/api/version",gh),call(worker+"/api/scan/status",gh),
              call(worker+"/api/config",gh),call(worker+"/api/cron/status",gh)]);
            out.live={version:version.version||null,testMode:version.testMode??null,
              versionBridgeFlags:{threeMin:Boolean(version.readiness?.threeMin),
                threeMinReadback:Boolean(version.readiness?.threeMinReadback),phonePush:Boolean(version.readiness?.phonePush)},
              scanDate:scan.scanDate||null,scanPipelineComplete:scan.pipeline?.complete===true,
              scan3MinAccepted:scan.threeMin?.sent===true,scan3MinVerified:scan.threeMin?.verified===true,
              scanDailyPushAccepted:scan.dailyReport?.sent===true,
              currentMonitorCount:Array.isArray(config.stocks)?config.stocks.length:null,
              currentMonitorUpdatedAt:config.updatedAt||null,cronLatestType:cron.latest?.job_type||null,
              cronLatestDate:cron.latest?.scheduled_at||null};
            out.certification=out.live.scanPipelineComplete&&out.live.scan3MinVerified&&out.live.scanDailyPushAccepted ?
              "ARCHIVED_RECEIPT_FLAGS_PRESENT_NEEDS_INDEPENDENT_EXTERNAL_CHECK":
              "FORMAL_ARCHIVE_3MIN_PUSH_NOT_VERIFIED";
          }catch(e){out.errors.push(String(e.message||e).slice(0,160));out.certification="PROVIDER_READBACK_BLOCKED";}
          out.fingerprint=createHash("sha256").update(JSON.stringify({checks:out.checks,live:out.live,errors:out.errors})).digest("hex");
          await writeFile("artifacts/s1-v8-3min-phonepush-metadata-readonly-20261013.json",JSON.stringify(out,null,2)+"\n");
          console.log("S1_V8_BRIDGE_REAL_METADATA="+JSON.stringify(out));
          if(out.errors.length)process.exitCode=2;
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s1-v8-3min-phonepush-source-${{ github.run_id }}
          path: artifacts/s1-v8-3min-phonepush-metadata-readonly-20261013.json
          if-no-files-found: error
          retention-days: 60
