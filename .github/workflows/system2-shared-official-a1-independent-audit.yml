name: System2 Shared Official A1 Independent Source Audit (READ ONLY)

on:
  # Audit every genuinely completed successful main source capture independently.
  workflow_run:
    workflows: ["System2 Shared Official TWSE TPEx A1 Incremental (READ ONLY)"]
    types: [completed]
  # Initial self-path push performs a strictly negative 121/122 historical diagnostic.
  push:
    branches: [main]
    paths:
      - ".github/workflows/system2-shared-official-a1-independent-audit.yml"
  workflow_dispatch:
    inputs:
      source_run_id:
        required: true
        description: Exact shared source workflow run ID for independent readback
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: shared-a1-independent-readonly-audit
  cancel-in-progress: false

jobs:
  audit_original:
    if: >-
      github.repository == 'imihan0630-sys/v7-fugle-worker' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify source auditor cannot select, freeze, write Cloudflare or issue trades
        run: |
          set -euo pipefail
          node --check system2/scripts/audit_shared_official_a1_source_v0_1.mjs
          node --test system2/tests/shared_official_a1_independent_audit_v0_1.test.mjs
          git diff --exit-code -- Worker.js wrangler.toml
      - name: Resolve exact source run and explicit diagnostic boundary
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          MANUAL_RUN: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            SOURCE_ID=38351651871
            echo 'diagnostic_only=true' >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_run" ]; then
            SOURCE_ID="$SOURCE_RUN"
            echo 'diagnostic_only=false' >> "$GITHUB_OUTPUT"
          else
            SOURCE_ID="$MANUAL_RUN"
            echo 'diagnostic_only=false' >> "$GITHUB_OUTPUT"
          fi
          test -n "$SOURCE_ID"
          case "$SOURCE_ID" in (*[!0-9]*) exit 2;; esac
          echo "run_id=$SOURCE_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_name=s2-shared-official-a1-$SOURCE_ID" >> "$GITHUB_OUTPUT"
      - name: Download original exact-run source evidence
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.source.outputs.run_id }}
          name: ${{ steps.source.outputs.artifact_name }}
          path: /tmp/s2-source-for-independent-readback
          github-token: ${{ github.token }}
      - name: Re-read all original bytes, official report dates, row counts and calendar
        env:
          S2_A1_AUDIT_SOURCE_DIR: /tmp/s2-source-for-independent-readback
          S2_A1_EXPECT_INCOMPLETE_DIAGNOSTIC: ${{ steps.source.outputs.diagnostic_only }}
        run: |
          set -euo pipefail
          node system2/scripts/audit_shared_official_a1_source_v0_1.mjs
      - name: Enforce source-only verdict and prevent partial admission
        env:
          DIAGNOSTIC_ONLY: ${{ steps.source.outputs.diagnostic_only }}
        run: |
          set -euo pipefail
          RECEIPT='/tmp/s2-shared-a1-independent-audit/audit-receipt.json'
          test -s "$RECEIPT"
          test "$(jq -r .sourceMarketDatePairsVerified "$RECEIPT")" -le 122
          test "$(jq -r .selectionAuthorized "$RECEIPT")" = 'false'
          test "$(jq -r .strategyPitCertified "$RECEIPT")" = 'false'
          test "$(jq -r .frozenWritten "$RECEIPT")" = 'false'
          if [ "$DIAGNOSTIC_ONLY" = 'true' ]; then
            test "$(jq -r .verdict "$RECEIPT")" = 'BLOCKED_SOURCE_INCOMPLETE'
            test "$(jq -r .sourceMarketDatePairsVerified "$RECEIPT")" = '121'
            echo 'EXPECTED_PARTIAL_121_OF_122_FAIL_CLOSED_NOT_ADMITTED' >> "$GITHUB_STEP_SUMMARY"
          else
            test "$(jq -r .verdict "$RECEIPT")" = 'ACCEPTED_SOURCE_INTEGRITY_ONLY'
            test "$(jq -r .sourceMarketDatePairsVerified "$RECEIPT")" = '122'
            echo 'INDEPENDENT_SOURCE_INTEGRITY_122_OF_122_PASS__STRATEGY_PIT_NOT_AUTHORIZED' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build source-only full-universe ledger and attempt existing Stage1 with UNKNOWN continuity
        env:
          S2_A1_AUDIT_SOURCE_DIR: /tmp/s2-source-for-independent-readback
          S2_A1_AUDIT_RECEIPT_FILE: /tmp/s2-shared-a1-independent-audit/audit-receipt.json
        run: |
          set -euo pipefail
          node --check system2/scripts/run_shared_official_a1_stage1_readonly_v0_1.mjs
          node --test system2/tests/shared_official_a1_source_ledger_bridge_v0_1.test.mjs
          node --test system2/tests/daily_selection_readiness_v0_1.test.mjs
          node --test system2/tests/preliminary_daily_pv_watch_v0_1.test.mjs
          node --test system2/tests/preliminary_daily_user_report_v0_1.test.mjs
          node --test system2/tests/a1_history_barrier_diagnostic_v0_1.test.mjs
          node system2/scripts/run_shared_official_a1_stage1_readonly_v0_1.mjs
      - name: Audit source-ledger and strategy-only semantics, never Frozen
        env:
          DIAGNOSTIC_ONLY: ${{ steps.source.outputs.diagnostic_only }}
        run: |
          set -euo pipefail
          SUMMARY='/tmp/s2-a1-stage1-readonly/summary.json'
          test -s "$SUMMARY"
          test "$(jq -r .selectedCount "$SUMMARY")" = 'null'
          test "$(jq -r .zeroPickDay "$SUMMARY")" = 'null'
          test "$(jq -r .selectionAuthorized "$SUMMARY")" = 'false'
          test "$(jq -r .strategyPitCertified "$SUMMARY")" = 'false'
          test "$(jq -r .frozenDecisionWritten "$SUMMARY")" = 'false'
          REPORT='/tmp/s2-a1-stage1-readonly/preliminary-watch-report.md'
          META='/tmp/s2-a1-stage1-readonly/preliminary-watch-report-meta.json'
          test -s "$REPORT"
          test -s "$META"
          test "$(jq -r .selectedCount "$META")" = 'null'
          test "$(jq -r .finalSelectionAuthorized "$META")" = 'false'
          test "$(jq -r .backtestCertified "$META")" = 'false'
          test "$(jq -r .frozenWritten "$META")" = 'false'
          grep -q '非正式選股' "$REPORT" || grep -q '來源不足' "$REPORT"
          PRELIMINARY='/tmp/s2-a1-stage1-readonly/preliminary-pv-watch.json'
          test -s "$PRELIMINARY"
          test "$(jq -r .selectedCount "$PRELIMINARY")" = 'null'
          test "$(jq -r .zeroPickDay "$PRELIMINARY")" = 'null'
          test "$(jq -r .finalSelectionAuthorized "$PRELIMINARY")" = 'false'
          test "$(jq -r .historicalBacktestCertified "$PRELIMINARY")" = 'false'
          test "$(jq -r .frozenWritten "$PRELIMINARY")" = 'false'
          test "$(jq -r .watchVersion "$PRELIMINARY")" = 'PRELIMINARY_PRICE_VOLUME_OBSERVATION_V0_2'
          if [ "$(jq -r .state "$PRELIMINARY")" = 'PRELIMINARY_DAILY_OBSERVATION_NOT_FORMAL_SELECTION' ]; then
            test "$(jq -r .ordinaryEquityOnlyUniverseCertified "$PRELIMINARY")" = 'false'
            test "$(jq -r .depositaryReceiptQuarantinedCount "$PRELIMINARY")" -ge 0
            test "$(jq -r '.watchlist | all(.[]; .instrumentClassPITStatus == "ORDINARY_EQUITY_CLASS_NOT_INDEPENDENTLY_ATTESTED")' "$PRELIMINARY")" = 'true'
            echo "PRELIMINARY_EXCLUDED_TDR=$(jq -r .depositaryReceiptQuarantinedCount "$PRELIMINARY") / securities-universe-NOT-certified-ordinary" >> "$GITHUB_STEP_SUMMARY"
          fi
          READINESS='/tmp/s2-a1-stage1-readonly/daily-selection-readiness.json'
          test -s "$READINESS"
          test "$(jq -r .selectedCount "$READINESS")" = 'null'
          test "$(jq -r .zeroPickDay "$READINESS")" = 'null'
          test "$(jq -r .finalSelectionEligible "$READINESS")" = 'false'
          test "$(jq -r .frozenDecisionWritten "$READINESS")" = 'false'
          test "$(jq -r .sourcePairsRequired "$READINESS")" = '122'
          if [ "$DIAGNOSTIC_ONLY" = 'true' ]; then
            test ! -e /tmp/s2-a1-stage1-readonly/history-barrier.json
            test "$(jq -r .state "$READINESS")" = 'BLOCKED_SOURCE_NOT_SELECTION'
            test "$(jq -r .state "$PRELIMINARY")" = 'BLOCKED_SOURCE_INCOMPLETE'
            test "$(jq -r .sourcePairs "$SUMMARY")" = '121'
            test "$(jq -r .sourceLedgerHash "$SUMMARY")" = 'null'
            echo 'ORIGINAL_121_122_EXPECTED_DENIAL; NO_PRELIMINARY_OR_FORMAL_SELECTION' >> "$GITHUB_STEP_SUMMARY"
          else
            test "$(jq -r .marketDate "$READINESS")" = "$(jq -r .marketDate "$SUMMARY")"
            test "$(jq -r .sourcePairsObserved "$READINESS")" = '122'
            test "$(jq -r .sourcePairs "$SUMMARY")" = '122'
            test "$(jq -r .marketDate "$PRELIMINARY")" = "$(jq -r .marketDate "$READINESS")"
            if [ "$(jq -r .state "$READINESS")" = 'BLOCKED_SOURCE_NOT_SELECTION' ]; then
              # GitHub scheduler may actually start after the strict T+1 01:59
              # formal clock. No retroactive frozen picks, but the current
              # pre-market 02:00-08:59 as-of-now observation may still report
              # a separate explicitly late PRELIMINARY research shortlist.
              test "$(jq -r .state "$SUMMARY")" = 'BLOCKED_NO_ELIGIBLE_SOURCE_LEDGER'
              test "$(jq -r '.blockers | index("SOURCE_OBSERVATION_OUTSIDE_T_OR_T_PLUS_ONE_WINDOW") != null' "$SUMMARY")" = 'true'
              test ! -e /tmp/s2-a1-stage1-readonly/history-barrier.json
              PRELIM_STATE="$(jq -r .state "$PRELIMINARY")"
              if [ "$PRELIM_STATE" = 'PRELIMINARY_DAILY_OBSERVATION_NOT_FORMAL_SELECTION' ]; then
                test "$(jq -r .lateMorningObservationNotBackdated "$PRELIMINARY")" = 'true'
                test "$(jq -r .officialUniverseCount "$PRELIMINARY")" -ge 1000
                echo 'LATE_SCHEDULE_PRELIMINARY_AS_OF_ACTUAL_OBSERVATION_ONLY; STAGE1_PIT_CLOCK_EXPIRED' >> "$GITHUB_STEP_SUMMARY"
              else
                test "$PRELIM_STATE" = 'BLOCKED_SOURCE_INCOMPLETE'
                echo 'LATE_SOURCE_OUTSIDE_PREMARKET_WINDOW__NO_PRELIMINARY_OR_FROZEN' >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              test "$(jq -r .state "$SUMMARY")" = 'STAGE1_RESEARCH_EXECUTED_PIT_CONTINUITY_GATED'
              test "$(jq -r .verifiedSourceUniverseCount "$SUMMARY")" -ge 1000
              test "$(jq -r .strategyEvaluationState "$SUMMARY")" = 'INCOMPLETE_SOURCE_OR_STRATEGY_EVIDENCE'
              test "$(jq -r .state "$PRELIMINARY")" = 'PRELIMINARY_DAILY_OBSERVATION_NOT_FORMAL_SELECTION'
              test "$(jq -r .officialUniverseCount "$PRELIMINARY")" = "$(jq -r .ordinaryUniverseCount "$READINESS")"
              H=/tmp/s2-a1-stage1-readonly/history-barrier.json
              test -s "$H"
              test "$(jq -r .selectedCount "$H")" = 'null'
              test "$(jq -r .frozenWritten "$H")" = 'false'
              test "$(jq -r .ordinaryUniverseCount "$H")" = "$(jq -r .ordinaryUniverseCount "$READINESS")"
              test "$(jq -r .stage1IncompleteCount "$H")" = "$(jq -r .incompleteCount "$READINESS")"
              echo "DAILY_HISTORY_BARRIER=$(jq -r .remainingHistoryAndOtherIncompleteCount "$H") / CA_PIT=$(jq -r .corporateActionPitUnverifiedCount "$H")" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "PRELIMINARY_PV_MATCHED=$(jq -r .preliminaryMatchedCount "$PRELIMINARY") / NO_FORMAL_SELECTED_ZERO_PICK_OR_FROZEN" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "DAILY_SELECTION_READINESS=$(jq -r .state "$READINESS") / WATCH=$(jq -r .state "$PRELIMINARY")" >> "$GITHUB_STEP_SUMMARY"
      # Optional supplemental native CA original evidence for the SAME T
      # already proven by A1 source+auditor, not another Final/Frozen job.
      # Never run on this workflow's self-path 121/122 push diagnostic.
      - name: Observe six native CA sources and report present-action risks only
        if: success() && github.event_name != 'push'
        continue-on-error: true
        env:
          S2_A1_AUDIT_SOURCE_DIR: /tmp/s2-source-for-independent-readback
        run: |
          set -euo pipefail
          node --check system2/scripts/run_m09_daily_ca_negative_advisory_readonly_v0_1.mjs
          node --test system2/tests/run_m09_daily_ca_negative_advisory_readonly_v0_1.test.mjs
          node system2/scripts/run_m09_daily_ca_negative_advisory_readonly_v0_1.mjs
          REPORT=/tmp/s2-m09-daily-ca-negative-readonly/daily-ca-advisory.json
          test -s "$REPORT"
          test "$(jq -r .noEventMayBeClaimed "$REPORT")" = 'false'
          test "$(jq -r .formalSelectionAuthorized "$REPORT")" = 'false'
          test "$(jq -r .frozenD1Written "$REPORT")" = 'false'
          test "$(jq -r .selectedCount "$REPORT")" = 'null'
          echo "CA negative overlay=$(jq -r .state "$REPORT"), marketDate=$(jq -r .marketDate "$REPORT"), known-event previews=$(jq -r .caKnownEventPreviewCount "$REPORT")/$(jq -r .preliminaryCount "$REPORT"). Absence always UNKNOWN; do not backdate into decision." >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve separate CA original bytes and advisory, never Frozen
        if: always() && github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: s2-m09-daily-ca-observed-risk-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/s2-m09-daily-ca-negative-readonly/
          retention-days: 7
          if-no-files-found: warn
      # Native CFI is ONLY a current-observation supplement to the exact
      # separately audited 122/122 A1 source; never a historical ordinary
      # equity PIT admission, even if all preview securities are Stocks.
      # Isolated from the on-main push self-test (121/122 fake-denial).
      - name: Observe native ISIN CFI for this exact audited preview only
        if: success() && github.event_name != 'push'
        continue-on-error: true
        run: |
          set -euo pipefail
          node --check system2/scripts/probe_m09_audited_preview_native_cfi_readonly_v0_1.mjs
          node --test system2/tests/probe_m09_audited_preview_native_cfi_readonly_v0_1.test.mjs
          node system2/scripts/probe_m09_audited_preview_native_cfi_readonly_v0_1.mjs
          R=/tmp/s2-m09-preview-native-cfi/preview-native-cfi.json
          test -s "$R"
          test "$(jq -r .historicalOrdinarySharePitCertified "$R")" = '0'
          test "$(jq -r .historicalOrdinarySharePitDenominatorCertified "$R")" = 'false'
          test "$(jq -r .formalShortMomentumQualified "$R")" = 'false'
          test "$(jq -r .selectedCount "$R")" = 'null'
          test "$(jq -r .frozenD1Written "$R")" = 'false'
          test "$(jq -r .preliminaryDenominator "$R")" -le 30
          test "$(jq -r .perSymbolNativeRequestsMade "$R")" = "$(jq -r .preliminaryDenominator "$R")"
          echo "A1 SAME-T native current security-class ONLY: $(jq -r .currentNativeStockCfiObserved "$R")/$(jq -r .preliminaryDenominator "$R") preview Stocks, TIB=$(jq -r .currentNativeInnovationBoardStocks "$R"), NO HISTORICAL PIT or Frozen." >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve native ISIN CFI originals for independent audit
        if: always() && github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: s2-m09-daily-native-cfi-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/s2-m09-preview-native-cfi/
          retention-days: 7
          if-no-files-found: warn
      - name: Preserve sanitized hash receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system2-shared-official-a1-independent-audit-${{ github.run_id }}
          path: |
            /tmp/s2-shared-a1-independent-audit/audit-receipt.json
            /tmp/s2-a1-stage1-readonly/summary.json
            /tmp/s2-a1-stage1-readonly/daily-selection-readiness.json
            /tmp/s2-a1-stage1-readonly/preliminary-pv-watch.json
            /tmp/s2-a1-stage1-readonly/preliminary-watch-report.md
            /tmp/s2-a1-stage1-readonly/preliminary-watch-report-meta.json
            /tmp/s2-a1-stage1-readonly/history-barrier.json
          retention-days: 7
          if-no-files-found: warn
      - name: Safety declaration
        if: always()
        run: |
          echo 'This independent source audit cannot certify PIT or continuity and cannot select or freeze stocks.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Original raw files never written into the public GitHub source repo. Zero D1/R2, V8 Formal, order or push effects.' >> "$GITHUB_STEP_SUMMARY"
