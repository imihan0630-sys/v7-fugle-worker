name: System2 S2-07 MOPS Exact-Version Population V1.6 Readonly

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "system2/runtime/s2_07_mops_exact_version_population_v1_6.mjs"
      - "system2/tests/s2_07_mops_exact_version_population_v1_6.test.mjs"
      - "system2/scripts/probe_s2_07_mops_exact_version_population_readonly_v1_6.mjs"
      - "system2/SYSTEM2_S2_07_MOPS_EXACT_VERSION_POPULATION_V1_6.md"
      - ".github/workflows/system2-s2-07-mops-exact-version-population-v1-6-readonly.yml"
  push:
    branches: [main]
    paths:
      - "system2/runtime/s2_07_mops_exact_version_population_v1_6.mjs"
      - "system2/tests/s2_07_mops_exact_version_population_v1_6.test.mjs"
      - "system2/scripts/probe_s2_07_mops_exact_version_population_readonly_v1_6.mjs"
      - "system2/SYSTEM2_S2_07_MOPS_EXACT_VERSION_POPULATION_V1_6.md"
      - ".github/workflows/system2-s2-07-mops-exact-version-population-v1-6-readonly.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: V1.6 exact-version contract tests
        run: node system2/tests/s2_07_mops_exact_version_population_v1_6.test.mjs

      - name: Physical prospective MOPS exact-version population capture
        run: node system2/scripts/probe_s2_07_mops_exact_version_population_readonly_v1_6.mjs

      - name: No mutation scheduler or System1 authority
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ! grep -qE '\b(INSERT|UPDATE|DELETE|REPLACE|DROP|ALTER|CREATE)\b' system2/scripts/probe_s2_07_mops_exact_version_population_readonly_v1_6.mjs
          ! grep -qE 'wrangler[[:space:]]+(deploy|secret)|secret[[:space:]]+put|workers[[:space:]]+deploy|cron' system2/scripts/probe_s2_07_mops_exact_version_population_readonly_v1_6.mjs
          git diff --exit-code -- Worker.js wrangler.toml

      - name: Upload physical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s2-07-mops-exact-version-population-v1-6
          path: /tmp/S2_07_MOPS_EXACT_VERSION_POPULATION_V1_6_PHYSICAL_20261007.json
          retention-days: 14
