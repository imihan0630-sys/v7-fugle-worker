name: System2 Bounded Revision Event Linkage V0.3 Readonly

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "system2/runtime/bounded_revision_event_linkage_v0_3.mjs"
      - "system2/tests/bounded_revision_event_linkage_v0_3.test.mjs"
      - "system2/scripts/probe_bounded_revision_event_linkage_narrow_readonly_v0_3.mjs"
      - "system2/SYSTEM2_BOUNDED_REVISION_EVENT_LINKAGE_V0_3.md"
      - ".github/workflows/system2-bounded-revision-event-linkage-v0-3-readonly.yml"
  push:
    branches: [main]
    paths:
      - "system2/runtime/bounded_revision_event_linkage_v0_3.mjs"
      - "system2/tests/bounded_revision_event_linkage_v0_3.test.mjs"
      - "system2/scripts/probe_bounded_revision_event_linkage_narrow_readonly_v0_3.mjs"
      - "system2/SYSTEM2_BOUNDED_REVISION_EVENT_LINKAGE_V0_3.md"
      - ".github/workflows/system2-bounded-revision-event-linkage-v0-3-readonly.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: node system2/tests/bounded_revision_event_linkage_v0_3.test.mjs
      - run: node system2/scripts/probe_bounded_revision_event_linkage_narrow_readonly_v0_3.mjs
      - shell: bash
        run: |
          set -euo pipefail
          ! grep -qE 'CLOUDFLARE|SYSTEM2_DB|wrangler|secret|deploy|INSERT|UPDATE|DELETE' system2/scripts/probe_bounded_revision_event_linkage_narrow_readonly_v0_3.mjs
          echo "Read-only V0.3 narrowing boundary PASS"
