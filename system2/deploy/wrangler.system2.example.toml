# System 2 isolated research deployment EXAMPLE ONLY.
# This file is not the repository root wrangler config and is not deployed by current production workflows.
# Replace placeholders only after explicit Worker deployment authorization.

name = "system2-shadow-research"
main = "system2/deploy/worker.mjs"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

[triggers]
# One Cloudflare Cron trigger covers both authorized windows so the Free-plan
# account limit is respected without removing any System 1 production trigger.
# Runtime admits 08:55-13:40 Asia/Taipei for monitoring and exactly 19:00 for
# the next-session bounded-pool refresh; all other invocations exit without market calls.
crons = ["*/5 0-5,11 * * 1-5"]

[[d1_databases]]
binding = "SYSTEM2_DB"
database_name = "system2-research"
database_id = "REPLACE_WITH_SEPARATE_SYSTEM2_DATABASE_ID"
migrations_dir = "system2/sql"

# Isolated research cold-history object storage. This example does not create
# or deploy the bucket; provisioning requires a separately authorized R2 step.
[[r2_buckets]]
binding = "SYSTEM2_HISTORY_BUCKET"
bucket_name = "system2-historical-research"

[vars]
SYSTEM2_CAPTURE_ENABLED = "false"
SYSTEM2_CAPTURE_MODE = "LIMITED_PROSPECTIVE_SHADOW"
SYSTEM2_CAPTURE_CONTRACT_VERSION = "0.1"
SYSTEM2_RESONANCE_ENABLED = "true"
SYSTEM2_RESONANCE_CONTRACT_VERSION = "0.1"

# Intentionally absent in V0.1:
# - routes
# - production service bindings
# - KV bindings
# - production database bindings
#
# FUGLE_API_KEY is a Worker secret, never a plain-text variable in this file.
# General System2 selection capture remains disabled; only the isolated bounded
# resonance schedule is enabled by the resonance variables above.
